name: release dry run

# The bundles ordinary CI never builds: app/**, packaging/** and the packages a bundle
# carries. release-please.yml calls release.yml the same way for the release branch;
# this covers a pull request into main touching the same surface, and the nightly schedule.
on:
  schedule:
    - cron: "10 5 * * *"
  # Into main only: the bundles take longer than a pull request into the development branch waits (docs/landing.md).
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "packaging/**"
      - "src/poolhouse/fleet/**"
      - "src/poolhouse/ui/**"
      - ".github/workflows/release*.yml"
  # release-please.yml dispatches this on the release branch, whose pull request starts no run.
  workflow_dispatch:

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
