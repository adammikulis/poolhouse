name: redteam
# The red-team tests run here; the tests and scenarios that need a model skip with the reason when no
# llama-server and installed GGUF exist, which a hosted runner does not have. No model is faked: the
# measurement against a real model (chat, loop, compaction, isolation, fleet's proxy) is run by hand
# on a machine that has one and compared with `compare` (docs/redteam.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "src/poolhouse/**"
      - "tests/redteam*/**"
      - "tests/test_redteam_*.py"
      - "docs/redteam/**"
      - "scripts/redteam*"
      - ".github/workflows/redteam.yml"

permissions:
  contents: read

concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[test,store,hub,web,plot,privacy,guardrails,mcp,memory,fleet-onboard,redteam]" pytest-timeout pytest-xdist pyyaml psutil numpy pillow networkx
      - name: build the node the tests start
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rustc cargo
          binary=$(python scripts/testnode.py build)
          echo "DEV_TEST_NODE_BINARY=$binary" >> "$GITHUB_ENV"
      - name: tests
        run: python -m pytest tests/test_redteam_*.py -q --redteam -n 0
