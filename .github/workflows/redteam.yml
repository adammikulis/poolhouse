name: redteam
# The red-team tests run here. The attacks on a real model do not: a hosted runner has no GPU and no
# installed model, and nothing stands in for one (AGENTS.md, "Never a fake model"). The last step says so in
# every run: a warning annotation and the run's summary name what was not run, why, and the command that
# runs it on a machine that has the model, against docs/redteam/baseline-real-model-2026-10-22.json
# (docs/redteam.md, "Baselines and the gate"). The tests that need a real model
# (tests/test_redteam_sentinel_model.py, the end-to-end test in tests/test_redteam_lab_home.py) are marked
# real_model and slow, are not collected here, and run nightly in the `real-model` job of ci.yml, which fetches
# the pinned model and a llama-server; on a machine without them they fail, never skip.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "src/poolhouse/**"
      - "tests/redteam*/**"
      - "tests/test_redteam_*.py"
      - "docs/redteam/**"
      - "scripts/redteam*"
      - ".github/workflows/redteam.yml"

permissions:
  contents: read

concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install
        run: python -m pip install -e ".[test,store,hub,web,plot,privacy,guardrails,mcp,memory,fleet-onboard,redteam]" pytest-timeout pytest-xdist pyyaml psutil numpy pillow networkx
      - name: build the node the tests start
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rustc cargo
          binary=$(python scripts/testnode.py build)
          echo "DEV_TEST_NODE_BINARY=$binary" >> "$GITHUB_ENV"
      - name: tests
        run: python -m pytest tests/test_redteam_*.py -q --redteam -n 0
      - name: red-team attacks against a real model are NOT RUN on this runner
        env:
          REASON: a hosted runner has no GPU and no installed model, and nothing stands in for one
          PULL: poolhouse-models pull hf:lmstudio-community/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          COMMAND: python -m poolhouse.redteam run --model Qwen3-4B-Instruct-2507-Q4_K_M.gguf --scenarios extraction,fleet,sentinel --against docs/redteam/baseline-real-model-2026-10-22.json --success-tolerance 0 --ttd-tolerance 1
        run: |
          echo "::warning title=red-team attacks against a real model were not run::$REASON. On a machine with the model ($PULL) run: $COMMAND"
          {
            echo "### Red-team attacks against a real model: NOT RUN on this runner"
            echo
            echo "$REASON."
            echo
            echo "On a machine that has the model, fetch it once and run the gate:"
            echo
            echo '```'
            echo "$PULL"
            echo "$COMMAND"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
