<!-- launch-needed: shown when the page was opened without the ticket the app hands its own window -->
<template>
  <div class="centre" id="launch-needed" hidden>
    <div class="card">
      <div class="hint">POOLHOUSE</div>
      <h1>Reconnect to Poolhouse</h1>
      <p class="sub">The local connection ended. Open the Poolhouse app to reconnect.</p>
      <p id="launch-needed-app" hidden><button id="launch-needed-go">Reconnect this window</button></p>
      <div id="launch-needed-note" role="alert" aria-live="polite"></div>
    </div>
  </div>
</template>
<script>
(function () {
  const M = window.fleetModel;

  class LaunchNeeded extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#launch-needed");
      const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
      const reconnect = async (explicit = false) => {
        if (M.route !== "launch-needed") return;
        const button = this.querySelector("#launch-needed-go"), note = this.querySelector("#launch-needed-note");
        button.disabled = true;
        note.textContent = "Reconnecting to Poolhouse…";
        const connected = await M.renewNativeSession(explicit);
        button.disabled = false;
        if (M.route === "launch-needed") note.textContent = connected ? "" : "The local connection is unavailable. Reconnect when Poolhouse is ready.";
      };
      if (invoke) {
        this.querySelector("#launch-needed-app").hidden = false;
        this.querySelector("#launch-needed-go").onclick = () => reconnect(true);
        window.addEventListener("poolhouse-native-reopen", () => M.reopenNative().catch(() => {}));
      }
      M.onRoute((route) => {
        this.box.hidden = route !== "launch-needed";
        if (route === "launch-needed" && invoke) reconnect();
      });
    }
  }
  customElements.define("launch-needed", LaunchNeeded);
})();
</script>
