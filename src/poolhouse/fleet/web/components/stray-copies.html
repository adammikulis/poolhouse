<script>
(function () {
  const M = window.fleetModel;

  class StrayCopies extends HTMLElement {
    connectedCallback() { void this.look(); }

    async look(asked) {
      let answer;
      try {
        answer = await M.api(asked ? "/ui/stray-copies/remove" : "/ui/stray-copies",
          asked ? {method: "POST", body: JSON.stringify({id: asked})} : undefined);
      } catch (error) { answer = {error: error.message}; }
      if (!answer.copies) {                       // not this computer's signed-in window: it shows nothing
        if (asked) this.querySelector("[role=status]").textContent = answer.error || "Could not remove that copy.";
        return;
      }
      this.show(answer.copies, asked ? answer.error : "");
    }

    show(copies, error) {
      if (!copies.length) { this.replaceChildren(); return; }
      const rows = copies.map(copy => M.el("li", {},
        M.el("span", {}, copy.said + ". "),
        M.el("button", {type: "button", title: copy.command, onclick: event => {
          event.target.disabled = true;
          void this.look(copy.id);
        }}, "Remove this copy")));
      this.replaceChildren(M.el("div", {class: "err"},
        M.el("strong", {}, "Another copy of Poolhouse is on this computer and could run instead of this one."),
        M.el("ul", {}, ...rows),
        M.el("div", {class: "muted"}, "Removing takes only Poolhouse out of that Python. Keeping it changes nothing."),
        M.el("div", {role: "status"}, error || "")));
    }
  }

  customElements.define("stray-copies", StrayCopies);
})();
</script>
