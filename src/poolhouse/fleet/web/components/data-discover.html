<style>
data-discover {display:flex;flex:1;min-height:0}
data-discover>section {display:flex;flex-direction:column;gap:12px;min-height:0;width:100%;overflow:hidden}
data-discover .dataset-status {margin:0}data-discover .dataset-status:empty{display:none}
data-discover .dataset-results-panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
data-discover .dataset-inspect{min-height:0;overflow:hidden;display:flex;flex-direction:column}
data-discover .dataset-search { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin:0; }
data-discover .dataset-search label { margin:0; display:grid; gap:6px; }
data-discover .dataset-search input { width:220px; }
data-discover .data-discovery { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(0,1.6fr); gap:var(--page-gap);flex:1;min-height:0;overflow:hidden; }
data-discover .dataset-results { display:grid; grid-auto-rows:max-content; gap:8px; align-content:start;overflow:auto;min-height:0; }
data-discover .dataset-result { display:grid; gap:6px; width:100%; text-align:left; overflow-wrap:anywhere; background:var(--bg-raised); color:var(--text); border:1px solid var(--line); }
data-discover .dataset-result[aria-pressed=true] { border-color:var(--accent); }
data-discover .dataset-detail { min-width:0; background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--page-panel-radius);padding:var(--page-gutter); }
data-discover .dataset-metadata { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
data-discover .dataset-metadata span { border:1px solid var(--line); padding:5px 9px; border-radius:20px; font-size:12px; }
data-discover .dataset-subsets { display:flex; gap:12px; flex-wrap:wrap; }
data-discover .dataset-description { white-space:pre-wrap; overflow-wrap:anywhere; max-height:200px; overflow:auto; }
data-discover .dataset-revision { font-size:11px; overflow-wrap:anywhere; color:var(--muted); }
@media(max-width:850px){data-discover .data-discovery{grid-template-columns:1fr;grid-template-rows:minmax(100px,.4fr) minmax(0,1fr)}data-discover .dataset-search{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}data-discover .dataset-search label:first-child{grid-column:1/-1}data-discover .dataset-search input,data-discover .dataset-search select{max-width:100%;width:100%;min-width:0}}
</style>
<template>
 <section aria-label="Discover Hugging Face datasets">
  <p class="intro">Browse public datasets from Hugging Face. Preview their fields and choose a subset and split before importing data.</p>
  <form class="dataset-search" role="search" aria-label="Find datasets">
   <label>Search Hugging Face<input type="search" name="query" maxlength="256" placeholder="Topics, tasks or dataset name"></label>
   <label>Task<select name="task" aria-label="Dataset task"><option value="">All tasks</option><option value="text-generation">Text generation</option><option value="text-classification">Text classification</option><option value="question-answering">Question answering</option><option value="translation">Translation</option><option value="summarization">Summarization</option><option value="token-classification">Token classification</option></select></label>
   <label>Language<input name="language" placeholder="Any · or en, fr…" maxlength="16" aria-label="Dataset language code"></label>
   <label>Sort<select name="sort" aria-label="Dataset sort"><option value="downloads">Most downloaded</option><option value="likes">Most liked</option><option value="lastModified">Recently updated</option></select></label>
   <button type="submit" class="data-primary">Search datasets</button>
  </form>
  <p class="dataset-status" role="status" aria-live="polite"></p>
  <div class="data-discovery"><div class="dataset-results-panel"><div class="dataset-results" tabindex="0" aria-label="Hugging Face dataset results"></div><button type="button" class="dataset-more" hidden>Load more datasets</button></div><div class="dataset-inspect" tabindex="0" aria-label="Dataset details"><data-import></data-import></div></div>
 </section>
</template>
<script>
(function(){
 const M=window.fleetModel,D=window.datasetModel,E=M.el;
 class DatasetDiscover extends HTMLElement{
  connectedCallback(){
   if(this.wired)return;this.wired=true;this.generation=0;this.rows=[];this.cursor=null;this.chosen=null;
   this.importer=this.querySelector('data-import');this.form=this.querySelector('form');this.note=this.querySelector('.dataset-status');this.detail=this.querySelector('.dataset-detail');
   this.form.onsubmit=event=>{event.preventDefault();this.search(false);};
   this.form.oninput=()=>{this.importer.select(null,null);this.generation++;this.cursor=null;this.chosen=null;this.querySelector('.dataset-more').hidden=true;this.note.textContent='Search to apply these filters.';};
   this.querySelector('.dataset-more').onclick=()=>this.search(true);
   M.onRoute(route=>{this.generation++;if(route!=='data')this.active=false;});
  }
  enter(){this.active=true;this.importer.enter();if(!this.rows.length)this.search(false);}
  leave(){this.importer.leave();this.active=false;this.generation++;}
  held(){return {generation:this.generation,chosen:this.chosen};}
  current(held){return this.active&&this.isConnected&&M.route==='data'&&location.hash==='#data'&&!this.closest('[hidden]')&&held.generation===this.generation&&held.chosen===this.chosen;}
  async read(action,params,held){
   const result=await M.api('/ui/workspace/datasets/'+action+'?'+new URLSearchParams(params));
   if(!this.current(held))return null;
   if(!result.ok){M.refused(result);throw Error(result.error||'Datasets are unavailable.');}
   return result;
  }
  async search(more){
   const params=Object.fromEntries(new FormData(this.form));
   if(more&&!this.cursor)return;
   if(more)params.cursor=this.cursor;else{this.importer.select(null,null);this.rows=[];this.chosen=null;this.detail.replaceChildren(E('p',{},'Choose a dataset to inspect its data.'));}
   this.generation++;const held=this.held();this.note.textContent='Searching Hugging Face…';
   try{
    const result=await this.read('search',params,held);if(!result)return;
    if(!Array.isArray(result.datasets))throw Error('The dataset search returned an invalid result.');
    this.rows=more?[...this.rows,...result.datasets]:result.datasets;this.cursor=result.cursor;
    this.draw();this.note.textContent=this.rows.length+' datasets · metadata from Hugging Face';
   }catch(error){if(this.current(held))this.note.textContent=error.message;}
  }
  draw(){
   this.querySelector('.dataset-results').replaceChildren(...this.rows.map(row=>{
    const button=E('button',{type:'button',class:'dataset-result','aria-pressed':String(this.chosen===row.id)},E('strong',{},row.title),E('small',{},(row.downloads??'—')+' downloads · '+(row.likes??'—')+' likes'),E('small',{},'Licence: '+row.license+(row.gated?' · Access restricted':'')));
    button.onclick=()=>this.open(row);return button;
   }));
   if(!this.rows.length)this.querySelector('.dataset-results').append(E('p',{},'No datasets match these filters. Try another topic or task.'));
   this.querySelector('.dataset-more').hidden=!this.cursor;
  }
  async open(row){
   this.importer.select(null,null);this.generation++;this.chosen=row.id;const held=this.held();this.draw();this.detail.replaceChildren(E('p',{},'Loading dataset details…'));
   try{
    const result=await this.read('details',{repo:row.id},held);if(!result)return;
    if(result.id!==row.id||!Array.isArray(result.splits))throw Error('The selected dataset details changed.');
    this.metadata=result;this.drawDetails(result);this.note.textContent='Choose a subset and split to see current sample rows.';
   }catch(error){if(this.current(held))this.detail.replaceChildren(E('p',{},error.message));}
  }
  drawDetails(row){
   this.config=E('select',{'aria-label':'Dataset subset'});this.split=E('select',{'aria-label':'Dataset split'});
   const configs=[...new Set(row.splits.map(item=>item.config))];this.config.append(...configs.map(value=>E('option',{value},value)));
   this.sample=E('div');this.pins=E('p',{class:'dataset-revision'});
   this.detail.replaceChildren(E('h2',{},row.id),E('p',{class:'dataset-description'},row.description),E('div',{class:'dataset-metadata'},E('span',{},'Licence: '+row.license),E('span',{},row.gated?'Access restricted':'Public catalogue')),
    E('div',{class:'dataset-subsets'},E('label',{},'Subset',this.config),E('label',{},'Split',this.split)),this.pins,this.sample);
   const choose=()=>{
    this.split.replaceChildren(...row.splits.filter(item=>item.config===this.config.value).map(item=>E('option',{value:item.split},item.split+' · '+(item.rows??'unknown')+' rows · '+(item.bytes===null?'unknown size':M.fileSize(item.bytes)))));
    this.preview();
   };
   this.config.onchange=choose;this.split.onchange=()=>this.preview();
   if(configs.length)choose();else this.sample.append(E('p',{},'No dataset splits are available from the viewer.'));
  }
  async preview(){
   this.generation++;const held=this.held(),params={repo:this.chosen,config:this.config.value,split:this.split.value};
   this.selection=null;this.importer.select(null,null);this.sample.replaceChildren(E('p',{},'Loading sample rows and immutable export information…'));this.pins.textContent='';
   try{
    const [sample,selection]=await Promise.allSettled([this.read('preview',params,held),this.read('selection',params,held)]);
    if(!this.current(held))return;
    if(sample.status==='rejected')throw sample.reason;if(!sample.value)return;
    this.previewData=sample.value;
    this.importer.select(params,sample.value,()=>this.active&&M.route==='data'&&location.hash==='#data'&&this.previewData===sample.value&&this.chosen===params.repo&&this.config.value===params.config&&this.split.value===params.split);
    D.table(this.sample,sample.value.rows,sample.value.columns,'Current viewer sample · '+sample.value.rows.length+' of '+(sample.value.total_rows??'unknown')+' rows'+(sample.value.partial?' · viewer covers only part of this dataset':'')+' · not an immutable file preview');
    if(selection.status==='fulfilled'&&selection.value){
     this.selection=selection.value;this.pins.textContent='Source revision: '+selection.value.revision+' · Parquet export revision: '+selection.value.converted_revision;
    }else this.pins.textContent='Immutable export unavailable: '+(selection.reason?.message||'This split has no pinned data-only export.');
   }catch(error){if(this.current(held))this.sample.replaceChildren(E('p',{},error.message));}
  }
 }
 customElements.define('data-discover',DatasetDiscover);
})();
</script>
