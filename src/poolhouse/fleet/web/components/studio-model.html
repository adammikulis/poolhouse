<script>
  (function () {
    const S = (window.studioModel = {}),
      E = window.fleetModel.el;
    S.clone = (value) => structuredClone(value);
    S.empty = () => ({
      nodes: [],
      edges: [],
      controls: [],
      groups: {},
      layout: { nodes: {}, viewport: { x: 0, y: 0, zoom: 1 } },
    });
    S.id = () => crypto.randomUUID();
    S.selectionContext = (editor) => {
      const inherited = editor.context.some(
        (c) =>
          Object.keys(c.definition.control_inputs || {}).length ||
          (c.parent.controls || []).some((e) => e.target.node === c.node.id),
      );
      return inherited
        ? {
            graph: editor.rootGraph(),
            selected: new Set([editor.context[0].node.id]),
            inherited: true,
          }
        : { graph: editor.graph, selected: editor.selected, inherited: false };
    };
    S.selectionDependencies = (graph, selected) => {
      const ids = new Set(selected);
      let changed = true;
      while (changed) {
        changed = false;
        for (const edge of [...graph.edges, ...(graph.controls || [])])
          if (ids.has(edge.target.node) && !ids.has(edge.source.node)) {
            ids.add(edge.source.node);
            changed = true;
          }
      }
      return ids;
    };
    S.compatible = (output, input) =>
      (input.accepted_types || [input.type]).includes(output.type);
    S.portReference = (node, port, side) => ({
      node: node.id,
      port: port.name,
      type: port.type,
      accepted_types: port.accepted_types,
      side,
    });
    S.api = async (path, body, method) => {
      const r = await window.fleetModel.api(
        "/ui/studio" + path,
        body === undefined
          ? {}
          : { method: method || "POST", body: JSON.stringify(body) },
      );
      if (!r.ok) {
        window.fleetModel.refused(r);
        throw Object.assign(Error(r.error || "Studio request unavailable"), {
          response: r,
        });
      }
      return r;
    };
    S.spec = (editor, node, seen = []) => {
      if (node.type === "import.unsupported" && S.n8nSpec) return S.n8nSpec(node);
      if (node.type !== "group") {
        const spec = editor.specs.find(
          (s) => s.type === node.type && s.version === node.version,
        ) || {
          title: node.type,
          inputs: [],
          outputs: [],
          parameters: { properties: {} },
        };
        return node.name ? { ...spec, title: node.name } : spec;
      }
      if (seen.includes(node.group) || seen.length > 16)
        return {
          title: "Invalid recursive group",
          inputs: [],
          outputs: [],
          parameters: { properties: {} },
        };
      const group = editor.graph.groups[node.group] || {},
        inner = {
          ...editor,
          graph: { ...editor.graph, groups: editor.graph.groups },
        };
      const ports = (side) =>
        Object.entries(group[side] || {}).map(([name, ref]) => {
          const n = (group.nodes || []).find((n) => n.id === ref.node);
          const p = n
            ? S.spec(inner, n, [...seen, node.group])[side]?.find(
                (p) => p.name === ref.port,
              )
            : null;
          return { ...p, name, type: p?.type || "unknown" };
        });
      const properties = Object.fromEntries(
        Object.entries(group.parameters || {}).map(([name, ref]) => {
          const n = (group.nodes || []).find((n) => n.id === ref.node);
          return [
            name,
            n
              ? S.spec(inner, n, [...seen, node.group]).parameters
                  ?.properties?.[ref.parameter] || {}
              : {},
          ];
        }),
      );
      return {
        title: group.name || "Group",
        family: "Saved groups",
        inputs: ports("inputs"),
        outputs: ports("outputs"),
        control_inputs: Object.keys(group.control_inputs || {}).map((name) => ({
          name,
          type: "gate",
          required: true,
        })),
        parameters: { properties },
      };
    };
    S.parameterChange = ({editor, node, name, host}) => {
      const graph = editor.graph, root = editor.rootGraph(), load = editor.loadContext, workflow = editor.workflowId, selection = editor.workflowContext;
      let expected = node.parameters[name];
      const current = () => host.isConnected && editor.isConnected && editor.graph === graph
        && editor.rootGraph() === root && editor.loadContext === load && editor.workflowContext === selection && (!workflow || editor.workflowId === workflow)
        && graph.nodes.includes(node) && node.parameters[name] === expected;
      const change = (value, paint = true) => {
        if (!current()) return false;
        editor.checkpoint();
        node.parameters[name] = value;
        expected = value;
        editor.changed(paint);
        if (!paint) editor.canvas.paint?.();
        return true;
      };
      change.current = current;
      return change;
    };
    S.field = (host, name, schema, value, change) => {
      if (schema.type === 'object' && ['record-map', 'record-condition'].includes(schema.format)) {
        if (host.classList.contains('studio-node-controls')) {
          const button = E('button', {type: 'button', onclick: () => {
            if (!button.isConnected || !change.current()) return;
            const editor = host.closest('studio-view'), id = host.closest('[data-node-id]')?.dataset.nodeId;
            if (!editor?.graph.nodes.some(node => node.id === id)) return;
            editor.select(id);
            editor.querySelector('.studio-inspector input, .studio-inspector select')?.focus();
          }}, schema.format === 'record-map' ? 'Configure field mapping' : 'Configure condition');
          host.append(button);
          return button;
        }
        return window.studioRecordFields.render(host, {format: schema.format, value: value ?? schema.default,
          change, current: change.current});
      }
      const id = "studio-" + S.id(),
        label = E("label", { for: id }, schema.title || name);
      let input;
      if (name === "max_tokens" && schema.type === "integer") {
        input = E("output-token-slider", {id});
        input.configure({label:schema.title || name, nullable:false,
          minimum:schema.minimum ?? 1, maximum:schema.maximum});
        input.value = value ?? schema.default;
        input.onchange = () => change(Number(input.value));
        host.append(label, input);
        return input;
      }
      if (schema.enum) {
        input = E(
          "select",
          { id },
          ...schema.enum.map((v) =>
            E("option", { value: String(v) }, String(v)),
          ),
        );
        input.value = String(value ?? schema.default ?? schema.enum[0]);
      } else if (schema.type === "boolean") {
        input = E("input", { id, type: "checkbox" });
        input.checked = value ?? schema.default ?? false;
      } else {
        input = E("input", {
          id,
          type: ["number", "integer"].includes(schema.type) ? "number" : "text",
          min: schema.minimum,
          max: schema.maximum,
          step: schema.type === "integer" ? 1 : "any",
        });
        input.value = value ?? schema.default ?? "";
      }
      input.onchange = () => {
        if (!input.isConnected) return;
        change(schema.type === "boolean" ? input.checked
          : ["number", "integer"].includes(schema.type) ? Number(input.value) : input.value);
      };
      host.append(label, input);
      return input;
    };
    S.copyGroup = (editor, source, id, mapped = new Map()) => {
      if (mapped.has(id)) return mapped.get(id);
      const value = source[id];
      if (!value) throw Error("The reusable group is missing.");
      const copy = S.id();
      mapped.set(id, copy);
      const definition = S.clone(value);
      editor.graph.groups[copy] = definition;
      for (const node of definition.nodes)
        if (node.type === "group")
          node.group = S.copyGroup(editor, source, node.group, mapped);
      return copy;
    };
    S.defaults = (spec) =>
      Object.fromEntries(
        Object.entries(spec.parameters?.properties || {})
          .filter(([, v]) => v.default !== undefined)
          .map(([k, v]) => [k, S.clone(v.default)]),
      );
    S.position = (editor, id) =>
      editor.graph.layout.nodes[id] || { x: 40, y: 40 };
    S.downloadBlob = (name, blob) => {
      const url = URL.createObjectURL(blob),
        a = E("a", { href: url, download: name });
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    S.download = (name, value) =>
      S.downloadBlob(
        name,
        new Blob([JSON.stringify(value, null, 2)], {
          type: "application/json",
        }),
      );
  })();
</script>
