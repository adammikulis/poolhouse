<style>
projects-view { display:contents; }
projects-view #projects { padding:calc(28px * var(--ui-density,1)) calc(32px * var(--ui-density,1)); max-width:1500px; width:100%; }
projects-view .project-heading { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:24px; }
projects-view .project-heading h1 { margin:0 0 8px; } projects-view .project-heading p { margin:0; }
projects-view .project-layout { display:grid; grid-template-columns:300px minmax(0,1fr); gap:24px; align-items:start; }
projects-view .panel { background:var(--bg-raised); border:1px solid var(--line); border-radius:16px; padding:calc(22px * var(--ui-density,1)); margin:0 0 18px; }
projects-view .panel h2 { margin-top:0; font-size:1.286rem; }
projects-view #project-list .model-row { display:block; padding:calc(14px * var(--ui-density,1)) 0; border-bottom:1px solid var(--line); }
projects-view #project-list button { margin:10px 0 0; width:100%; }
projects-view #project-panel { min-height:240px; }
@media(max-width:900px) { projects-view .project-layout { grid-template-columns:1fr; } projects-view #projects { padding:calc(20px * var(--ui-density,1)); } }
</style>
<template>
  <main id="projects" class="settingsmain" hidden>
    <header class="project-heading"><div><h1 data-t="projects.title">Projects</h1></div></header>
    <p id="projects-note" role="status"></p>
    <div class="project-layout"><aside><section class="panel"><h2>Share a local project</h2>
      <label for="project-candidate">Project</label><select id="project-candidate"></select>
      <button id="project-share" data-t="action.share">Share with pool</button>
      <p class="hint">Sharing publishes the tracked source snapshot.</p>
    </section>
    <section class="panel"><h2>Shared projects</h2><div id="project-list"></div></section></aside>
    <div><section class="panel" id="project-empty"><h2 data-t="projects.pick">Select a project</h2><p class="hint">Choose a shared project to see where its source is available. Share a local project to start working across your pool.</p></section><section class="panel" id="project-panel" hidden>
      <h2 id="project-title"></h2>
      <p id="project-source"></p>
      <button id="project-checkout">Get source on this device</button>
      <p id="project-checkout-state" role="status"></p>
    </section></div></div>
  </main>
</template>
<script>
(function () {
  const M = window.fleetModel, el = M.el;
  class ProjectsView extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector('#projects');
      this.note = this.querySelector('#projects-note');
      this.candidate = this.querySelector('#project-candidate');
      this.share = this.querySelector('#project-share');
      this.rows = this.querySelector('#project-list');
      this.panel = this.querySelector('#project-panel');
      this.share.onclick = async () => {
        const result = await this.action('/ui/projects', {action: 'share', candidate_id: this.candidate.value});
        if (result?.ok) await this.draw();
      };
      this.querySelector('#project-checkout').onclick = () => this.checkout();
      M.onRoute(route => {
        this.box.hidden = route !== 'projects';
        clearInterval(this.timer);
        if (route === 'projects') { this.draw(); this.timer = setInterval(() => this.draw(), 4000); }
      });
    }

    async draw() {
      if (this.loading) return;
      this.loading = true;
      try {
        const result = await M.api('/ui/projects');
        if (!result.ok) { this.note.textContent = result.error || 'Project sharing is unavailable on this device. Update Poolhouse to enable it.'; return; }
        this.projects = result.projects || [];
        const signature = JSON.stringify([this.projects, result.candidates, result.devices]);
        if (signature !== this.signature) {
          this.signature = signature;
          const selected = this.candidate.value;
          this.candidate.replaceChildren(...(result.candidates || []).map(p => el('option', {value: p.id}, p.name)));
          if ([...this.candidate.options].some(p => p.value === selected)) this.candidate.value = selected;
          this.share.disabled = !this.candidate.value;
          this.rows.replaceChildren(...this.projects.map(p => el('div', {class: 'model-row'},
            el('div', {}, el('b', {}, p.name), el('p', {class: 'hint'}, `${p.is_self ? 'This device' : p.member || p.host || 'Pool device'} · ${p.state || 'Shared'}`)),
            el('button', {onclick: () => this.select(p)}, 'Open project'))));
          if (!this.projects.length) this.rows.append(el('p', {class: 'hint'}, 'No shared projects found yet.'));
          for (const d of result.devices || []) if (d.state === 'upgrade_required' || d.error) {
            this.rows.append(el('p', {class: 'hint'}, `${d.name || d.member}: ${d.error || 'Update Poolhouse on this device to share projects.'}`));
          }
        }
      } catch (error) { this.note.textContent = error.message; }
      finally { this.loading = false; }
    }

    select(project) {
      this.selected = project;
      this.panel.hidden = false;
      this.querySelector('#project-empty').hidden = true;
      this.querySelector('#project-title').textContent = project.name;
      this.querySelector('#project-source').textContent = `Source available on ${project.is_self ? 'this device' : project.host || project.member || 'a pool device'}`;
      this.querySelector('#project-checkout').hidden = !!project.is_self;
      this.querySelector('#project-checkout').disabled = !!this.busy;
      this.querySelector('#project-checkout-state').textContent = project.is_self ? 'Source is already available on this device.' : '';
    }

    async action(path, body) {
      if (this.busy) return null;
      this.busy = true;
      this.share.disabled = true;
      this.querySelector('#project-checkout').disabled = true;
      this.note.textContent = 'Working…';
      try {
        const result = await M.api(path, {method: 'POST', body: JSON.stringify(body)});
        this.note.textContent = result.ok ? 'Done' : result.error || 'The action failed. Try again.';
        return result;
      } catch (error) { this.note.textContent = error.message; return null; }
      finally {
        this.busy = false;
        this.share.disabled = !this.candidate.value;
        this.querySelector('#project-checkout').disabled = false;
      }
    }

    async checkout() {
      const project = this.selected;
      const result = await this.action(`/ui/projects/${encodeURIComponent(project.id)}/checkout`, {member: project.member || project.host || ''});
      if (result?.ok && this.selected === project) this.querySelector('#project-checkout-state').textContent =
        `Source ready at ${result.checkout}.`;
    }
  }
  customElements.define('projects-view', ProjectsView);
})();
</script>
