<!-- first-run: one-time device, model and private coding workspace preparation -->
<template>
  <div class="centre" id="first-run" hidden><div class="card" id="first-run-card"></div></div>
</template>
<style>
first-run .centre { align-items:start; min-height:var(--app-height,100dvh); padding:var(--page-gutter,24px); overflow:auto; }
first-run #first-run-card { max-width:760px; width:100%; border-radius:var(--page-panel-radius,12px); }
first-run .wizard-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; align-items:center; }
first-run .wizard-actions button { width:auto; margin:0; }
first-run .wizard-section { margin-top:24px; }
first-run .wizard-section summary { cursor:pointer; padding:12px 0; }
first-run .wizard-progress { line-height:1.6; margin-top:16px; overflow-wrap:anywhere; }
first-run .opt { display:flex; gap:12px; align-items:start; margin:12px 0; }
first-run .opt input { width:auto; flex:none; margin-top:4px; }
first-run .err:empty { display:none; }
first-run .wizard-step { color:var(--muted); margin-bottom:12px; }
</style>
<script>
(function () {
  const M = window.fleetModel, el = M.el;
  const post = (body) => ({method:'POST', body:JSON.stringify(body)});
  const key = () => crypto.randomUUID().replaceAll('-', '');
  class FirstRun extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true; this.epoch = 0; this.step = 0;
      this.box = this.querySelector('#first-run'); this.card = this.querySelector('#first-run-card');
      this.kept = {}; this.project = null; this.background = true; this.workHours = false;
      try { this.intent = JSON.parse(sessionStorage.getItem('poolhouse.setup.intent') || 'null'); } catch {}
      if (!this.intent || !/^[a-f0-9]{32}$/.test(this.intent.key || '')) this.intent = null;
      M.onRoute(route => {
        this.box.hidden = route !== 'first-run';
        if (route === 'first-run') this.open();
        else { this.epoch++; this.busy = null; this.finishing = null; clearTimeout(this.timer); }
      });
    }
    current(epoch, session) { return M.route === 'first-run' && this.epoch === epoch && M.sessionContext() === session; }
    async request(path, options, epoch = this.epoch, session = M.sessionContext()) {
      const result = await M.api(path, options);
      if (!this.current(epoch, session)) throw Error('Setup is no longer open.');
      if (M.refused(result)) {
        if (M.route === 'first-run') M.signIn('Reconnect this Poolhouse window to continue setup.');
        throw Error(result.error || 'Open Poolhouse again to continue.');
      }
      if (result.error) throw Error(result.error);
      return result;
    }
    async open() {
      const epoch = ++this.epoch, session = M.sessionContext();
      if (this.openSession !== session) {
        if (this.openSession !== undefined) this.clearProjectOperation();
        this.project = null; this.pendingProject = null; this.defaultOperation = null; this.kept = {}; this.modelInstall = null;
        this.invitationOnly = undefined; this.name = undefined; this.systemTheme = null; }
      this.openSession = session; this.operation = null; this.busy = null; this.finishing = null;
      this.progress = this.note(); this.controls = this.actions();
      this.show('Opening setup', 'Checking this device’s current setup…', this.progress, this.controls);
      try {
        this.setup = await this.request('/ui/setup', undefined, epoch, session);
        this.systemTheme = this.setup.needs_setup_theme === true ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : null;
        this.loadTheme(epoch, session);
        this.name ||= this.setup.name;
        this.invitationOnly ??= this.setup.pool_mode === 'prod';
        if (this.intent?.job) { this.step = 2; this.paint(); this.poll(); }
        else this.paint();
      } catch (error) { if (this.current(epoch, session)) this.failure(error); }
    }
    async loadTheme(epoch, session) {
      try {
        const result = await M.api('/ui/settings');
        if (this.current(epoch, session) && result.ok && !result.error) {
          const initial = this.systemTheme && result.theme_registry?.find(theme => theme.id === this.systemTheme);
          M.setPreferences({...result.settings, resolved_theme:initial || result.resolved_theme});
        }
      } catch {}
    }
    show(title, description, ...content) {
      this.errorNote = el('div', {class:'err', role:'alert'});
      const heading = this.heading = el('h1', {tabindex:'-1'}, title);
      this.description = el('p', {class:'sub'}, description);
      this.card.replaceChildren(el('p', {class:'wizard-step'}, `Step ${this.step + 1} of 3`), heading,
        this.description, ...content, this.errorNote);
      heading.focus({preventScroll:true});
    }
    actions(...buttons) { return el('div', {class:'wizard-actions'}, ...buttons); }
    button(label, action, secondary = false) { return el('button', {type:'button', class:secondary ? 'ghost' : '', onclick:action}, label); }
    note() { return el('div', {class:'wizard-progress', role:'status', 'aria-live':'polite'}); }
    async task(button, note, action) {
      if (this.busy) return;
      const operation = {}; this.busy = operation; button.disabled = true; note.textContent = 'Saving…';
      const epoch = this.epoch, session = M.sessionContext();
      try { await action(); }
      catch (error) { if (this.current(epoch, session)) { if (note.isConnected) note.textContent = error.message; else this.failure(error); } }
      finally { if (this.busy === operation) this.busy = null; if (this.current(epoch, session)) button.disabled = false; }
    }
    go(step) { this.epoch++; this.busy = null; this.finishing = null; clearTimeout(this.timer); this.step = step; return this.paint(); }
    paint() { return this.step === 0 ? this.deviceStep() : this.step === 1 ? this.modelStep() : this.preparingStep(); }
    async saveDevice() {
      const result = await this.request('/ui/setup/initial', post({name:this.name.trim() || this.setup.name,
        pool_mode:this.invitationOnly ? 'prod' : 'dev'}));
      if (!result.ok) throw Error('The device name could not be saved.');
      this.setup = result;
    }
    deviceStep() {
      const note = this.note(), input = el('input', {id:'setup-device-name', type:'text', value:this.name || '', autocomplete:'off'});
      input.oninput = () => { this.name = input.value; };
      const connect = el('details', {class:'wizard-section'}, el('summary', {}, 'Join another pool'));
      connect.ontoggle = async () => {
        if (!connect.open || connect.loaded || this.busy) return;
        connect.loaded = true;
        try {
          if (!connect.isConnected) return;
          connect.append(M.poolForm({endpoint:'/ui/setup/join', poolMode:this.invitationOnly ? 'prod' : 'dev',
            group:'default', onComplete:async () => {
              this.setup = await this.request('/ui/setup'); note.textContent = 'Pool connected.';
            }}));
        } catch (error) { connect.loaded = false; note.textContent = error.message; }
      };
      const strict = el('input', {id:'setup-invitation-only', type:'checkbox'}); strict.checked = !!this.invitationOnly;
      strict.onchange = () => { this.invitationOnly = strict.checked; };
      const policy = el('details', {class:'wizard-section'}, el('summary', {}, 'Connection options'),
        el('label', {class:'opt', for:strict.id}, strict, 'Only connect devices I explicitly invite'));
      const next = this.button('Continue', () => this.task(next, note, async () => {
        await this.saveDevice(); await this.go(1);
      }));
      this.show('Welcome to Poolhouse', 'Set up this device once, then chat, code and work with your pool from one place.',
        el('label', {for:input.id}, 'Device name'), input,
        el('p', {class:'hint'}, this.setup.in_pool ? `Connected to ${this.setup.group || 'your pool'}.`
          : 'This device starts its own private pool. You can connect other devices later.'), connect,
        policy, this.actions(next), note);
    }
    async modelStep() {
      const epoch = this.epoch, session = M.sessionContext(), loading = this.note();
      this.show('Make this device ready', 'Poolhouse recommends a model for the memory available now. You can change it before preparing.', loading);
      loading.textContent = 'Checking available models…';
      try {
        this.modelInstall = await M.startupModels(this.kept);
        if (!this.current(epoch, session)) return;
        const note = this.feedback = this.note(), candidateBox = el('div');
        const folderNote = el('p', {class:'hint'}, this.project ? `Coding folder: ${this.project.title}` : 'A private coding workspace will be created for you.');
        const choose = this.button('Choose a coding folder', () => this.task(choose, note, async () => {
          if (!window.__TAURI__?.core?.invoke) throw Error('Choose a folder from the installed Poolhouse window.');
          const challenge = await this.request('/ui/setup/projects/pick', post({}));
          const result = await window.__TAURI__.core.invoke('choose_coding_project', {requestId:challenge.request_id, nonce:challenge.nonce});
          if (!this.current(epoch, session)) return;
          if (result?.purpose !== 'coding-project') throw Error('The folder selection ended. Choose it again.');
          if (result.status === 'cancelled') { note.textContent = 'Folder selection was cancelled.'; return; }
          if (result.status === 'choosing') { note.textContent = 'The folder chooser is still open.'; return; }
          if (result.status === 'needs-project') {
            this.pendingProject = result.project; this.candidate(candidateBox, folderNote, prepare); note.textContent = ''; return;
          }
          if (result.status !== 'complete' || !result.project) throw Error('The folder selection is still open.');
          this.pendingProject = null; candidateBox.replaceChildren(); prepare.disabled = !this.modelInstall.selected;
          this.project = result.project; folderNote.textContent = `Coding folder: ${this.project.title}`; note.textContent = 'Folder selected. Sharing stays off.';
        }), true);
        const background = el('input', {id:'setup-background', type:'checkbox'}); background.checked = this.background;
        background.onchange = () => { this.background = background.checked; };
        const hours = el('input', {id:'setup-work-hours', type:'checkbox'}); hours.checked = this.workHours;
        hours.onchange = () => { this.workHours = hours.checked; };
        const optional = el('details', {class:'wizard-section'}, el('summary', {}, 'Coding folder and availability'),
          folderNote, choose, candidateBox,
          el('label', {class:'opt', for:background.id}, background, 'Keep Poolhouse available when I close its window'),
          el('label', {class:'opt', for:hours.id}, hours, 'Keep weekdays, 9 to 5, free of pool work'),
          el('p', {class:'hint'}, 'You can pause pool work at any time. No folder is shared automatically.'));
        const prepare = this.button('Prepare and continue', () => this.task(prepare, note, async () => this.prepare()));
        prepare.disabled = !this.modelInstall.selected || !!this.pendingProject;
        if (this.pendingProject) this.candidate(candidateBox, folderNote, prepare);
        this.show('Make this device ready', 'Preparing installs what this device needs and checks the selected model before opening chat.',
          this.modelInstall.panel, optional, this.actions(this.button('Back', () => { this.go(0); }, true), prepare,
            this.button('Set up models later', () => this.finish(false), true)), note);
      } catch (error) { if (this.current(epoch, session)) this.show('Choose a model later', error.message,
        this.actions(this.button('Check models', () => this.modelStep()), this.button('Back', () => { this.go(0); }, true),
          this.button('Set up models later', () => this.finish(false), true))); }
    }
    candidate(box, folderNote, prepare) {
      const candidate = this.pendingProject;
      prepare.disabled = true; folderNote.textContent = `Selected folder: ${candidate.title}`;
      const message = this.note();
      const create = this.button('Create project here', () => this.task(create, message, async () => {
        const made = await this.request('/ui/setup/projects/create', post({candidate_id:candidate.id}));
        if (made.selected !== true) throw Error('A newer coding folder was chosen. Choose your folder again.');
        this.project = made.project; this.pendingProject = null; box.replaceChildren();
        folderNote.textContent = `Coding folder: ${this.project.title}`; prepare.disabled = !this.modelInstall.selected;
      }));
      const keep = this.button('Use private workspace', () => {
        if (this.busy) return;
        this.pendingProject = null; this.project = null; this.clearProjectOperation(); box.replaceChildren();
        folderNote.textContent = 'A private coding workspace will be created for you.'; prepare.disabled = !this.modelInstall.selected;
      }, true);
      box.replaceChildren(el('p', {}, `${candidate.title} needs a project before coding can start.`), this.actions(create, keep), message);
    }
    async prepare() {
      const epoch = this.epoch, session = M.sessionContext();
      if (this.pendingProject) throw Error('Create the selected project or choose the private workspace first.');
      const selected = this.modelInstall.selected;
      if (!selected?.model_id) throw Error('Choose an available model before preparing.');
      await this.request('/ui/setup/prefs', post({download_sources:'both', autodownload_models:true,
        on_close:this.background ? 'background' : 'quit', work_hours:this.workHours,
        ...(this.systemTheme ? {system_theme:this.systemTheme} : {})}), epoch, session);
      if (!this.project) {
        const made = await this.request('/ui/setup/projects/default', post({operation_id:this.projectOperation()}), epoch, session);
        if (made.selected !== true) {
          this.clearProjectOperation();
          throw Error('The coding folder choice changed. Prepare again to use the private workspace, or choose a folder.');
        }
        this.project = made.project;
      }
      const config = {model_id:selected.model_id, download:!selected.installed, project_id:this.project.id};
      if (!this.intent || JSON.stringify(this.intent.config) !== JSON.stringify(config)) this.intent = {key:key(), config};
      this.keepIntent(); this.go(2);
      const dispatchEpoch = this.epoch;
      try {
        const operation = await this.request('/ui/setup/prepare', post({...config, idempotency_key:this.intent.key}), dispatchEpoch, session);
        this.intent.job = operation.id; this.keepIntent(); this.operation = operation; this.drawOperation(); this.poll();
      } catch (error) { if (this.current(dispatchEpoch, session)) this.failure(error); }
    }
    clearProjectOperation() {
      this.defaultOperation = null;
      try { sessionStorage.removeItem('poolhouse.setup.project-operation'); } catch {}
    }
    projectOperation() {
      if (!this.defaultOperation) {
        let saved;
        try { saved = sessionStorage.getItem('poolhouse.setup.project-operation'); } catch {}
        this.defaultOperation = /^[a-f0-9]{32}$/.test(saved || '') ? saved : key();
        try { sessionStorage.setItem('poolhouse.setup.project-operation', this.defaultOperation); } catch {}
      }
      return this.defaultOperation;
    }
    keepIntent() { try { sessionStorage.setItem('poolhouse.setup.intent', JSON.stringify(this.intent)); } catch {} }
    preparingStep() {
      this.progress = this.note(); this.controls = this.actions();
      this.show('Preparing your device', 'Keep this window open or return later. Reopening setup attaches to the same preparation.', this.progress, this.controls);
      this.progress.textContent = 'Preparing this device…'; this.drawOperation();
    }
    async checkPreparation() {
      if (this.intent?.job) return this.poll();
      if (!this.intent || this.busy) return;
      const pending = {}; this.busy = pending;
      const epoch = this.epoch, session = M.sessionContext();
      try {
        const operation = await this.request('/ui/setup/prepare', post({...this.intent.config, idempotency_key:this.intent.key}));
        this.intent.job = operation.id; this.keepIntent(); this.operation = operation; this.drawOperation(); this.poll();
      } catch (error) { if (this.current(epoch, session)) this.failure(error); } finally { if (this.busy === pending) this.busy = null; }
    }
    async poll() {
      clearTimeout(this.timer);
      if (!this.intent?.job || M.route !== 'first-run') return;
      const epoch = this.epoch, session = M.sessionContext();
      try {
        this.operation = await this.request('/ui/setup/prepare/' + encodeURIComponent(this.intent.job), undefined, epoch, session);
        this.drawOperation();
        if (['queued','installing','running'].includes(this.operation.state)) this.timer = setTimeout(() => this.poll(), 750);
      } catch (error) { if (this.current(epoch, session)) this.failure(error); }
    }
    drawOperation() {
      if (!this.progress || !this.operation) return;
      const job = this.operation, result = job.result || {};
      this.progress.textContent = job.error || job.note || 'Preparing this device…';
      const buttons = [];
      if (job.state === 'done' && result.chat_ready === true) {
        this.heading.textContent = 'Ready to chat';
        this.description.textContent = 'Your selected model has answered successfully on this device.';
        this.progress.textContent = result.tools_ready === true ? 'Chat and tool use are ready.' : 'Chat is ready. Tool use has not been verified for this model.';
        buttons.push(this.button('Start chat', () => this.finish(true)));
      } else if (['queued','installing','running'].includes(job.state)) {
        const stop = this.button('Stop preparing', () => this.task(stop, this.progress, async () => {
          this.operation = await this.request('/ui/setup/prepare/' + encodeURIComponent(job.id) + '/cancel', post({})); this.drawOperation(); this.poll();
        }), true);
        buttons.push(stop);
      } else {
        this.heading.textContent = job.state === 'cancelled' ? 'Preparation stopped' : 'Preparation needs attention';
        this.description.textContent = 'Check its status or finish setup for now.';
        if (this.progress.textContent === this.heading.textContent) this.progress.textContent = 'No model is marked ready.';
        buttons.push(this.button('Check status', () => this.checkPreparation(), true), this.button('Finish setup for now', () => this.finish(false), true));
      }
      if (job.stage === 'transfer' && job.progress) this.progress.append(M.ui('ml-progress', {
        label:'Preparing model', format:'bytes', done:job.progress.done || 0, total:job.progress.total || 0,
        state:job.state === 'interrupted' ? 'failed' : job.state === 'cancelled' ? 'idle' : 'running', message:job.note || ''}));
      this.controls.replaceChildren(...buttons);
    }
    failure(error) {
      if (!this.progress?.isConnected) {
        if (this.errorNote?.isConnected) this.errorNote.textContent = error.message;
        return;
      }
      this.heading.textContent = 'Preparation needs attention';
      this.description.textContent = 'Check the existing preparation before starting anything else.';
      this.progress.textContent = error.message;
      this.controls.replaceChildren(this.button(this.intent ? 'Check status' : 'Try again', () => this.intent ? this.checkPreparation() : this.open(), true),
        ...(this.setup ? [this.button('Finish setup for now', () => this.finish(false), true)] : []));
    }
    async finish(ready) {
      if (this.finishing) return;
      const pending = {}; this.finishing = pending;
      const epoch = this.epoch, session = M.sessionContext();
      try {
        const result = this.operation?.result || {};
        if (ready && result.chat_ready !== true) throw Error('The model is not ready yet.');
        const saved = await this.request('/ui/setup/done', post(this.systemTheme ? {system_theme:this.systemTheme} : {}));
        if (saved.ok !== true) throw Error('Setup could not be saved.');
        try { sessionStorage.removeItem('poolhouse.setup.intent'); } catch {}
        if (ready) window.dispatchEvent(new CustomEvent('fleet-chat-ready', {detail:{model:result.model}}));
        M.go('chat');
      } catch (error) { if (this.current(epoch, session)) this.failure(error); }
      finally { if (this.finishing === pending) this.finishing = null; }
    }
  }
  customElements.define('first-run', FirstRun);
})();
</script>
