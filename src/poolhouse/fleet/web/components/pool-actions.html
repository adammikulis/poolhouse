<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;

  /** What the other device is told to type: this device's address and the code, and for an open pool the fingerprint that does instead of a code. */
  function invitation(got) {
    const [address, ...others] = got.addresses || [];
    return [
      el("div", { class: "hint" }, "On the other device, choose Join another pool and type these within a few minutes:"),
      address ? el("div", {}, "Address: ", el("code", { id: "pool-join-address" }, address))
        : el("div", { class: "err" }, "This device's network is off, so another device cannot reach it."),
      others.length ? el("div", { class: "hint" }, `If that address does not answer, try ${others.join(" or ")}.`) : null,
      el("div", {}, "Code: ", el("code", { id: "pool-join-code" }, String(got.code))),
      got.policy === "open" ? el("div", { class: "hint" }, "On the same network it can give this fingerprint instead of a code: ",
        el("code", { id: "pool-join-fingerprint" }, String(got.fingerprint))) : null];
  }

  /** The pools this computer hears while it is in none: each by the words the answering computer shows, with the one click that joins it. */
  function nearbyList(list, join) {
    const draw = async () => {
      const got = await M.api("/ui/pool");
      const heard = (got && got.pool && got.pool.nearby) || [];
      const drawn = heard.map((n) => `${n.fingerprint} ${n.host} ${n.port}`).join();
      if (list.dataset.drawn !== drawn) {
        list.dataset.drawn = drawn;
        list.replaceChildren(...(heard.length ? [el("div", { class: "hint" }, "Join one only when its words match what that computer shows.")] : []),
          ...heard.map((n) => {
            const button = el("button", { class: "small" }, "Join this pool");
            button.onclick = () => join(button, n);
            return el("div", { class: "pool-nearby" }, el("code", {}, String(n.words)), ` at ${n.host} `, button);
          }));
      }
      // Looks again while the list is on a screen; one that was shown and taken away is done with.
      if (list.isConnected) list.dataset.shown = "yes";
      if (list.isConnected || !list.dataset.shown) setTimeout(draw, 5000);
    };
    setTimeout(draw, 0);
    return list;
  }

  /** What a person does to the pool this device's node is in: found it, add a device to it, join another device's pool. */
  class PoolActions extends HTMLElement {
    setup({ onComplete, founded = false, before = async () => {} }) {
      /** ``changes``: whether the action changes which pool this device is in, so the screen around the form is drawn again. */
      const act = async (button, note, working, path, options, success, changes = true) => {
        button.disabled = true;
        note.replaceChildren(el("span", { class: "spin" }), ` ${working}`);
        try { await before(); } catch (error) {
          button.disabled = false;
          note.replaceChildren(el("div", { class: "err" }, error.message));
          return null;
        }
        const got = await M.api(path, options);
        button.disabled = false;
        if (M.refused(got)) return null;
        if (got.error || got.ok === false) {
          note.replaceChildren(el("div", { class: "err" }, got.error || "The pool action failed."));
          return null;
        }
        note.replaceChildren(...M.kids(success(got)));
        if (changes) await onComplete(got);
        return got;
      };

      const foundNote = el("div", { role: "status", "aria-live": "polite" });
      const name = el("input", { id: "pool-found-name", type: "text", maxlength: "64", placeholder: "Pool name" });
      const policy = el("select", { id: "pool-found-policy" },
        el("option", { value: "secure" }, "Devices join with a code"),
        el("option", { value: "open" }, "Devices on this network can join without a code"));
      const found = el("button", { class: "small" }, "Found this pool");
      found.disabled = true;
      name.oninput = () => { found.disabled = !name.value.trim(); };
      found.onclick = () => act(found, foundNote, "Making the pool…", "/ui/pool/found",
        { method: "POST", body: JSON.stringify({ name: name.value.trim(), policy: policy.value }) },
        (got) => el("div", { class: "ok" }, got.say || "Pool founded."));

      const addNote = el("div", { role: "status", "aria-live": "polite" });
      const add = el("button", { class: "small" }, "Add a device");
      add.onclick = () => act(add, addNote, "Making a code…", "/ui/pool/add-device",
        { method: "POST", body: JSON.stringify({}) }, invitation, false);

      const joinNote = el("div", { role: "status", "aria-live": "polite" });
      const host = el("input", { id: "pool-join-host", type: "text", autocomplete: "off", placeholder: "Address it showed, like 192.168.1.20" });
      const code = el("input", { id: "pool-join-code-in", type: "text", autocomplete: "off", placeholder: "Code it showed" });
      const fingerprint = el("input", { id: "pool-join-fingerprint-in", type: "text", autocomplete: "off", placeholder: "Fingerprint it showed" });
      const print = () => fingerprint.value.replace(/[\s:]/g, "").toLowerCase();
      const join = el("button", { class: "small" }, "Join that pool");
      join.disabled = true;
      const check = () => { join.disabled = !host.value.trim() || !code.value.trim() === !print(); };
      host.oninput = code.oninput = fingerprint.oninput = check;
      join.onclick = () => act(join, joinNote, "Joining…", "/ui/pool/join",
        { method: "POST", body: JSON.stringify({ host: host.value.trim(),
          ...(code.value.trim() ? { code: code.value.trim() } : { fingerprint: print() }) }) },
        () => { code.value = ""; return el("div", { class: "ok" }, "Joined."); });
      const nearbyNote = el("div", { role: "status", "aria-live": "polite" });
      const nearby = founded ? null : nearbyList(el("div", { id: "pool-nearby" }), (button, n) => act(button, nearbyNote, "Joining…",
        "/ui/pool/join", { method: "POST", body: JSON.stringify({ host: n.host, port: n.port, fingerprint: n.fingerprint }) },
        () => el("div", { class: "ok" }, "Joined.")));

      this.replaceChildren(
        ...(founded ? [] : [el("div", { class: "group", id: "pool-found-form" },
          el("h3", {}, "Found this pool"),
          el("div", { class: "hint" }, "Makes a pool on this computer, so other devices can join it."),
          el("label", { for: "pool-found-name" }, "Pool name"), name,
          el("label", { for: "pool-found-policy" }, "How devices join"), policy, found, foundNote)]),
        el("div", { class: "group", id: "pool-add-form" },
          el("h3", {}, "Add a device"),
          el("div", { class: "hint" }, "Shows this device's address and a short-lived code for another device to join this pool with."),
          add, addNote),
        el("div", { class: "group", id: "pool-join-form" },
          el("h3", {}, "Join another pool"),
          ...(nearby ? [nearby, nearbyNote] : []),
          el("div", { class: "hint" }, "Use the address and code a device in that pool showed."),
          el("label", { for: "pool-join-host" }, "Address"), host,
          el("label", { for: "pool-join-code-in" }, "Code"), code,
          el("details", { id: "pool-join-open" }, el("summary", {}, "Join an open pool without a code"),
            el("label", { for: "pool-join-fingerprint-in" }, "Fingerprint (instead of a code, on the same network)"), fingerprint),
          join, joinNote));
    }
  }
  customElements.define("pool-actions", PoolActions);
  M.poolForm = (options) => {
    const form = el("pool-actions");
    form.setup(options);
    return form;
  };
})();
</script>
