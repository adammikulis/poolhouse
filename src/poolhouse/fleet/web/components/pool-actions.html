<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;

  /** What a person does to the pool this device's node is in: found it, add a device to it, join another device's pool. */
  class PoolActions extends HTMLElement {
    setup({ onComplete, founded = false }) {
      const done = async (got) => { await onComplete(got); };
      const act = async (button, note, working, path, options, success) => {
        button.disabled = true;
        note.replaceChildren(el("span", { class: "spin" }), ` ${working}`);
        const got = await M.api(path, options);
        button.disabled = false;
        if (M.refused(got)) return null;
        if (got.error || got.ok === false) {
          note.replaceChildren(el("div", { class: "err" }, got.error || "The pool action failed."));
          return null;
        }
        note.replaceChildren(...M.kids(success(got)));
        await done(got);
        return got;
      };

      const foundNote = el("div", { role: "status", "aria-live": "polite" });
      const name = el("input", { id: "pool-found-name", type: "text", maxlength: "64", placeholder: "Pool name" });
      const policy = el("select", { id: "pool-found-policy" },
        el("option", { value: "secure" }, "Devices join with a code"),
        el("option", { value: "open" }, "Devices on this network join by themselves"));
      const found = el("button", { class: "small" }, "Found this pool");
      found.disabled = true;
      name.oninput = () => { found.disabled = !name.value.trim(); };
      found.onclick = () => act(found, foundNote, "Waiting for you to approve on this computer…", "/ui/pool/found",
        { method: "POST", body: JSON.stringify({ name: name.value.trim(), policy: policy.value }) },
        (got) => el("div", { class: "ok" }, got.say || "Pool founded."));

      const addNote = el("div", { role: "status", "aria-live": "polite" });
      const add = el("button", { class: "small" }, "Add a device");
      add.onclick = () => act(add, addNote, "Making a code…", "/ui/pool/add-device",
        { method: "POST", body: JSON.stringify({}) },
        (got) => [el("div", { class: "hint" }, "Type this on the other device, within a few minutes:"),
                  el("code", { id: "pool-join-code" }, String(got.code))]);

      const joinNote = el("div", { role: "status", "aria-live": "polite" });
      const host = el("input", { id: "pool-join-host", type: "text", placeholder: "Address of a device in the pool" });
      const code = el("input", { id: "pool-join-code-in", type: "text", autocomplete: "off", placeholder: "Code it showed" });
      const join = el("button", { class: "small" }, "Join that pool");
      join.disabled = true;
      const check = () => { join.disabled = !host.value.trim() || !code.value.trim(); };
      host.oninput = code.oninput = check;
      join.onclick = () => act(join, joinNote, "Joining…", "/ui/pool/join",
        { method: "POST", body: JSON.stringify({ host: host.value.trim(), code: code.value.trim() }) },
        () => { code.value = ""; return el("div", { class: "ok" }, "Joined."); });

      this.replaceChildren(
        ...(founded ? [] : [el("div", { class: "group", id: "pool-found-form" },
          el("h3", {}, "Found this pool"),
          el("div", { class: "hint" }, "A pool is founded by a person's key; you will be asked to approve it on this computer."),
          el("label", { for: "pool-found-name" }, "Pool name"), name,
          el("label", { for: "pool-found-policy" }, "How devices join"), policy, found, foundNote)]),
        el("div", { class: "group", id: "pool-add-form" },
          el("h3", {}, "Add a device"),
          el("div", { class: "hint" }, "Makes a short-lived code for another device to join this pool with."),
          add, addNote),
        el("div", { class: "group", id: "pool-join-form" },
          el("h3", {}, "Join another pool"),
          el("div", { class: "hint" }, "Use the address and code a device in that pool showed."),
          el("label", { for: "pool-join-host" }, "Address"), host,
          el("label", { for: "pool-join-code-in" }, "Code"), code, join, joinNote));
    }
  }
  customElements.define("pool-actions", PoolActions);
  M.poolForm = (options) => {
    const form = el("pool-actions");
    form.setup(options);
    return form;
  };
})();
</script>
