<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;

  M.startupModels = async function (kept) {
    const panel = el("div", { class: "group" });
    let result;
    try {
      result = await M.api("/ui/models/startup");
    } catch (e) {
      result = { error: String(e) };
    }
    const models = (result.models || []).filter(row => typeof row.model_id === "string" && row.model_id);
    if (!result.ok || !models.length) {
      panel.append(el("div", { class: "hint" },
        result.error || "Choose a model later from Models."));
      return { panel, selected: null };
    }
    const memory = result.memory || {};
    if (!models.some((m) => m.model_id === kept.modelFile)) {
      kept.modelFile = (models.find((m) => m.recommended) || models[0]).model_id;
    }
    const select = el("select", { id: "startup-model-choice" },
      ...models.map((m) => el("option", { value: m.model_id },
        `${m.name}${m.recommended ? " (recommended)" : ""}`)));
    select.value = kept.modelFile;
    const detail = el("div", { class: "hint", id: "startup-model-detail" });
    const draw = () => {
      kept.modelFile = select.value;
      const m = models.find((x) => x.model_id === select.value);
      const download = Number.isFinite(m.download_bytes) ? `About ${M.gb(m.download_bytes / 1e9)} download` : "Download size unavailable";
      detail.textContent = (m.installed ? "Already on this device" : download)
        + (m.what ? `. ${m.what.replace(/\.$/, "")}` : "")
        + (m.fits_now === false ? ". Close other applications or choose a smaller model before preparing." : ". Poolhouse checks this model before opening chat.");
    };
    select.onchange = draw;
    draw();
    panel.append(el("h2", {}, "Your model"),
      el("div", { class: "hint", id: "startup-model-memory" },
        `${memory.pool || "Memory"}: ${M.gb(memory.capacity_gb)?.replace("GB", "GiB") || "unknown"} capacity, `
        + `${M.gb(memory.free_gb)?.replace("GB", "GiB") || "unknown"} free. `
        + "Starting a model checks the memory available then."),
      el("label", { for: select.id }, "Model"), select, detail);
    return { panel, get selected() { return models.find(row => row.model_id === select.value); } };
  };
})();
</script>
