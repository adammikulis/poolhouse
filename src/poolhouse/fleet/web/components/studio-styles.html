<style>

  .app[data-workspace="studio"] #workspace { padding: 0; margin: 0; max-width: none; }
  studio-view {
    display: contents;
  }
  .studio-workspace {
    padding: var(--page-gutter, clamp(16px, 2vw, 28px));
    max-width: none;
    min-width: 0;
    height: calc(100dvh - var(--header-height));
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }
  .studio-workspace[hidden], .studio-workspace [role="tabpanel"][hidden] { display: none; }
  .studio-workspace .studio-command-bar { flex-wrap: nowrap; overflow-x: auto; flex-shrink: 0; margin: 0; }
  .studio-workspace .studio-command-bar button { flex-shrink: 0; }
  .studio-workspace-tabs { display: flex; gap: 8px; flex-shrink: 0; }
  .studio-workspace-tabs [aria-selected="true"] { border-color: var(--accent-ink); font-weight: 750; }
  .studio-results-panel { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .studio-workspace .studio-status { margin: 0; min-height: 0; font-size: 11px; }
  .studio-workspace .studio-group-path { flex-shrink: 0; overflow-x: auto; }

  .studio-heading,
  .studio-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .studio-page-title { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .studio-command-bar { overflow: visible !important; position: relative; z-index: 5; }
  .studio-command { position: relative; }
  .studio-command summary { cursor: pointer; padding: 7px 10px; border: 1px solid var(--line-bright); border-radius: 8px; white-space: nowrap; color: var(--text); background: var(--bg-raised); }
  .studio-command summary:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .studio-command > div { position: absolute; top: 100%; left: 0; margin-top: 4px; padding: 8px; border: 1px solid var(--line); border-radius: var(--page-panel-radius, 12px); background: var(--bg-raised); box-shadow: 0 8px 24px #0002; min-width: 180px; max-height: 50dvh; overflow: auto; }
  .studio-command:last-of-type > div { left: auto; right: 0; }
  .studio-command button { display: block; width: 100%; text-align: left; margin: 0; }
  .studio-command label { display: block; margin: 0; }
  .studio-command select { max-width: min(280px, 70vw); }
  .studio-heading { position: relative; }
  #studio-tools-toggle { display: none; }
  .studio-identity { flex: 1; min-width: 180px; }
  .studio-heading input { width: 100%; min-width: 0; max-width: none; }
  .studio-heading > button { flex-shrink: 0; }
  .studio-location-row { display: flex; align-items: center; gap: 16px; min-width: 0; flex-shrink: 0; }
  .studio-group-path { min-width: 0; flex: 1; white-space: nowrap; }
  .studio-group-path > * { flex-shrink: 0; }
  .studio-group-path button { white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .studio-group-path [aria-current] { overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
  .studio-group-settings { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .studio-group-settings summary { cursor: pointer; font-weight: 650; }
  .studio-group-interface { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .studio-group-interface span { flex-basis: 100%; overflow-wrap: anywhere; }
  .studio-toolbar {
    margin: 12px 0;
  }
  .studio-workspace button {
    padding: var(--control-padding, 7px 10px);
    font-size: var(--control-font-size, 13px);
    border-radius: var(--control-radius, 8px);
    min-height: var(--control-height, 34px);
    background: var(--bg-raised);
    color: var(--text);
    border: 1px solid var(--line-bright);
  }
  .studio-workspace button:focus-visible {
    outline: 2px solid var(--accent-ink);
    outline-offset: 2px;
  }
  .studio-workspace .studio-primary {
    border-color: var(--accent-ink);
    box-shadow: inset 3px 0 var(--accent);
    font-weight: 750;
  }
  .studio-shell {
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr) 250px;
    border: 1px solid var(--line);
    border-radius: var(--page-panel-radius, 12px);
    overflow: hidden;
    background: var(--bg-raised);
    min-height: 0;
    flex: 1;
  }
  .studio-library,
  .studio-inspector {
    padding: 14px;
    min-width: 0;
    overflow: auto;
    min-height: 0;
  }
  .studio-shell.studio-inspector-empty { grid-template-columns: 210px minmax(0, 1fr); }
  .studio-inspector[hidden] { display: none; }
  .studio-library select { width: 100%; margin-top: 6px; }
  .studio-library { display: flex; flex-direction: column; gap: 6px; overflow: hidden; border-right: 1px solid var(--line); }
  .studio-library > input, .studio-library > select { flex-shrink: 0; }
  #studio-library-items { flex: 1; min-height: 0; overflow: auto; }
  .studio-group-settings:only-child { margin-top: 0; padding-top: 0; border: 0; }
  .studio-inspector {
    border-left: 1px solid var(--line);
  }
  .studio-library h2,
  .studio-inspector h2 {
    font-size: 15px;
    margin: 12px 0;
  }
  .studio-library input,
  .studio-inspector input,
  .studio-inspector select {
    width: 100%;
    min-width: 0;
  }
  .studio-library button {
    width: 100%;
    text-align: left;
    margin: 4px 0;
  }
  .studio-library small {
    display: block;
    color: var(--muted);
  }
  .studio-status {
    min-height: 24px;
    margin: 8px 0;
    color: var(--muted);
  }
  .studio-inspector label {
    display: block;
    margin: 12px 0 4px;
    font-size: 12px;
  }
  .studio-inspector .studio-links {
    margin-top: 16px;
    display: grid;
    gap: 6px;
  }
  .studio-outline {
    display: none;
    min-height: 0;
    overflow: auto;
  }
  .studio-outline button {
    display: block;
    width: 100%;
    text-align: left;
    margin: 4px 0;
  }
  .studio-dock {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    background: var(--bg-raised);
  }
  .studio-dock header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .studio-dock h2 {
    margin: 0 auto 0 0;
    font-size: 16px;
  }
  .studio-dock pre {
    max-height: 180px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .studio-run-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
    padding: 8px 0;
  }
  .studio-run-row span {
    color: var(--muted);
  }
  .studio-dialog {
    max-width: min(700px, 90vw);
    background: var(--bg-raised);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
  }
  .studio-dialog textarea {
    width: 100%;
    min-height: 200px;
  }
  .studio-dialog label {
    display: block;
    margin: 12px 0;
  }
  .studio-group-path {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .studio-selected {
    outline: 2px solid var(--accent-ink);
  }
  @media (max-width: 1100px) {
    .studio-shell.studio-inspector-empty { grid-template-columns: 170px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .studio-shell {
      grid-template-columns: 170px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) minmax(0, .6fr);
    }
    .studio-inspector {
      grid-column: 1 / -1;
      border-left: 0;
      border-top: 1px solid var(--line);
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .studio-inspector h2 {
      width: 100%;
    }
    .studio-inspector label {
      margin: 4px;
    }
    .studio-inspector input,
    .studio-inspector select {
      width: auto;
      max-width: 240px;
    }
  }
  @media (max-width: 700px) {
    .studio-workspace {
      padding: 12px;
    }
    .studio-shell {
      grid-template-columns: 1fr;
      min-height: 0;
      grid-template-rows: minmax(0, .5fr) minmax(0, .6fr) minmax(0, 1fr);
    }
    .studio-library {
      border: 0;
      border-bottom: 1px solid var(--line);
      min-height: 0;
    }
    .studio-shell.studio-inspector-empty { grid-template-columns: 1fr; grid-template-rows: minmax(0, .5fr) minmax(0, 1fr); }
    .studio-library { display: grid; grid-template-columns: minmax(0, 1fr) 94px; grid-template-rows: auto minmax(0, 1fr); padding: 8px; }
    .studio-library > select { margin-top: 0; }
    .studio-library #studio-library-items { display: block; grid-column: 1 / -1; }
    .studio-library button {
      min-width: 150px;
    }
    studio-canvas {
      display: none !important;
    }
    .studio-outline {
      display: block;
      padding: 14px;
      min-height: 0;
      overflow: auto;
    }
    .studio-inspector {
      display: block;
    }
    .studio-inspector input,
    .studio-inspector select {
      width: 100%;
      max-width: none;
    }
    .studio-heading input {
      max-width: 100%;
      width: 100%;
    }
    .studio-heading .studio-identity { flex-basis: 100%; }
    #studio-tools-toggle { display: block; }
    .studio-heading > button { padding-inline: 7px; font-size: 12px; }
    .studio-heading .studio-command-bar { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-wrap: wrap; background: var(--bg-raised); border: 1px solid var(--line); padding: 8px; border-radius: 8px; box-shadow: var(--shadow); }
    .studio-heading .studio-command-bar[data-expanded="true"] { display: flex; }
    .studio-command { position: static; }
    .studio-command > div { left: 0 !important; right: 0 !important; top: 100%; min-width: 0; }
    .studio-command summary { padding-inline: 6px; font-size: 12px; }
    .studio-location-row { flex-wrap: wrap; gap: 6px; }
    .studio-group-path { flex-basis: 100%; overflow: hidden !important; }
    .studio-group-path > button:not(.studio-group-back) { max-width: 96px; flex-shrink: 1; }
    .studio-group-path > :nth-child(n+3):not([aria-current]) { display: none; }
    .studio-group-path [aria-current] { flex: 1; min-width: 64px; }
    .studio-workspace { gap: 6px; }
    .studio-toolbar {
      gap: 6px;
    }
  }

  studio-canvas {
    display: block;
    position: relative;
    min-width: 0;
    min-height: 0;
    background: var(--bg-raised);
    overflow: hidden;
    touch-action: none;
  }
  .studio-viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    outline-offset: -4px;
  }
  .studio-world {
    position: absolute;
    transform-origin: 0 0;
    inset: 0;
  }
  .studio-connections {
    position: absolute;
    left: 0;
    top: 0;
    width: 10000px;
    height: 10000px;
    overflow: visible;
    pointer-events: none;
  }
  .studio-connections path {
    fill: none;
    stroke: var(--muted);
    stroke-width: 3;
    pointer-events: stroke;
  }
  .studio-connections path:focus {
    stroke: var(--text);
    outline: none;
  }
  .studio-node {
    position: absolute;
    width: 250px;
    border: 1px solid var(--line-bright);
    border-radius: 13px;
    background: var(--bg-raised);
    box-shadow: var(--shadow);
    overflow: hidden;
    touch-action: none;
  }
  .studio-node[aria-selected="true"] {
    border: 2px solid var(--accent-ink);
  }
  .studio-node header {
    padding: 10px 12px;
    background: var(--bg-sunken);
    cursor: grab;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
  }
  .studio-node header strong {
    font-size: 13px;
  }
  .studio-node .studio-state {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  .studio-node-controls {
    padding: 4px 12px 10px;
  }
  .studio-node-controls label {
    font-size: 11px;
    display: block;
    margin-top: 6px;
  }
  .studio-node-controls input,
  .studio-node-controls select {
    width: 100%;
    min-width: 0;
    font-size: 12px;
    padding: 4px;
  }
  .studio-node-ports {
    padding: 6px 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .studio-node-ports > div {
    min-width: 0;
  }
  .studio-node-ports > .studio-input {
    grid-column: 1;
  }
  .studio-node-ports > .studio-output {
    grid-column: 2;
    grid-row: 1 / span 2;
  }
  .studio-node-ports button {
    display: block;
    width: 100%;
    font-size: 10px;
    text-align: left;
    padding: 4px !important;
    min-height: 26px !important;
    background: var(--bg-sunken);
    color: var(--text);
    border: 1px solid var(--line);
    overflow-wrap: anywhere;
    margin: 4px 0;
  }
  .studio-node-ports .studio-output button {
    text-align: right;
  }
  .studio-node-ports button[aria-pressed="true"] {
    outline: 2px solid var(--accent-ink);
  }
  .studio-port-type {
    display: block;
    color: var(--muted);
    font-size: 9px;
  }
  .studio-canvas-tools {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: flex;
    gap: 5px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg-raised);
  }
  .studio-canvas-tools button {
    min-width: 32px;
  }
  .studio-minimap {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 130px;
    height: 85px;
    background: var(--bg-raised);
    border: 1px solid var(--line-bright);
    border-radius: 8px;
  }
  .studio-minimap rect {
    fill: var(--muted);
    stroke: var(--text);
    stroke-width: 1;
  }
  .studio-selection-box {
    position: absolute;
    border: 1px solid var(--accent-ink);
    background: var(--accent-dim);
    opacity: 0.6;
    pointer-events: none;
  }
  .studio-canvas-help {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }
  .studio-node-missing {
    padding: 6px 12px;
    color: var(--bad);
    font-size: 11px;
  }

  .studio-live { min-width: 0; overflow-wrap: anywhere; }
  .studio-live select { max-width: 100%; }
  .studio-live pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
  .studio-live-event { border-top: 1px solid var(--line); padding: 8px 0; }
  .studio-live .studio-toolbar p { flex-basis: 100%; }
  .studio-library-node { position: relative; padding: 7px; border-radius: 6px; margin: 2px 0; cursor: grab; }
  .studio-library-node:hover { background: var(--bg-sunken); }
  .studio-library-node > span { display: block; font-size: 13px; font-weight: 550; }
  .studio-library-node small { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
  .studio-outline small { display: block; font-size: 11px; font-weight: normal; color: var(--muted); }
  .studio-library-node button { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; padding: 0; overflow: hidden; white-space: nowrap; }
  .studio-library-node button:focus-visible { clip-path: none; width: auto; height: auto; padding: 7px 10px; right: 8px; bottom: 4px; overflow: visible; }
  @media (max-width: 700px) {
    .studio-library-node button { position: static; clip-path: none; width: 100%; height: auto; padding: 7px 10px; overflow: visible; white-space: normal; }
  }
  .studio-placement-menu { position: fixed; z-index: 100; width: min(280px, calc(100vw - 16px)); max-height: min(380px, calc(100vh - 16px)); overflow: auto; padding: 12px; border: 1px solid var(--line-bright); border-radius: 12px; background: var(--bg-raised); color: var(--text); box-shadow: var(--shadow); }
  .studio-placement-menu input { width: 100%; margin: 10px 0; }
  .studio-placement-menu button { display: block; width: 100%; text-align: left; margin: 5px 0; }
  .studio-placement-menu small { display: block; color: var(--muted); }
</style>
<script>
void 0;
</script>
