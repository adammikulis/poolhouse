<script>
  (function () {
    const S = window.studioModel,
      E = window.fleetModel.el;
    S.installPersistence = (proto) =>
      Object.assign(proto, {
        workflowContext: 0,
        workflowList() {
          const select = this.querySelector("#studio-workflows");
          select.replaceChildren(
            E("option", { value: "" }, "New workflow"),
            ...(this.workflows || []).map((w) =>
              E("option", { value: w.id }, w.title),
            ),
          );
          select.value = this.workflowId || "";
        },
        async open(workflow) {
          this.workflowContext++;
          this.dispatchEvent(new CustomEvent("studio-selection"));
          if (
            this.dirty ||
            this.saving ||
            this.sweepDrafts?.size ||
            this.recordDrafts?.size
          )
            await this.save();
          this.context = [];
          this.packageId = null;
          this.packageVersion = null;
          this.graph = S.clone(workflow?.graph || S.empty());
          this.normalize();
          this.workflowId = workflow?.id;
          this.revision = workflow?.revision || 0;
          this.querySelector("#studio-title").value =
            workflow?.title || "Untitled experiment";
          this.selected.clear();
          this.resetHistory();
          this.dirty = false;
          this.workflowList();
          this.resetDeliveryDraft();
          this.resetWebhookDraft();
          this.render();
        },
        normalize() {
          this.graph.nodes ||= [];
          this.graph.edges ||= [];
          this.graph.controls ||= [];
          this.graph.groups ||= {};
          this.graph.layout ||= {};
          this.graph.layout.nodes ||= {};
          this.graph.layout.viewport ||= { x: 0, y: 0, zoom: 1 };
        },
        historyLimit() {
          const value = window.fleetModel.preferences.studio_undo_steps;
          return Number.isInteger(value) && value >= 1 && value <= 128 ? value : 32;
        },
        trimHistory() {
          const limit = this.historyLimit();
          for (const stack of [this.undoStack, this.redoStack])
            if (stack.length > limit) stack.splice(0, stack.length - limit);
        },
        resetHistory() {
          this.undoStack = [];
          this.redoStack = [];
          this.historyCurrent = this.snapshot();
          this.historyPending = null;
          if (!this.historyPreferences) {
            this.historyPreferences = () => { this.trimHistory(); this.render(); };
            window.addEventListener("fleet-preferences", this.historyPreferences);
          }
        },
        historyAnchor() {
          this.historyCurrent = this.snapshot();
          this.historyPending = null;
        },
        checkpoint() {
          this.historyPending ||= this.snapshot();
        },
        recordHistory(amend = false) {
          const next = this.snapshot(), previous = this.historyPending || this.historyCurrent;
          const content = value => JSON.stringify({graph:value.graph, title:value.title});
          const different = !this.historyRestoring && previous && content(previous) !== content(next);
          if (different) {
            if (!amend) this.undoStack.push(previous);
            this.redoStack = [];
          }
          this.historyCurrent = next;
          this.historyPending = null;
          this.trimHistory();
          return !!different && !amend;
        },
        undo(redo = false) {
          this.trimHistory();
          const from = redo ? this.redoStack : this.undoStack,
            to = redo ? this.undoStack : this.redoStack;
          if (!from.length) return;
          to.push(this.snapshot());
          this.restoreSnapshot(from.pop());
          this.selected.clear();
          this.historyPending = null;
          this.historyRestoring = true;
          try { this.changed(); } finally { this.historyRestoring = false; }
        },
        changed(paint = true, amend = false) {
          const recorded = this.recordHistory(amend);
          this.dirty = true;
          this.editSerial++;
          this.validationErrors = [];
          this.message("Unsaved changes");
          if (paint) this.render();
          clearTimeout(this.autosave);
          this.autosave = setTimeout(
            () => this.perform(() => this.save()),
            700,
          );
          return recorded;
        },
        async save() {
          this.validateEditorControls();
          clearTimeout(this.autosave);
          if (this.saving) {
            await this.saving;
            if (this.dirty) return this.save();
            return;
          }
          if (!this.dirty && this.workflowId) return;
          this.saving = this.persistPending();
          try {
            await this.saving;
          } finally {
            this.saving = null;
          }
        },
        async persistPending() {
          do {
            await this.persistOnce();
          } while (this.dirty);
        },
        async persistOnce() {
          this.flushGroup();
          const serial = this.editSerial;
          const graph = S.clone(this.rootGraph()),
            title =
              this.querySelector("#studio-title").value ||
              "Untitled experiment";
          this.dirty = false;
          const body = {
            title,
            graph,
            ...(this.workflowId ? { revision: this.revision } : {}),
          };
          const request = S.api(
            this.workflowId
              ? "/workflows/" + encodeURIComponent(this.workflowId)
              : "/workflows",
            body,
            this.workflowId ? "PUT" : "POST",
          );
          try {
            const r = await request,
              w = r.workflow;
            this.workflowId = w.id;
            this.revision = w.revision;
            this.workflows = [
              w,
              ...(this.workflows || []).filter((item) => item.id !== w.id),
            ];
            this.workflowList();
            this.message("Saved · revision " + w.revision);
          } catch (error) {
            this.dirty = true;
            if (error.response?.conflict_copy) {
              const copy = error.response.conflict_copy;
              this.workflowId = copy.id;
              this.revision = copy.revision;
              this.workflows = [
                copy,
                ...(this.workflows || []).filter((w) => w.id !== copy.id),
              ];
              if (this.editSerial === serial)
                this.querySelector("#studio-title").value = copy.title;
              this.workflowList();
              this.message(
                "Another edit was saved. Your changes are preserved as " +
                  copy.title +
                  ".",
              );
              this.dirty = this.editSerial !== serial;
            } else throw error;
          }
        },
      });
  })();
</script>
