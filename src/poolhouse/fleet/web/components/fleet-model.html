<!-- fleet-model: the daemon's routes, the pieces every screen builds out of, and which screen is showing -->
<style>
studio-view, pool-view, chat-view, models-view, settings-view, fit-view, data-view, training-view, gym-view, benchmarks-view, tools-view { display: contents; }
[hidden] { display: none !important; }
</style>
<script>
(function () {
  const M = window.fleetModel = {};
  let sessionEpoch = 0, nativeAttempt = -1, nativePending = null, nativeSignedOut = false;
  let sessionInvalid = false, manualPending = null, signoutPending = null, nativeWaiting = null;
  M.sessionContext = () => sessionEpoch;
  const responseEpoch = new WeakMap();
  const H = M.headers = { "X-Poolhouse-UI": "1", "Content-Type": "application/json" };

  let releaseBoot;
  const bootReady = new Promise(resolve => { releaseBoot = resolve; });

  M.MIN_PASS = 5;

  M.downloadMessage = function (g) {
    if (g.error) return g.error;
    const parts = [g.note || (g.phase === "mtp" ? "Downloading MTP head" : "Downloading model")];
    if (g.speed_bps > 0) parts.push(`${M.fileSize(g.speed_bps)}/s`);
    if (g.eta_s !== null && g.eta_s !== undefined) {
      parts.push(`about ${Math.max(1, Math.ceil(g.eta_s / 60))} min left`);
    }
    return parts.join(" · ");
  };

  /** One call to the daemon: `{ok, status, ...body}`. */
  async function request(path, opts = {}) {
    const {responseType,...requestOptions}=opts;
    const r = await fetch(path, { ...requestOptions, headers: { ...H, ...(opts.headers || {}) } });
    if(responseType==="blob"&&r.ok)return {ok:true,status:r.status,blob:await r.blob()};
    let body = {};
    try { body = await r.json(); } catch { /* an empty body is fine */ }
    return { ok: r.ok, status: r.status, ...body };
  }

  M.api = async function (path, opts = {}) {
    const signal = opts.signal;
    signal?.throwIfAborted();
    let aborted;
    try {
      await (signal ? Promise.race([bootReady, new Promise((_, reject) => {
        aborted = () => reject(signal.reason);
        signal.addEventListener("abort", aborted, {once:true});
      })]) : bootReady);
    } finally {
      if (aborted) signal.removeEventListener("abort", aborted);
    }
    signal?.throwIfAborted();
    if (path === "/ui/session" && opts.method?.toUpperCase() === "POST") return establishSession(opts);
    const epoch = sessionEpoch, result = await request(path, opts);
    responseEpoch.set(result, epoch);
    return result;
  };

  function establishSession(opts) {
    const busy = () => ({ok:false, status:409, error:"The local connection is already being established."});
    if (nativePending || signoutPending) return Promise.resolve(busy());
    if (manualPending) return manualPending.key === opts.body ? manualPending.promise : Promise.resolve(busy());
    const epoch = sessionEpoch, operation = {key:opts.body, promise:null};
    manualPending = operation;
    operation.promise = (async () => {
      try {
        const result = await request("/ui/session", opts);
        if (result.ok && result.signed_in === true) {
          if (epoch !== sessionEpoch) return {ok:false, status:409, error:"The local connection changed. Try signing in again."};
          sessionEpoch++; sessionInvalid = false; nativeSignedOut = false;
        }
        responseEpoch.set(result, result.ok && result.signed_in === true ? sessionEpoch : epoch);
        return result;
      } finally { if (manualPending === operation) manualPending = null; }
    })();
    return operation.promise;
  }

  /** One element, its attributes and its children. */
  M.el = function (tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (["disabled", "checked", "selected", "hidden", "required", "multiple", "readonly", "open"].includes(k) && typeof v === "boolean") n.toggleAttribute(k, v);
      else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return n;
  };
  const el = M.el;

  M.preferences = {always_show_advanced:false};
  M.applyAdvanced = function (root = document) {
    const details = [...root.querySelectorAll("details")];
    if (root.matches?.("details")) details.unshift(root);
    for (const node of details) {
      if (!node.hasAttribute("data-advanced") && !/advanced/i.test(node.querySelector(":scope > summary")?.textContent || "")) continue;
      node.setAttribute("data-advanced", "");
      if (M.preferences.always_show_advanced) node.open = true;
    }
  };
  function luminance(hex) {
    const digits=hex.slice(1), full=digits.length === 3 ? [...digits].map(c=>c+c).join("") : digits;
    const rgb=[0,2,4].map(at=>parseInt(full.slice(at,at+2),16)/255)
      .map(channel=>channel<=.04045 ? channel/12.92 : ((channel+.055)/1.055)**2.4);
    return rgb[0]*.2126 + rgb[1]*.7152 + rgb[2]*.0722;
  }
  function foreground(fill, navy) {
    const light=luminance(fill), ink=luminance(navy);
    if ((Math.max(light,ink)+.05)/(Math.min(light,ink)+.05)>=4.5) return navy;
    return (light+.05)/.05 >= 1.05/(light+.05) ? "#000000" : "#ffffff";
  }
  M.applyTheme = function () {
    const theme = M.preferences.resolved_theme;
    const root = document.documentElement;
    root.dataset.theme = theme?.base === "dark" ? "dark" : "light";
    root.dataset.density = theme?.density || "comfortable";
    const colors = {
      pink:"--poolhouse-pink", orange:"--poolhouse-orange", yellow:"--poolhouse-yellow",
      cyan:"--poolhouse-cyan", navy:"--poolhouse-navy", background:"--poolhouse-ui-bg",
      panel:"--poolhouse-ui-surface", sunken:"--poolhouse-ui-sunken", text:"--poolhouse-ui-text", muted:"--poolhouse-ui-muted", border:"--poolhouse-ui-line"
    };
    for (const [key, variable] of Object.entries(colors)) {
      if (theme?.colors?.[key]) root.style.setProperty(variable, theme.colors[key]);
      else root.style.removeProperty(variable);
    }
    const palette=getComputedStyle(root), navy=palette.getPropertyValue("--poolhouse-navy").trim();
    for (const color of ["pink","orange","yellow","cyan","navy"]) {
      root.style.setProperty(`--poolhouse-${color}-ink`,
        foreground(palette.getPropertyValue(`--poolhouse-${color}`).trim(),navy));
    }
    if (theme?.colors?.pink) root.style.setProperty("--poolhouse-ui-accent", theme.colors.pink);
    else root.style.removeProperty("--poolhouse-ui-accent");
    root.style.setProperty("--ui-font-size", `${theme?.font_size || 14}px`);
  };
  M.setPreferences = function (settings) {
    const previous = M.preferences.always_show_advanced;
    M.preferences = {...settings, always_show_advanced:settings.always_show_advanced === true};
    if (previous && !M.preferences.always_show_advanced) {
      for (const node of document.querySelectorAll("details[data-advanced]")) node.open = false;
    }
    M.applyTheme();
    M.applyAdvanced();
    window.dispatchEvent(new CustomEvent("fleet-preferences", {detail:M.preferences}));
  };
  new MutationObserver(records => {
    for (const record of records) for (const node of record.addedNodes) {
      if (node.nodeType === Node.ELEMENT_NODE) M.applyAdvanced(node);
    }
  }).observe(document.documentElement, {childList:true, subtree:true});
  document.addEventListener("toggle", event => {
    if (M.preferences.always_show_advanced && event.target.matches?.("details[data-advanced]") && !event.target.open) event.target.open = true;
  }, true);
  M.loadPreferences = async function () {
    const result = await request("/ui/settings");
    if (result.ok && !result.error) M.setPreferences({...result.settings, resolved_theme:result.resolved_theme});
  };

  /** An poolhouse-ui element with its properties set; a property set before the element is defined
      is kept by the element when it upgrades. */
  M.ui = function (tag, props = {}) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) if (v !== null && v !== undefined) n[k] = v;
    return n;
  };

  /** The children that are there: `replaceChildren` writes the word "null" for a gap. */
  M.kids = (...nodes) => nodes.flat()
    .filter((n) => n !== null && n !== undefined && n !== false);

  /** The most rows of a list the page carries: every node costs a frame, so a list is cut here, before it is drawn. */
  M.LIST_MAX = 100;

  M.row = (label, why) => el("span", {},
    el("b", {}, label), why ? el("span", { class: "why" }, why) : null);

  M.gb = (n) => (n === undefined || n === null ? null : `${Number(n).toFixed(1)} GB`);

  M.fileSize = (n) => {
    if (n >= 1e9) return `${(n / 1e9).toFixed(1)} GB`;
    if (n >= 1e6) return `${Math.round(n / 1e6)} MB`;
    if (n >= 1e3) return `${Math.round(n / 1e3)} KB`;
    return `${n || 0} bytes`;
  };

  // The badge has to be right: torch's ROCm build answers True to every CUDA question,
  // so the daemon reports vendor separately and this only renders what it is told.
  M.vendorOf = function (d = {}) {
    if (d.rocm || d.vendor === "amd") return { key: "amd", text: "AMD · ROCm" };
    if (d.cuda || d.vendor === "nvidia") return { key: "nvidia", text: "NVIDIA · CUDA" };
    if (d.vendor === "apple") return { key: "apple", text: "Apple · Metal" };
    return { key: "cpu", text: `${d.cpus || "?"} CPU` };
  };

  const CTX_STEPS = M.CTX_STEPS = [2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576];
  const KV_MB_PER_TOKEN = 17 * 4 * 256 * 2 * (34 / 32) / (1024 * 1024);

  M.ctxWords = (tokens) => `${Number(tokens).toLocaleString()} tokens`;

  M.contextPicker = function (start, onPick, {maximum} = {}) {
    const slider = M.ui("poolhouse-slider", {label:"Context length"});
    slider.id = "ctx";
    const meter = el("div", {class:"meter"}, slider);
    meter.configure = (value, cap = maximum) => {
      maximum = Number.isSafeInteger(cap) && cap > 0 ? cap : null;
      const stops = CTX_STEPS.filter(n => !maximum || n <= maximum);
      if (maximum && !stops.includes(maximum)) stops.push(maximum);
      const nearest = stops.reduce((best, n) => Math.abs(n - value) < Math.abs(best - value) ? n : best);
      slider.stops = stops;
      slider.value = nearest;
      slider.valueText = `${new Intl.NumberFormat().format(value)} tokens${stops.includes(value) ? "" : " requested · custom"}`;
      slider.hint = value > 262144
        ? "Extended context requires more memory. Supported limits are checked when starting the model."
        : "Maximum tokens in the model’s context. Larger contexts require more memory.";
    };
    slider.addEventListener("input", e => {
      if (!Number.isFinite(e.detail?.value)) return;
      meter.configure(e.detail.value); onPick(e.detail.value);
    });
    meter.configure(start); onPick(start);
    return meter;
  };

  // ------------------------------------------------------------- which screen is showing
  const IN_APP = ["studio", "tasks", "history", "chat", "board", "projects", "models", "data", "knowledge", "training", "gym", "benchmarks", "pool", "tools", "settings", "fit"];
  const available = (name) => IN_APP.includes(name) && !!document.querySelector(`${name}-view`);
  M.requestedRoute = "";
  const watchers = [];
  M.route = "";
  M.group = "";
  M.inPool = false;
  M.signInMessage = "";
  M.launchOnly = false;
  M.noticeAccepted = false;

  /** Show one screen by name, and tell every component that is watching. */
  M.go = function (name, remember = true) {
    if (name === "pool" && ["sign-in", "first-run"].includes(M.route) && available(M.requestedRoute)) {
      name = M.requestedRoute;
    }
    if (name === "pool" && ["sign-in", "first-run"].includes(M.route) && !available(M.requestedRoute)) name = available("studio") ? "studio" : available("chat") ? "chat" : "fit";
    if (IN_APP.includes(name) && !available(name)) name = available("studio") ? "studio" : available("chat") ? "chat" : "fit";
    if ((IN_APP.includes(name) || name === "first-run") && M.noticeAccepted !== true
        && customElements.get("experimental-notice")) name = "experimental-notice";
    if (IN_APP.includes(name)) {
      M.requestedRoute = name;
      if (remember && location.hash !== `#${name}`) history.pushState(null, "", `#${name}`);
    }
    if (["sign-in", "first-run"].includes(M.route) && IN_APP.includes(name)) M.loadPreferences().catch(() => {});
    M.route = name;
    const app = document.getElementById("app");
    if (app) app.hidden = !IN_APP.includes(name);
    for (const fn of watchers) fn(name);
    const workspace = document.getElementById("workspace");
    if (workspace && IN_APP.includes(name)) workspace.scrollTop = 0;
  };

  function followLocation() {
    const name = location.hash.slice(1);
    if (!available(name)) return;
    M.requestedRoute = name;
    if (IN_APP.includes(M.route) && M.route !== name) M.go(name, false);
  }
  window.addEventListener("popstate", followLocation);
  window.addEventListener("hashchange", followLocation);

  /** Run `fn` whenever the screen changes, and now if one is already showing. */
  M.onRoute = function (fn) {
    watchers.push(fn);
    if (M.route) fn(M.route);
  };

  /** Ask for the passphrase, saying why. */
  M.signIn = function (message) {
    if (IN_APP.includes(M.route)) M.requestedRoute = M.route;
    M.signInMessage = message || "";
    M.go(M.launchOnly && document.querySelector("launch-needed") ? "launch-needed" : "sign-in");
  };

  /** True when the route refused for want of a session, and the screen has been changed. */
  M.refused = function (r) {
    if (r && r.status === 401) {
      if (responseEpoch.has(r) && responseEpoch.get(r) !== sessionEpoch) return true;
      if (!sessionInvalid) { sessionEpoch++; sessionInvalid = true; }
      if (M.route !== "first-run") M.signIn();
      return true;
    }
    return false;
  };

  M.signOut = function (e) {
    if (e) e.preventDefault();
    if (signoutPending) return signoutPending;
    nativeSignedOut = true; sessionInvalid = true; sessionEpoch++;
    M.signIn();
    signoutPending = (async () => {
      try {
        if (nativePending) await nativePending;
        if (manualPending) await Promise.allSettled([manualPending.promise]);
        await M.api("/ui/session", { method: "DELETE" });
      } finally { signoutPending = null; }
    })();
    return signoutPending;
  };

  function afterNative(prior, epoch) {
    if (nativeWaiting?.epoch === epoch) return nativeWaiting.promise;
    const operation = {epoch, promise:null};
    nativeWaiting = operation;
    operation.promise = prior.then(() => {
      if (nativeWaiting !== operation || sessionEpoch !== epoch || !sessionInvalid || nativeSignedOut ||
          signoutPending || manualPending || M.route !== "launch-needed" || nativeAttempt === epoch) return false;
      return M.renewNativeSession(false);
    }).finally(() => { if (nativeWaiting === operation) nativeWaiting = null; });
    return operation.promise;
  }

  /** Renew only the native window's local connection; never replay a failed operation. */
  M.renewNativeSession = function (explicit = false) {
    const invoke = window.__TAURI__?.core?.invoke;
    if (!invoke || !M.launchOnly || location.hostname !== "127.0.0.1" || signoutPending) return Promise.resolve(false);
    if (nativePending) return sessionInvalid && nativeAttempt !== sessionEpoch
      ? afterNative(nativePending, sessionEpoch) : nativePending;
    if (manualPending) return Promise.resolve(false);
    if (!explicit && (nativeSignedOut || nativeAttempt === sessionEpoch)) return Promise.resolve(false);
    if (explicit) nativeSignedOut = false;
    const epoch = sessionEpoch, origin = location.origin;
    nativeAttempt = epoch;
    const current = () => sessionEpoch === epoch && !nativeSignedOut && location.origin === origin && M.route === "launch-needed";
    nativePending = (async () => {
      try {
        const ticket = await invoke("renew_session");
        if (!current() || typeof ticket !== "string" || !/^[A-Za-z0-9_-]{1,256}$/.test(ticket)) return false;
        const redeemed = await request("/ui/session", {method:"POST", body:JSON.stringify({ticket})});
        if (!redeemed.ok || !current()) return false;
        const confirmed = await request("/ui/session");
        if (!confirmed.ok || confirmed.signed_in !== true || !current()) return false;
        sessionEpoch++; sessionInvalid = false;
        await M.boot(() => sessionEpoch === epoch + 1 && !nativeSignedOut && location.origin === origin && M.route === "launch-needed");
        return sessionEpoch === epoch + 1 && !nativeSignedOut && location.origin === origin;
      } catch { return false; }
      finally { nativePending = null; }
    })();
    return nativePending;
  };

  M.reopenNative = async function () {
    if (signoutPending) return false;
    if (nativePending) return M.renewNativeSession(true);
    if (manualPending) return false;
    const epoch = sessionEpoch, origin = location.origin;
    const session = await request("/ui/session");
    if (sessionEpoch !== epoch || location.origin !== origin || nativePending || manualPending || signoutPending) return false;
    if (session.ok && session.signed_in === true) return true;
    if (!sessionInvalid) { sessionEpoch++; sessionInvalid = true; }
    M.signIn();
    return M.renewNativeSession(true);
  };

  /** What to show when the page opens: setup, sign in, or a screen. */
  M.boot = async function (current = () => true) {
    try {
      const launchURL = new URL(location.href);
      const ticket = launchURL.searchParams.get("launch_ticket");
      if (ticket !== null) {
        launchURL.searchParams.delete("launch_ticket");
        history.replaceState(null, "", launchURL.pathname + launchURL.search + launchURL.hash);
        if (location.hostname === "127.0.0.1" || location.hostname === "localhost" || location.hostname === "[::1]") {
          try { await request("/ui/session", {method:"POST", body:JSON.stringify({ticket})}); }
          catch (_) { /* The ordinary sign-in view handles expired tickets. */ }
        }
      }
      const hash = location.hash.slice(1);
      const asked = available(hash) ? hash
        : (location.pathname.replace(/\/$/, "") === "/ui/fit" ? "fit" : available("studio") ? "studio" : "chat");
      const opened = document.querySelector(`${asked}-view`) ? asked
        : (IN_APP.find((n) => document.querySelector(`${n}-view`)) || asked);
      M.requestedRoute = opened;
      const setup = await request("/ui/setup");
      if (!current()) return false;
      M.noticeAccepted = setup.experimental_notice_accepted === true;
      M.group = setup.group || "";
      M.inPool = !!setup.needs_password;
      const launched = (await request("/ui/session")).signed_in;
      if (!current()) return false;
      M.launchOnly = !!document.querySelector("launch-needed")
        && ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname)
        && (!setup.in_pool || setup.pool_mode === "dev");
      if (!launched && M.launchOnly) { releaseBoot(); return M.go("launch-needed"); }
      if (!launched && setup.needs_password) { releaseBoot(); return M.signIn(); }
      if (setup.needs_setup && document.querySelector("first-run")) { releaseBoot(); return M.go("first-run"); }
      if (!setup.needs_password) { await M.loadPreferences(); if (!current()) return false; releaseBoot(); return M.go(M.requestedRoute); }
      const s = await request("/ui/session");
      if (!current()) return false;
      if (s.signed_in) await M.loadPreferences();
      if (!current()) return false;
      releaseBoot();
      return s.signed_in ? M.go(M.requestedRoute) : M.signIn();
    } finally {
      releaseBoot();
    }
  };

  M.followSetupJob = async function (job, onUpdate = () => {}) {
    let current = job;
    while (true) {
      onUpdate(current);
      if (current.state === "done") return current.result || {};
      if (current.state === "failed") throw new Error(current.error || current.note || "Installation failed.");
      await new Promise((resolve) => setTimeout(resolve, 1000));
      const response = await M.api("/ui/setup/jobs");
      if (response.error || response.status === 401) throw new Error(response.error || "Sign in to check installation status.");
      current = (response.jobs || []).find((candidate) => candidate.id === job.id);
      if (!current) throw new Error("Installation status is unavailable. Open settings to retry.");
    }
  };

  class FleetModel extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      M.boot();
    }
  }
  customElements.define("fleet-model", FleetModel);
})();
</script>
