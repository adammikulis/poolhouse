<style>
data-view .page-shell:not([hidden]) {height:calc(100dvh - var(--header-height));display:flex;flex-direction:column;gap:12px;overflow:hidden}
data-view #local-datasets:not([hidden]),data-view #discover-datasets:not([hidden]) {display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
data-view .data-head { display:flex; justify-content:space-between; gap:20px; align-items:center; margin-bottom:0;flex:0 0 auto; }
data-view .data-head .data-tabs {margin:0;flex-wrap:wrap}
data-view .data-layout { display:grid; grid-template-columns:minmax(280px, .9fr) minmax(340px,1.4fr); gap:var(--page-gap);align-items:stretch;flex:1;min-height:0;overflow:hidden; }
data-view .data-panel { background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--page-panel-radius);overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column; }
data-view .data-panel-head { padding:20px 22px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; justify-content:space-between; }
data-view .data-panel-head h2 { margin:0; font-size:17px; }
data-view .data-count { background:var(--poolhouse-yellow,#ffd166); color:var(--poolhouse-yellow-ink,var(--poolhouse-navy,#1b1f3a)); border-radius:30px; padding:4px 10px; font-size:12px; font-weight:700; }
data-view #crumbs { padding:12px 20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--bg-sunken); }
data-view #crumbs button { background:transparent; color:var(--text); border:0; padding:4px; font-size:12px; }
data-view #files {min-height:0;overflow:auto;flex:1}
data-view .data-file { display:flex; gap:12px; align-items:center; width:100%; padding:16px 20px; border:0; border-bottom:1px solid var(--line); background:var(--bg-raised); color:var(--text); text-align:left; border-radius:0; }
data-view .data-file:hover, data-view .data-file[aria-pressed=true] { background:var(--bg-sunken); }
data-view .data-file-icon { border-radius:10px; background:var(--poolhouse-orange,#ff8a3d); color:var(--poolhouse-orange-ink,var(--poolhouse-navy,#1b1f3a)); padding:10px 8px; min-width:38px; text-align:center; font-size:10px; font-weight:800; }
data-view .data-file.folder .data-file-icon { background:var(--poolhouse-yellow,#ffd166); color:var(--poolhouse-yellow-ink,var(--poolhouse-navy,#1b1f3a)); }
data-view .data-file-copy { display:grid; gap:4px; min-width:0; flex:1; }
data-view .data-file-copy strong { overflow-wrap:anywhere; font-size:13px; }
data-view .data-file-copy small { color:var(--muted); font-size:11px; }
data-view .data-empty { padding:38px 24px; text-align:center; color:var(--muted); line-height:1.6; }
data-view .data-empty b { display:block; margin-bottom:6px; color:var(--text); }
data-view .data-search { margin:16px 20px; width:calc(100% - 40px)!important; box-sizing:border-box; }
data-view .data-preview-body {padding:var(--page-gutter);overflow:auto;min-height:0;flex:1}
data-view .data-preview-body table { font-size:12px; min-width:100%; }
data-view .data-preview-body th { background:var(--bg-sunken); font-size:11px; text-transform:uppercase; letter-spacing:.6px; }
data-view .data-preview-body td { max-width:280px; overflow-wrap:anywhere; vertical-align:top; }
data-view .data-preview-info { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
data-view .data-preview-info span { border:1px solid var(--line); border-radius:20px; padding:4px 9px; font-size:11px; }
data-view .data-preview-info span:first-child { background:var(--poolhouse-cyan,#2de2e6); border-color:transparent; color:var(--poolhouse-cyan-ink,var(--poolhouse-navy,#1b1f3a)); }
data-view #preview { background:var(--bg-sunken); font-size:12px; }
data-view #upload {max-height:45%;overflow:auto;flex:0 1 auto;margin-bottom:var(--page-gap); padding:24px; background:var(--bg-raised); border:1px solid var(--line); border-top:4px solid var(--poolhouse-orange,#ff8a3d); border-radius:18px; }
data-view #upload[hidden] { display:none; }
data-view #upload h2 { margin:0 0 8px; }
data-view .data-upload-fields { display:grid; grid-template-columns:1fr 1.6fr; gap:24px; }
data-view #upload input:not([type=checkbox]) { width:100%; box-sizing:border-box; }
data-view .data-tabs { display:flex; gap:6px; margin:12px 0; }
data-view .data-tabs button { background:var(--bg-sunken); border:1px solid var(--line); color:var(--text); }
data-view .data-tabs button[aria-pressed=true],data-view .data-tabs button[aria-selected=true] { background:var(--poolhouse-navy,#1b1f3a); color:var(--poolhouse-navy-ink,#fff); }
data-view .data-primary { background:var(--poolhouse-orange,#ff8a3d); border-color:var(--poolhouse-orange,#ff8a3d); color:var(--poolhouse-orange-ink,var(--poolhouse-navy,#1b1f3a)); font-weight:750; }
data-view .data-secondary { background:var(--bg-raised); color:var(--text); border:1px solid var(--line); }
data-view .data-preview-actions { display:flex; gap:12px; align-items:center; }
@media(max-width:850px){data-view .data-layout,data-view .data-upload-fields{grid-template-columns:1fr}data-view .data-layout{grid-template-rows:minmax(120px,.6fr) minmax(0,1fr)}data-view .data-head{align-items:start;flex-wrap:wrap;gap:8px}data-view .data-head .data-tabs button{padding:8px;font-size:12px}data-view .data-preview-actions{flex-wrap:wrap}}
</style>
<template>
<section class="workspace page-shell" aria-label="Datasets" hidden>
  <header class="data-head page-heading"><div class="data-tabs" role="tablist" aria-label="Dataset library"><button type="button" id="data-local-tab" role="tab" aria-selected="true" aria-controls="local-datasets">Local datasets</button><button type="button" id="data-discover-tab" role="tab" aria-selected="false" aria-controls="discover-datasets" tabindex="-1">Discover Hugging Face</button></div><button type="button" id="add-dataset" class="data-primary">+ Add dataset</button></header>
  <div id="local-datasets" role="tabpanel" aria-labelledby="data-local-tab">
  <section id="upload" hidden aria-label="Add dataset"><h2>Add a dataset</h2><p class="intro">Upload a text file or paste content. New files stay in your workspace.</p><div class="data-upload-fields"><div id="destination"></div><div><div class="data-tabs" aria-label="Dataset source"><button type="button" id="paste-tab" aria-pressed="true">Paste content</button><button type="button" id="file-tab" aria-pressed="false">Choose a file</button></div><div id="paste-source"></div><div id="file-source" hidden></div></div></div><div id="upload-actions" class="workspace-actions"></div></section>
  <p class="status" role="status" aria-live="polite"></p>
  <div class="data-layout"><section class="data-panel"><div class="data-panel-head"><h2>Library</h2><span class="data-count" id="dataset-count">Loading…</span></div><div id="crumbs"></div><input class="data-search" id="dataset-search" type="search" aria-label="Filter files in this folder" placeholder="Filter this folder…"><div id="files"></div></section>
  <section class="data-panel"><div class="data-panel-head"><h2 id="preview-title">Dataset preview</h2><div class="data-preview-actions"><button type="button" id="use-studio" class="data-primary" hidden>Use in Studio</button><button type="button" id="use-dataset" class="data-secondary" hidden>Choose training recipe</button></div></div><div class="data-preview-body"><div id="structured-preview"><div class="data-empty"><b>Select a dataset</b>Select a dataset to inspect its fields and sample records.</div></div><details id="raw-preview" data-advanced hidden><summary>Source text</summary><pre id="preview">Select a file to preview it.</pre></details></div></section></div>
  </div><div id="discover-datasets" role="tabpanel" aria-labelledby="data-discover-tab" hidden><data-discover></data-discover></div>
</section>
</template>
<script>
(function(){
const M=window.fleetModel,W=window.workspaceModel,D=window.datasetModel,E=M.el;
class DataView extends HTMLElement {
 connectedCallback(){
  if(this.wired)return;this.wired=true;this.host=this.querySelector('section');this.note=this.querySelector('.status');this.path='';this.files=[];this.source='paste';this.mode='local';this.localGeneration=0;this.previewIntent=0;
  const box=this.querySelector('#destination');
  this.datasetName=W.field(box,'Dataset name','input',{placeholder:'My examples'});
  const advanced=E('details',{'data-advanced':''},E('summary',{},'File location'));box.append(advanced);
  this.name=W.field(advanced,'Destination relative to files root','input',{placeholder:'datasets/my-examples.jsonl'});
  this.generatedPath=true;this.name.oninput=()=>{this.generatedPath=false;};
  this.datasetName.oninput=()=>{if(!this.generatedPath)return;this.name.value='datasets/'+this.datasetName.value.trim().toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')+'.'+(this.file?.files[0]?.name.split('.').pop().toLowerCase()||'jsonl');};
  box.append(E('p',{class:'intro'},'JSONL, JSON, CSV and text · up to 10 MB per upload. Existing files are preserved.'));
  this.file=W.field(this.querySelector('#file-source'),'Choose a text / JSONL file','input',{type:'file',accept:'.jsonl,.json,.csv,.txt'});
  this.text=W.field(this.querySelector('#paste-source'),'Or paste dataset content','textarea',{placeholder:'{"prompt":"A question", "response":"An answer"}\nOne JSON object per line'});
  this.uploadButton=W.button('Upload',()=>this.upload());this.uploadButton.className='data-primary';
  this.querySelector('#upload-actions').append(this.uploadButton,W.button('Cancel',()=>this.showUpload(false)));
  this.querySelector('#add-dataset').onclick=()=>this.showUpload(true);
  this.querySelector('#paste-tab').onclick=()=>this.setSource('paste');this.querySelector('#file-tab').onclick=()=>this.setSource('file');
  this.querySelector('#dataset-search').oninput=()=>this.drawFiles();
  this.querySelector('#use-studio').onclick=()=>this.useStudio();
  this.querySelector('#use-dataset').onclick=()=>{if(this.selected){sessionStorage.setItem('poolhouse-dataset',this.selected.path);M.go('training');}};
  this.file.onchange=()=>{if(!this.file.files[0])return;if(!this.datasetName.value)this.datasetName.value=this.file.files[0].name.replace(/\.[^.]+$/,'');if(this.generatedPath)this.datasetName.oninput();};
  this.discover=this.querySelector('data-discover');
  for(const key of ['local','discover']){const button=this.querySelector('#data-'+key+'-tab');button.onclick=()=>this.setMode(key);button.onkeydown=event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?'local':event.key==='End'?'discover':this.mode==='local'?'discover':'local';this.setMode(next);this.querySelector('#data-'+next+'-tab').focus();}};}
  M.onRoute(route=>{this.localGeneration++;this.host.hidden=route!=='data';if(route==='data')this.setMode(this.mode);else this.discover.leave();});
 }
 currentLocal(){return this.isConnected&&M.route==='data'&&location.hash==='#data'&&this.mode==='local'&&!this.host.hidden;}
 setMode(mode){this.mode=mode;this.localGeneration++;for(const key of ['local','discover']){const button=this.querySelector('#data-'+key+'-tab');button.setAttribute('aria-selected',String(key===mode));button.tabIndex=key===mode?0:-1;}this.querySelector('#local-datasets').hidden=mode!=='local';this.querySelector('#discover-datasets').hidden=mode!=='discover';if(mode==='discover')this.discover.enter();else{this.discover.leave();if(M.route==='data')this.load();}}
 showUpload(show){if(show)this.setMode('local');this.querySelector('#upload').hidden=!show;if(show)this.datasetName.focus();}
 async useStudio(){if(this.studioHandoff)return;const studio=document.querySelector('studio-view'),graph=studio?.graph,ownership=studio?.workflowContext;const button=this.querySelector('#use-studio');button.disabled=true;try{await D.useStudio(this);}catch(error){if(error.cancelled)return;if(M.route==='studio'){if(studio?.graph===graph&&studio?.workflowContext===ownership)studio.message(error.message);}else if(this.currentLocal())this.note.textContent=error.message;}finally{button.disabled=false;}}
 setSource(source){this.source=source;['paste','file'].forEach(key=>{this.querySelector('#'+key+'-source').hidden=key!==source;this.querySelector('#'+key+'-tab').setAttribute('aria-pressed',String(key===source));});}
 async load(){
  const generation=this.localGeneration,path=this.path,epoch=M.sessionContext();
  const current=()=>this.currentLocal()&&generation===this.localGeneration&&path===this.path&&M.sessionContext()===epoch;
  const imported=path===''?M.api('/ui/studio/resources').then(value=>({value}),error=>({error})):null;
  try{
   const r=await M.api('/ui/workspace/files?path='+encodeURIComponent(path));if(!current())return;
   if(!r.ok){M.refused(r);throw Error(r.error||'Local datasets are unavailable.');}this.files=r.files.filter(f=>f.directory&&!['jobs','studio','studio-device-resources'].includes(f.name)||!f.directory&&/\.(jsonl|json|csv|txt)$/i.test(f.name));
   const crumbs=[W.button('Library root',()=>this.folder(''))];let currentPath='';
   this.path.split('/').filter(Boolean).forEach(part=>{currentPath+=(currentPath?'/':'')+part;const path=currentPath;crumbs.push(E('span',{},'/'),W.button(part,()=>this.folder(path)));});
   this.querySelector('#crumbs').replaceChildren(...crumbs);this.drawFiles();
   if(!imported)return;
   const result=await imported;if(!current())return;
   if(result.error)throw Error('Imported datasets are unavailable: '+result.error.message);
   if(!result.value.ok){if(result.value.status===403)this.managedUnavailable();M.refused(result.value);throw Error(result.value.error||'Imported datasets are unavailable.');}
   if(!Array.isArray(result.value.datasets))throw Error('The imported dataset inventory is unavailable.');
   const seen=new Set(this.files.map(row=>row.path));
   for(const row of result.value.datasets){
    if(row.source!=='huggingface-preview')continue;
    if(typeof row.id!=='string'||!/^datasets\/huggingface\/[a-f0-9]{64}\/dataset\.jsonl$/.test(row.id)||typeof row.title!=='string'||!row.title||!Number.isSafeInteger(row.rows)||row.rows<1||!Array.isArray(row.columns))throw Error('The imported dataset inventory changed.');
    if(seen.has(row.id))continue;seen.add(row.id);
    this.files.push({path:row.id,name:row.title,rows:row.rows,columns:row.columns.length,managed:true,directory:false});
   }
   if(this.selected?.managed&&!seen.has(this.selected.path))this.managedUnavailable();
   this.drawFiles();
  }catch(error){if(current())W.status(this.note,error);}
 }

 managedUnavailable(){
  if(!this.selected?.managed)return;this.previewIntent++;this.previewRequest=Symbol();this.selected=null;
  this.querySelector('#use-dataset').hidden=true;this.querySelector('#use-studio').hidden=true;this.querySelector('#preview-title').textContent='Dataset preview';
  this.querySelector('#structured-preview').replaceChildren(E('p',{},'This imported dataset is no longer available.'));this.querySelector('#raw-preview').hidden=true;
 }
 folder(path){this.previewIntent++;this.localGeneration++;this.previewRequest=Symbol();this.path=path;this.selected=null;this.querySelector('#dataset-search').value='';this.querySelector('#use-dataset').hidden=true;this.querySelector('#use-studio').hidden=true;this.querySelector('#preview-title').textContent='Dataset preview';this.querySelector('#structured-preview').replaceChildren(E('div',{class:'data-empty'},E('b',{},'Choose a file'), 'Open a dataset to inspect its examples.'));this.querySelector('#raw-preview').hidden=true;this.load();}
 drawFiles(){
  const term=this.querySelector('#dataset-search').value.toLowerCase();const files=this.files.filter(f=>f.name.toLowerCase().includes(term));
  this.querySelector('#dataset-count').textContent=this.files.filter(f=>!f.directory).length+' files';
  this.querySelector('#files').replaceChildren(...files.map(f=>{
   const ext=f.managed?'DATA':f.name.split('.').pop().toUpperCase().slice(0,5);
   const button=W.button('',()=>this.open(f));button.className='data-file'+(f.directory?' folder':'');button.setAttribute('aria-pressed',String(this.selected?.path===f.path));
   button.append(E('span',{class:'data-file-icon','aria-hidden':'true'},f.directory?'DIR':ext),E('span',{class:'data-file-copy'},E('strong',{},f.name),E('small',{},f.directory?'Folder':f.managed?f.rows+' rows · '+f.columns+' fields':M.fileSize(f.bytes))),E('span',{'aria-hidden':'true'},'›'));return button;
  }));
  if(!files.length)this.querySelector('#files').append(E('div',{class:'data-empty'},E('b',{},term?'No matching files':'A fresh start'),term?'Try a different filename.':'Upload a dataset or discover one on Hugging Face.'));
 }
 async open(f,explicit=true){
  if(explicit)this.previewIntent++;
  if(f.directory)return this.folder(f.path);const token=Symbol(),generation=this.localGeneration,epoch=M.sessionContext();this.previewRequest=token;
  try{
   const r=await M.api('/ui/workspace/datasets/local-preview?path='+encodeURIComponent(f.path));
   if(!this.currentLocal()||generation!==this.localGeneration||this.previewRequest!==token||M.sessionContext()!==epoch)return;
   if(!r.ok){M.refused(r);throw Error(r.error||'This dataset preview is unavailable.');}
   if(r.path!==f.path||!Array.isArray(r.rows)||!Array.isArray(r.columns))throw Error('The selected dataset preview changed.');
   this.selected={...f,bytes:r.bytes};this.drawFiles();this.querySelector('#preview-title').textContent=f.name;
   const jsonl=f.path.toLowerCase().endsWith('.jsonl')&&r.rows.length>0;
   this.querySelector('#use-dataset').hidden=!!f.managed||!jsonl||!document.querySelector('training-view');this.querySelector('#use-studio').hidden=!jsonl;
   this.querySelector('#preview').textContent=r.text||r.rows.map(row=>JSON.stringify(row)).join('\n');this.querySelector('#raw-preview').hidden=false;
   this.querySelector('#raw-preview summary').textContent=r.rows.length?'JSON sample':'Text preview';
   if(r.rows.length)D.table(this.querySelector('#structured-preview'),r.rows,r.columns,'Sample of '+r.rows.length+' rows · '+r.columns.length+' fields · '+M.fileSize(r.bytes)+(r.truncated?' · file preview truncated':' · current local file')+' · choose a workflow or training recipe to check its required fields.');
   else this.querySelector('#structured-preview').replaceChildren(E('p',{class:'intro'},r.truncated?'Partial text preview · no complete tabular sample is available.':'Text preview · this file has no object records in the sample.'),E('pre',{},r.text));
  }catch(error){if(this.currentLocal()&&generation===this.localGeneration&&this.previewRequest===token&&M.sessionContext()===epoch)W.status(this.note,error);}
 }
 async upload(){
  if(this.pending)return;
  const generation=this.localGeneration,epoch=M.sessionContext(),previewIntent=this.previewIntent,folder=this.path,source=this.source,name=this.name.value,content=this.text.value,file=this.file.files[0];
  const formCurrent=()=>M.sessionContext()===epoch&&this.currentLocal()&&generation===this.localGeneration&&previewIntent===this.previewIntent&&source===this.source&&name===this.name.value&&content===this.text.value&&file===this.file.files[0];
  const current=()=>formCurrent()&&folder===this.path;
  try{
   const path=name.trim(),chosen=source==='file'?file:null;
   if(!path||/^datasets\/\.[^.]+$/.test(path))throw Error('Name this dataset before uploading.');
   if(chosen&&chosen.size>10000000)throw Error('File exceeds the 10 MB upload limit.');
   if(this.source==='file'&&!file)throw Error('Choose a file before uploading.');
   if(this.source==='paste'&&!this.text.value.trim())throw Error('Paste dataset content before uploading.');
   this.pending=true;this.uploadButton.disabled=true;this.uploadButton.textContent='Uploading…';this.note.textContent='Uploading dataset…';
   const text=chosen?await chosen.text():content;
   if(!current())return;
   const result=await M.api('/ui/workspace/file',{method:'POST',body:JSON.stringify({path,text})});
   if(!current())return;
   if(!result.ok){M.refused(result);throw Error(result.error||'Dataset upload failed.');}
   const destination=path.split('/').slice(0,-1).join('/');this.path=destination;await this.load();
   if(!formCurrent()||this.path!==destination)return;this.showUpload(false);
   const uploaded=this.files.find(f=>f.path===path);if(uploaded)await this.open(uploaded,false);
   if(!formCurrent()||this.path!==destination)return;
   this.note.textContent='Dataset uploaded. Inspect its records, then choose a workflow or training recipe.';
  }catch(error){if(current())W.status(this.note,error);}finally{this.pending=false;this.uploadButton.disabled=false;this.uploadButton.textContent='Upload';}
 }
}
customElements.define('data-view',DataView);
})();
</script>
