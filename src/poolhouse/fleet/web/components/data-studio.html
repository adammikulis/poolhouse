<script>
(function(){
 const M=window.fleetModel,D=window.datasetModel;
 const cancelled=message=>Object.assign(Error(message),{cancelled:true});
 D.useStudio=async data=>{
  if(data.studioHandoff)return data.studioHandoff;
  const selected=data.selected,studio=document.querySelector('studio-view');
  if(!selected||!studio||!data.currentLocal()||!selected.path.endsWith('.jsonl'))throw Error('Select a JSONL dataset before opening Studio.');
  const held={graph:studio.graph,root:studio.rootGraph(),workflow:studio.workflowId,serial:studio.editSerial,
   ownership:studio.workflowContext,group:(studio.context||[]).map(item=>item.node.id).join('/'),selected};
  const same=()=>studio.isConnected&&data.selected===held.selected&&studio.graph===held.graph&&studio.rootGraph()===held.root
   &&studio.workflowContext===held.ownership&&(!held.workflow||studio.workflowId===held.workflow)&&studio.editSerial===held.serial&&(studio.context||[]).map(item=>item.node.id).join('/')===held.group;
  const run=async()=>{
   const intent=++studio.selectionIntent;
   await new Promise((resolve,reject)=>{
    let context=null;
    const cleanup=()=>{studio.removeEventListener('studio-load-settled',settled);studio.removeEventListener('studio-context',changed);studio.removeEventListener('studio-selection',selection);observer.disconnect();};
    const finish=error=>{cleanup();if(error)reject(error);else resolve();};
    const changed=()=>{if(context!==null&&(studio.loadContext!==context||M.route!=='studio'))finish(cancelled('Dataset selection cancelled because the Studio context changed.'));};
    const selection=()=>{if(studio.workflowContext!==held.ownership)finish(cancelled('Dataset selection cancelled because the workflow changed.'));};
    const settled=event=>{
     if(context===null||event.detail.context!==context)return;
     if(!same()||studio.selectionIntent!==intent||M.route!=='studio'||location.hash!=='#studio')return finish(cancelled('Dataset selection cancelled because the workflow changed.'));
     if(!event.detail.ready)return finish(Error('Studio is unavailable. The dataset was not added.'));
     finish();
    };
    const observer=new MutationObserver(()=>{if(!studio.isConnected)finish(Error('Studio closed before the dataset was added.'));});
    observer.observe(document.body,{childList:true,subtree:true});
    studio.addEventListener('studio-load-settled',settled);studio.addEventListener('studio-context',changed);studio.addEventListener('studio-selection',selection);
    M.go('studio');context=studio.loadContext;
   });
   if(!same()||studio.selectionIntent!==intent||M.route!=='studio')return;
   const folder=selected.path.split('/').slice(0,-1).join('/');
   const result=await M.api('/ui/workspace/files?path='+encodeURIComponent(folder));
   if(!same()||studio.selectionIntent!==intent||M.route!=='studio'||location.hash!=='#studio')return;
   if(!result.ok){M.refused(result);throw Error(result.error||'This dataset is unavailable.');}
   const file=result.files?.find(row=>row.path===selected.path&&row.directory===false&&row.bytes===selected.bytes);
   if(!file)throw Error('The selected dataset changed. Open its current preview again.');
   const spec=studio.specs.find(item=>item.type==='dataset');
   if(!spec)throw Error('The dataset node is unavailable.');
   studio.add(spec,undefined,{dataset:{kind:'dataset',id:selected.path}});
   studio.message('Dataset added. Choose the next step in this workflow.');
  };
  data.studioHandoff=run();
  try{return await data.studioHandoff;}finally{data.studioHandoff=null;}
 };
})();
</script>
