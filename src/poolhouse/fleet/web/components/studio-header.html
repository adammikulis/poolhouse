<script>
(() => {
  const S = window.studioModel;
  S.installHeader = proto => Object.assign(proto, {
      setupHeaderCommands() {
        const menus = [...this.querySelectorAll(".studio-command")];
        const close = (menu, restore = true) => { menu.open = false; if (restore) menu.querySelector("summary").focus(); };
        this.addEventListener("click", event => {
          for (const menu of menus) {
            if (!menu.contains(event.target)) menu.open = false;
            else if (event.target.closest("button")) {
              const restore = document.activeElement === event.target.closest("button") || document.activeElement === document.body;
              menu.open = false;
              if (restore) menu.querySelector("summary").focus();
              this.querySelector("dialog[open]")?.addEventListener("close", () => menu.querySelector("summary").focus(), {once:true});
            }
          }
        });
        this.addEventListener("keydown", event => {
          const menu = event.target.closest(".studio-command");
          if (menu?.open && event.key === "Escape") { event.preventDefault(); event.stopPropagation(); close(menu); }
        }, true);
        this.addEventListener("change", event => {
          if (event.target.id !== "studio-workflows") return;
          const menu = event.target.closest(".studio-command");
          close(menu, menu.contains(document.activeElement) || document.activeElement === document.body);
        });
        this.headerOutside = event => { if (!this.contains(event.target)) for (const menu of menus) menu.open = false; };
        document.addEventListener("click", this.headerOutside);
      }
  });
})();
</script>
