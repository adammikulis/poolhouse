<style>
chat-view dialog { color:var(--text); background:var(--bg-raised); border:1px solid var(--line); border-radius:16px; padding:calc(24px * var(--ui-density,1)); }
chat-view dialog::backdrop { background:color-mix(in srgb,var(--poolhouse-navy,var(--text)) 50%,transparent); }
chat-view #chat-model-dialog { width:min(600px,90vw); max-height:85vh; }
chat-view #chat-model-list { overflow-y:auto; max-height:55vh; margin:calc(16px * var(--ui-density,1)) 0; }
chat-view .chat-model-family h3 { color:var(--muted); font-size:0.7857rem; letter-spacing:.06em; text-transform:uppercase; margin:calc(18px * var(--ui-density,1)) 0 calc(8px * var(--ui-density,1)); }
chat-view .chat-model-choice { display:flex; justify-content:space-between; gap:calc(12px * var(--ui-density,1)); width:100%; text-align:left; margin:calc(6px * var(--ui-density,1)) 0; background:var(--bg); color:var(--text); border:1px solid var(--line); }
chat-view .chat-model-choice small { color:var(--muted); }
chat-view .chat-model-choice[aria-pressed=true] { border-color:var(--poolhouse-pink); background:color-mix(in srgb,var(--poolhouse-pink) 10%,var(--bg-raised)); }
chat-view .chat-model-action { color:var(--accent-ink,var(--text)); }
chat-view .chat-row-menu { position:relative; flex:none; }
chat-view .chat-row-menu summary { cursor:pointer; list-style:none; padding:calc(6px * var(--ui-density,1)); color:var(--muted); }
chat-view .chat-row-menu summary::-webkit-details-marker { display:none; }
chat-view .chat-row-menu[open] { z-index:2; }
chat-view .chat-row-menu > div { position:absolute; right:0; top:100%; padding:calc(6px * var(--ui-density,1)); border:1px solid var(--line); border-radius:10px; background:var(--bg-raised); box-shadow:var(--shadow); }

chat-view .msg p { margin:0 0 calc(10px * var(--ui-density,1)); }
chat-view .msg p:last-child { margin-bottom:0; }
chat-view .copy-message { display:block; width:auto; padding:calc(4px * var(--ui-density,1)) calc(8px * var(--ui-density,1)); margin-top:8px; font-size:0.7143rem; color:var(--muted); }
chat-view .chat-coding-fields { margin:0; padding:calc(14px * var(--ui-density,1)) calc(28px * var(--ui-density,1)); background:var(--bg); }

chat-view #chat-activity-output { max-height:240px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:0.8571rem; }
@media(max-width:600px) { chat-view .chat-coding-pair { grid-template-columns:1fr; gap:0; } }
</style>
<script>
(function () {
  const M = window.fleetModel;
  M.chatTargetKey = row => row.local === true && typeof row.path === 'string' && row.path ? row.path : row.model;
  M.chatTarget = (rows, key, localOnly = false) => {
    const found = rows.filter(row => row.model === key || (row.local === true && row.path === key));
    return found.length === 1 && found[0].capabilities?.chat !== false &&
      (!localOnly || found[0].local === true) ? found[0] : null;
  };
  class ChatModelPicker {
    constructor(chat) {
      this.chat = chat;
      this.button = chat.querySelector("#chat-model-button");
      this.dialog = chat.querySelector("#chat-model-dialog");
      this.search = chat.querySelector("#chat-model-search");
      this.list = chat.querySelector("#chat-model-list");
      this.library = [];
      this.selectionEpoch = 0;
      this.choiceEpoch = 0;
      this.parameterEpoch = 0;
      chat.outputTokens.addEventListener("input", () => this.parameterEpoch++);
      this.unconfirmed = new Set();
      this.startOptions = new Map();
      M.onRoute(route => {
        this.selectionEpoch++;
        if (!this.pendingHandoff) return;
        if (!this.pendingHandoff.entered && route === 'chat') {
          this.pendingHandoff.entered = true; this.pendingHandoff.route = this.selectionEpoch;
        } else this.pendingHandoff = null;
      });
      this.button.onclick = () => {
        if (chat.request || chat.loadingConversation) return;
        this.search.value = "";
        this.render();
        this.dialog.showModal();
        this.search.focus();
      };
      chat.querySelector("#chat-model-close").onclick = () => this.dialog.close();
      this.search.oninput = () => this.render();
      this.search.onkeydown = (event) => {
        if (event.key === "Escape") { event.preventDefault(); this.dialog.close(); return; }
        if (event.key === "Enter") {
          const first = this.list.querySelector("[data-picker-kind]:not(:disabled)");
          if (first) { event.preventDefault(); first.click(); }
        }
      };
    }
    async catalogue(current = () => true) {
      const session = M.sessionContext(), load = this.chat.loadEpoch, cid = this.chat.open;
      const data = await M.api("/ui/models");
      if (session !== M.sessionContext() || load !== this.chat.loadEpoch || cid !== this.chat.open || !current() || M.refused(data)) return;
      this.problem = data.ok ? '' : data.error || 'Could not read the model library.';
      if (data.ok) this.library = data.library || [];
    }
    rows() {
      const chat = this.chat;
      const rows = [...chat.picker.options].filter((one) => one.value).map((option) => {
        const live = M.chatTarget(chat.chatModels || [], option.value);
        const installed = this.library.find(one => one.path === option.value ||
          (live?.local === true && one.path === live.path));
        const needsLoad = !!installed?.servable && !live;
        return { value: needsLoad ? installed.path : option.value, needsLoad, name: installed?.name || option.textContent,
          family: installed?.family || "Other models", status: live ? "Running" : installed ? "Available" :
          option.disabled ? "Unavailable" : "Running",
          quant: installed?.quantization || "", disabled: needsLoad ? false : option.disabled, installed,
          capabilities: live?.capabilities || installed?.capabilities };
      }).filter((one) => one.capabilities?.chat !== false);
      {
        for (const installed of this.library.filter((one) => one.servable && one.capabilities?.chat !== false)) {
          if (rows.some((one) => one.installed?.path === installed.path)) continue;
          rows.push({ value: installed.path, name: installed.name, family: installed.family || "Other models",
            status: "Available", quant: installed.quantization || "", installed, needsLoad: true,
            capabilities: installed.capabilities });
        }
      }
      return rows;
    }
    render() {
      const chat = this.chat;
      this.button.textContent = chat.picker.selectedOptions[0]?.textContent || "Choose a model";
      this.button.disabled = !!chat.request || !!chat.loadingConversation || !!this.startPending;
      const query = this.search.value.trim().toLowerCase();
      const rows = this.rows().filter((one) => `${one.name} ${one.family} ${one.quant} ${one.status}`.toLowerCase().includes(query));
      const groups = new Map();
      for (const row of rows) {
        if (!groups.has(row.family)) groups.set(row.family, []);
        groups.get(row.family).push(row);
      }
      this.list.replaceChildren(M.el("button", {type:"button", class:"ghost", onclick:() => {
        this.dialog.close(); M.go("models");
      }}, "Add New Model (Model Library)"));
      if (this.startMessage) this.list.append(M.el("p", {role:"status", class:"hint"}, this.startMessage));
      for (const [family, models] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
        const group = M.el("section", { class: "chat-model-family" }, M.el("h3", {}, family));
        for (const row of models.sort((a, b) => Number(b.status === "Running") - Number(a.status === "Running") || a.name.localeCompare(b.name))) {
          const button = M.el("button", { type: "button", class: "chat-model-choice",
            ...((row.disabled || this.startPending) ? { disabled: "" } : {}),
            "data-picker-kind":"model", "aria-pressed": String(chat.picker.value === row.value), onclick: () => this.choose(row) },
          M.el("span", {}, row.name), M.el("small", {}, [row.status, row.quant,
            row.capabilities?.chat === null ? "Chat capability unverified" : ""].filter(Boolean).join(" · ")),
          row.needsLoad ? M.el("small", {class:"chat-model-action"}, "Start in Chat") : null);
          group.append(button);
          if (row.needsLoad) {
            const options = this.optionsFor(row); options.disabled = !!this.startPending;
            group.append(options.element);
          }
        }
        this.list.append(group);
      }
      this.renderAgents(query);
      if (!rows.length) this.list.append(M.el("p", { class: "hint" }, this.problem ||
        (query ? "No models match your search." : "No chat models are available yet.")));
    }
    renderAgents(query) {
      const workspace = this.chat.workspace, data = workspace?.navigationData;
      if (!data?.me || !workspace.visible) return;
      const board = workspace.board, selection = workspace.projectSelection;
      const agents = data.agents.filter(row => row.role === 'agent' && row.id !== data.me &&
        `${row.display_name || row.display_label || row.id} ${row.id}`.toLowerCase().includes(query));
      const section = M.el('section', {class:'chat-model-family'}, M.el('h3', {}, 'Workspace agents'));
      for (const row of agents) section.append(M.el('button', {type:'button', class:'chat-model-choice',
        'data-picker-kind':'agent', 'data-agent-id':row.id, title:row.id, disabled:!!this.startPending, onclick:() => {
          if (this.chat.request || this.chat.loadingConversation || this.startPending || board !== workspace.board || selection !== workspace.projectSelection ||
              data !== workspace.navigationData || !workspace.visible) return;
          this.dialog.close(); M.go('board'); board.open({kind:'dm', a:data.me, b:row.id});
        }}, M.el('span', {}, row.display_name || row.display_label || row.id), M.el('small', {}, 'Agent · scoped direct message')));
      if (!agents.length) section.append(M.el('p', {class:'hint'}, query ? 'No workspace agents match your search.' : 'No agents available in this workspace.'));
      this.list.append(section);
    }
    selectIntent() { this.selectionEpoch++; this.choiceEpoch++; this.pendingHandoff = null; }
    requestHandoff(key, localOnly = true) {
      if (typeof key !== 'string' || !key) return;
      this.selectIntent();
      this.pendingHandoff = {key, localOnly, session:M.sessionContext(), choice:this.choiceEpoch,
        load:this.chat.loadEpoch, cid:this.chat.open, parameters:this.parameterEpoch, entered:false};
    }
    handoffCurrent(one) {
      return !!one && one === this.pendingHandoff && one.entered && one.route === this.selectionEpoch &&
        one.session === M.sessionContext() && one.choice === this.choiceEpoch && one.load === this.chat.loadEpoch &&
        one.cid === this.chat.open && one.parameters === this.parameterEpoch;
    }
    optionsFor(row) {
      const context = JSON.stringify([M.sessionContext(), this.chat.loadEpoch, this.chat.open]);
      if (context !== this.optionsContext) { this.startOptions.clear(); this.optionsContext = context; }
      if (!this.startOptions.has(row.installed.path)) this.startOptions.set(row.installed.path,
        new M.ModelStartOptions(row.installed, this.chat.outputTokens.value));
      const options = this.startOptions.get(row.installed.path);
      options.update(row.installed);
      return options;
    }
    currentStart(operation) {
      const chat = this.chat;
      return this.startPending === operation && this.selectionEpoch === operation.epoch && this.parameterEpoch === operation.parameters && M.sessionContext() === operation.session &&
        chat.loadEpoch === operation.load && chat.open === operation.cid && M.route === "chat" && location.hash === "#chat";
    }
    startInstalled(row) {
      const chat = this.chat, operation = {epoch:this.selectionEpoch, load:chat.loadEpoch, cid:chat.open, session:M.sessionContext(), parameters:this.parameterEpoch, options:this.optionsFor(row).snapshot()};
      this.startPending = operation;
      this.startMessage = `Starting ${row.name}…`;
      this.render();
      operation.promise = this.prepareInstalled(row, operation).finally(() => {
        if (this.startPending !== operation) return;
        if (!this.currentStart(operation)) this.startMessage = "";
        this.startPending = null;
        this.render();
      });
      return operation.promise;
    }
    async prepareInstalled(row, operation) {
      const chat = this.chat, path = row.installed.path;
      const current = () => this.currentStart(operation);
      try {
        const inventory = await M.api('/ui/models');
        if (!current() || M.refused(inventory)) return;
        if (!inventory.ok) throw Error(inventory.error || 'Could not read available models.');
        const selected = (inventory.library || []).find(model => model.path === path && model.servable === true && model.capabilities?.chat !== false);
        if (!selected) throw Error('This chat model is no longer available.');
        let started = null;
        if (!this.unconfirmed.has(path)) {
          this.unconfirmed.add(path);
          started = await M.api('/ui/serving', {method:'POST', body:JSON.stringify({path, context:operation.options.context})});
          if (!current()) return;
          if (M.refused(started)) return;
          if (!started.ok) throw Error(started.error || "Could not start this model.");
        }
        const available = await M.api('/ui/chat');
        if (!current() || M.refused(available)) return;
        if (!available.ok) throw Error(available.error || 'Could not confirm model readiness.');
        const matches = (available.models || []).filter(model => model.local === true && model.capabilities?.chat !== false &&
          (model.path === path || (!model.path && started?.models?.includes(model.model))) &&
          (!started || started.models?.includes(model.model)));
        if (matches.length !== 1) throw Error('Model readiness is not confirmed. Select it again to check; it will not be started twice.');
        this.unconfirmed.delete(path);
        chat.chatModels = available.models || [];
        this.library = inventory.library || [];
        chat.picker.replaceChildren(...chat.chatModels.map(model => M.el('option', {value:M.chatTargetKey(model)}, model.local ? model.model : `${model.model} — on ${model.member}`)));
        chat.outputTokens.value = operation.options.output;
        chat.picker.value = M.chatTargetKey(matches[0]);
        chat.picker.dispatchEvent(new Event('change'));
        chat.coding.render(M.chatTargetKey(matches[0]));
        this.startMessage = '';
        const actual = started?.slot_context ?? started?.context;
        chat.note.replaceChildren(M.el('p', {class:'hint', role:'status'},
          `Requested context: ${operation.options.context.toLocaleString()} tokens. ` +
          (Number.isSafeInteger(actual) ? `Running context: ${actual.toLocaleString()} tokens.` : 'Running context has not been reported.')));
        this.dialog.close();
      } catch (error) {
        if (current()) { this.startMessage = error.message; chat.showError(error.message); }
      }
    }
    async choose(row) {
      if (this.chat.request || this.chat.loadingConversation || row.disabled) return;
      if (this.startPending) return this.startPending.promise;
      this.selectIntent();
      if (row.needsLoad) {
        try { return this.startInstalled(row); }
        catch (error) { this.chat.showError(error.message); return; }
      }
      this.chat.picker.value = row.value;
      this.chat.picker.dispatchEvent(new Event("change"));
      this.dialog.close();
      this.render();
    }
  }
  window.ChatModelPicker = ChatModelPicker;
})();

(function () {
  const M = window.fleetModel;
  class ConversationsWorkspace {
    constructor(chat) {
      this.chat = chat;
      chat.search.placeholder = 'Search chats & channels';
      chat.search.setAttribute('aria-label', 'Search conversations and channels');
      chat.search.title = 'Search conversations, channels, direct messages, and workspace agents';
      chat.search.addEventListener('input', () => { if (this.navigationData) this.navigation(this.navigationData); });
      this.mobile = chat.querySelector('#conversation-mobile-nav');
      this.mobile.onclick = () => {
        const open = this.mobile.getAttribute('aria-expanded') !== 'true';
        this.mobile.setAttribute('aria-expanded', String(open));
        chat.box.dataset.sidebar = String(open);
      };
      this.project = chat.querySelector('#conversation-project');
      this.project.onchange = () => this.selectProject();
      chat.querySelector('#conversation-local-agents').ontoggle = event => {
        if (event.target.open && !this.localAgents) {
          this.localAgents = M.el('poolhouse-agents', {endpoint:'/ui/agents'});
          chat.querySelector('#conversation-agents').append(this.localAgents);
        }
      };
      this.team = chat.querySelector('#conversation-team');
      this.model = chat.querySelector('#conversation-model');
      this.channels = chat.querySelector('#conversation-channels');
      this.direct = chat.querySelector('#conversation-direct');
      this.directory = chat.querySelector('#conversation-directory');
      this.live = chat.querySelector('#conversation-models');

      chat.querySelector('#conversation-details').onclick = event => {
        chat.options.open = M.preferences.always_show_advanced || !chat.options.open;
        event.currentTarget.setAttribute('aria-expanded', String(chat.options.open));
      };
      chat.options.addEventListener('toggle', () => chat.querySelector('#conversation-details').setAttribute('aria-expanded', String(chat.options.open)));
      chat.querySelector("#conversation-choose-model").onclick = () => chat.modelPicker.button.click();
    }
    route(route) {
      this.active = route === 'board';
      this.visible = ['chat', 'board'].includes(route);
      this.board?.setActive?.(this.visible);
      if (!this.visible) {
        this.projectRequest = (this.projectRequest || 0) + 1;
        this.projectsLoaded = false;
      }
      this.mobile.setAttribute('aria-expanded', 'false');
      this.chat.box.dataset.sidebar = 'false';
      this.team.hidden = !this.active;
      this.model.hidden = this.active;
      if (this.navigationData) this.navigation(this.navigationData);
      if (['chat','board'].includes(route) && !this.projectsLoaded) { this.projectsLoaded = true; this.projects(); }
    }
    async projects() {
      const request = this.projectRequest = (this.projectRequest || 0) + 1;
      let result;
      try { result = await M.api('/ui/projects'); }
      catch { result = {ok:false, error:'Could not connect to the workspace. Reload to try again.'}; }
      if (request !== this.projectRequest || !this.visible || !['chat', 'board'].includes(M.route)) return;
      if (M.refused(result)) return;
      const projects = (result.ok ? result.workspaces || [] : []).filter(row =>
        /^[a-f0-9]{32}$/.test(row.id) && row.is_self === true);
      let saved = '';
      try { saved = localStorage.getItem('poolhouse.conversations.project') || ''; } catch {}
      if (!/^[a-f0-9]{32}$/.test(saved) && saved !== 'local') saved = '';
      if (saved !== 'local' && !projects.some(row => row.id === saved)) saved = '';
      this.projectRows = new Map(projects.map(row => [row.id, row]));
      this.project.replaceChildren(M.el('option', {value:''}, 'Choose a workspace'),
        ...projects.map(row => M.el('option', {value:row.id, disabled:row.available !== true},
          row.name + (row.available === true ? '' : ' · unavailable'))),
        ...(saved && saved !== 'local' && !this.projectRows.has(saved) ?
          [M.el('option', {value:saved, disabled:true}, 'Previously selected workspace · unavailable')] : []),
        M.el('option', {value:'local'}, 'Device-local Board'));
      const valid = saved ? projects.find(row => row.id === saved && row.available === true) :
        projects.find(row => row.available === true && row.preferred === true) || projects.find(row => row.available === true);
      if (saved === 'local') { this.project.value = 'local'; this.selectProject(); }
      else if (valid) { this.project.value = valid.id; this.selectProject(); }
      else if (saved) { this.project.value = saved; this.selectProject(); }
      else { this.project.value = ''; this.selectProject(); this.channels.replaceChildren(M.el('p', {class:'hint'}, result.error || 'Choose an available workspace to open its channels. Device-local messages are not shared with your pool.')); }
    }
    selectProject() {
      const id = this.project.value, selection = this.projectSelection = (this.projectSelection || 0) + 1;
      this.board?.remove();
      this.team.replaceChildren(); this.teamHeading = null;
      this.board = null;
      this.navigationData = null;
      this.direct.replaceChildren();
      this.directory.replaceChildren();
      this.scope();
      if (!id) { this.channels.textContent = 'Choose a workspace to see its channels.'; return; }
      if (id !== 'local' && this.projectRows?.get(id)?.available !== true) {
        this.team.replaceChildren();
        this.channels.textContent = 'This workspace is unavailable. Choose an available workspace to see its current activity.';
        return;
      }
      this.channels.textContent = 'Connecting to workspace…';
      const board = this.board = M.el('poolhouse-board', {endpoint:id === 'local' ? '/ui/board' : `/ui/projects/${id}/board`,
        'channel-feed':'', integrated:''});
      const current = () => board === this.board && selection === this.projectSelection && id === this.project.value;
      board.addEventListener('board-navigation', event => {
        if (!current()) return;
        if (event.detail.me || event.detail.error || event.detail.personSetupRequired) this.navigation(event.detail);
        board.setActive(this.visible);
      });
      board.addEventListener('poolhouse-board-open', () => { if (current()) M.go('board'); });
      this.teamHeading = M.el('header', {id:'conversation-team-heading', class:'conversation-team-heading'});
      this.team.replaceChildren(this.teamHeading, board);
      try { localStorage.setItem('poolhouse.conversations.project', id); } catch {}
    }
    navigation(data) {
      this.navigationData = data;
      this.scope(data);
      const board = this.board, selection = this.projectSelection;
      const button = (label, current, view, identity = '') => M.el('button', {title:identity,
        type:'button', 'aria-current':String(this.active && current), onclick:() => {
          if (this.chat.loadingConversation || board !== this.board || selection !== this.projectSelection || this.navigationData !== data || !this.visible) return;
          M.go('board'); board.open(view);
        }}, label);
      const query = this.chat.search.value.trim().toLowerCase();
      const matches = text => String(text).toLowerCase().includes(query);
      const matched = data.boards.filter(row => matches(row.name));
      const channels = matched.slice(0, M.LIST_MAX);
      this.channels.replaceChildren(...channels.map(row => button(
        `${row.name}${row.unread ? ` · ${row.unread}` : ''}`,
        [data.view.name, data.view.board].includes(row.name), {kind:'board', name:row.name})));
      if (data.personSetupRequired) this.channels.append(M.el('button', {type:'button', onclick:() => {
        M.go('board');
      }}, 'Join workspace as person'));
      if (matched.length > channels.length) this.channels.append(M.el('p', {class:'hint'}, `Showing ${channels.length} of ${matched.length}; search to narrow.`));
      if (data.boards.length && !channels.length) this.channels.append(M.el('p', {class:'hint'}, 'No channels match your search.'));
      if (!data.boards.length) this.channels.append(M.el('p', {class:'hint'}, data.error || 'No team channels in this workspace.'));
      const agents = new Map(data.agents.map(agent => [agent.id, agent.display_name || agent.display_label || agent.id]));
      const members = new Map();
      for (const row of data.dms) {
        const id = row.a === data.me ? row.b : row.a;
        const label = agents.get(id) || id;
        if (matches(`${label} ${id}`)) members.set(id, {id, label, unread:row.unread, view:{kind:'dm', a:row.a, b:row.b}});
      }
      if (data.view.kind === 'dm' && data.me && [data.view.a, data.view.b].includes(data.me)) {
        const id = data.view.a === data.me ? data.view.b : data.view.a;
        const label = agents.get(id) || id;
        if (!members.has(id) && matches(`${label} ${id}`)) members.set(id, {id, label, view:{kind:'dm', a:data.view.a, b:data.view.b}});
      }
      const shown = [...members.values()].slice(0, M.LIST_MAX);
      this.direct.replaceChildren(...shown.map(row => {
        const node = button(row.label, data.view.kind === 'dm' && [data.view.a,data.view.b].includes(row.id), row.view, row.id);
        if (row.unread) node.append(M.el('span', {'aria-label':`${row.unread} unread messages`}, ` · ${row.unread}`));
        return node;
      }));
      if (members.size > shown.length) this.direct.append(M.el('p', {class:'hint'}, `Showing ${shown.length} of ${members.size}; search to narrow.`));
      if (!members.size) this.direct.append(M.el('p', {class:'hint'}, query ? 'No direct messages match your search.' : 'No direct messages yet.'));
      this.agents(data, matches, button);
    }
    scope(data = null) {
      const id = this.project.value, local = id === 'local', row = this.projectRows?.get(id);
      const name = local ? 'Device-local board' : row?.name || 'Choose a workspace';
      const status = !id ? 'Workspace activity' : !local && row?.available !== true ? 'Workspace unavailable' :
        data?.personSetupRequired ? 'Workspace access needed' : data?.error ? 'Connection unavailable' :
        data?.me ? (local ? 'Only on this device' : 'Shared workspace') : 'Connecting to workspace…';
      this.chat.querySelector('#conversation-workspace-name').textContent = name;
      this.chat.querySelector('#conversation-workspace-status').textContent = status;
      this.chat.querySelector('#conversation-directory-label').textContent = local ? 'Device agents' : 'Workspace agents';
      if (this.teamHeading && data) {
        const view = data.view, recipient = view.kind === 'dm' ?
          (view.a === data.me ? view.b : view.a) : view.board || view.name || 'Channels';
        this.teamHeading.replaceChildren(M.el('strong', {}, name), M.el('span', {}, `${recipient} · ${status}`));
      }
    }
    agents(data, matches, button) {
      const focused = this.directory.contains(document.activeElement) ? document.activeElement.title : null;
      const available = data.me ? data.agents.filter(row => row.role === 'agent' && row.id !== data.me) : [];
      const found = available.filter(row => matches(`${row.display_name || row.display_label || row.id} ${row.id}`));
      const shown = found.slice(0, M.LIST_MAX);
      this.directory.replaceChildren(...shown.map(row => {
        const node = button(row.display_name || row.display_label || row.id, false,
          {kind:'dm', a:data.me, b:row.id}, row.id);
        node.setAttribute('aria-description', `Agent identity ${row.id}`);
        node.append(M.el('small', {}, 'Agent'));
        return node;
      }));
      if (focused) {
        const replacement = [...this.directory.querySelectorAll('button')].find(node => node.title === focused);
        if (replacement?.getClientRects().length) replacement.focus({preventScroll:true});
      }
      if (!shown.length) this.directory.append(M.el('p', {class:'hint'}, available.length ?
        'No agents match your search.' : data.error || 'No agents are available in this workspace.'));
      if (found.length > shown.length) this.directory.append(M.el('p', {class:'hint'}, `Showing ${shown.length} of ${found.length}; search to narrow.`));
    }
    models(rows) {
      this.live.replaceChildren(...rows.map(row => M.el('button', {type:'button', onclick:() => {
        if (this.chat.loadingConversation) return;
        if (M.route !== 'chat') { this.chat.modelPicker.requestHandoff(M.chatTargetKey(row), false); M.go('chat'); }
        else { this.chat.picker.value = M.chatTargetKey(row); this.chat.picker.dispatchEvent(new Event('change')); }
        this.chat.input.focus();
      }}, `● ${row.model}`)));
      if (!rows.length) this.live.append(M.el('p', {class:'hint'}, 'No models running. Choose a model to start Chat.'));
    }
  }
  window.ConversationsWorkspace = ConversationsWorkspace;
})();
</script>
