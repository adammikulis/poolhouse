<!-- sign-in: a founded pool's page is opened from this computer's own Poolhouse window, which hands it a one-use ticket -->
<template>
  <div class="centre" id="signin" hidden>
    <div class="card">
      <div class="hint">POOLHOUSE</div>
      <h1>Sign in</h1>
      <p class="sub">This pool was founded by a person, so its page opens from the Poolhouse window of a computer in it.
        On that computer run <code>poolhouse open</code>, or open the Poolhouse app.</p>
      <div id="signin-note" role="alert" aria-live="polite"></div>
    </div>
  </div>
</template>
<script>
(function () {
  const M = window.fleetModel;
  const el = M.el;

  class SignIn extends HTMLElement {
    connectedCallback() {
      if (this.wired) return;
      this.wired = true;
      this.box = this.querySelector("#signin");
      this.note = this.querySelector("#signin-note");
      M.onRoute((route) => {
        const on = route === "sign-in";
        this.box.hidden = !on;
        if (!on) return;
        this.note.replaceChildren(...M.kids(M.signInMessage
          ? el("div", { class: "err" }, M.signInMessage) : null));
      });
    }
  }
  customElements.define("sign-in", SignIn);
})();
</script>
