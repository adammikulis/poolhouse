# What enforces a sentence of agent guidance, and what was decided about it. Read by scripts/prose_to_code.py, which
# reports a link whose evidence has moved away as stale. `match` is words the sentence holds (any file); `id` is one
# sentence, added by `scripts/prose_to_code.py --link` or `--decide`. Evidence is `path::text found in that file now`.

[[link]]
match = "never force-push or delete remote refs by hand"
verdict = "partly"
evidence = ["scripts/hooks/claude-bash-guard::(PUSH_FLAGS,", "scripts/hooks/pre-push::the update is not a fast-forward",
            "scripts/dev-branch-rule::deletion and force push stay closed"]
note = "force, delete and tag pushes are refused; owner-only authorization for main and releases is not covered here"

[[link]]
match = "never push with force, delete a remote ref"
verdict = "enforced"
evidence = ["scripts/hooks/claude-bash-guard::(PUSH_FLAGS,", "scripts/hooks/pre-push::deletions are not development pushes"]

[[link]]
match = "never force push, push the development branch"
verdict = "partly"
