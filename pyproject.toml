[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poolhouse"
version = "0.3.0-dev.1"  # x-release-please-version
description = "Pool every device's compute. One pool, one board per project, agents and people on every device."
keywords = ["pool", "devices", "compute", "board", "agents", "llama.cpp", "local-llm", "distributed", "lan"]
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "a member" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
# poolhouse.installed reads the pins with Requirement, SpecifierSet and Version.
dependencies = [
    "cryptography>=50",
    "ladybug>=0.20.4,<0.21",
    "packaging>=24.2",
    "psutil>=7.2.2",
    "pywin32; sys_platform == 'win32'",
]

# Nothing below is needed to find the other machines and pass work between them.
# Each extra is what one part of poolhouse needs to do its own job.
[project.optional-dependencies]
gym-drone = ["PyFlyt==0.29.0; python_version < '3.13'", "pillow>=10; python_version < '3.13'"]
gym-driving = ["gymnasium>=1.0", "pillow>=10"]
gym-warehouse = ["rware>=2.0", "gymnasium>=1.0"]
gym-traffic = ["sumo-rl>=1.4.5", "eclipse-sumo>=1.24", "gymnasium>=1.0", "defusedxml>=0.7"]
gym-rl = ["stable-baselines3>=2.7", "gymnasium>=1.0"]
gym = ["poolhouse[gym-driving,gym-warehouse,gym-traffic,gym-rl]"]
privacy = ["presidio-analyzer>=2.2.364", "spacy>=3.8"]
# presidio over a transformers NER model rather than spaCy's own
privacy-transformers = ["poolhouse[privacy]", "presidio-analyzer[transformers]>=2.2.364"]
test = [
    "poolhouse[agents,memory,store,arrays,github-app,coordinator,train,torch,vision,pdf,gguf,fleet-onboard,hub,scrape]", "distlib", "pip", "build", "hatchling", "setuptools>=68", "pytest>=9.1.1",
    "pytest-xdist>=3.8.0", "pytest-timeout>=2.3", "pytest-testmon>=2.2", "pyyaml>=6.0", "defusedxml>=0.7",
]

# `poolhouse.harness` (`poolhouse-agent`): the SDK bundles the Claude Code binary it drives, about 170 MB
# per platform wheel. It is in `installed.STANDARD`, so every runtime and installer carries it.
claude = ["claude-agent-sdk>=0.2.152"]
arrays = ["numpy>=1.24"]
torch = ["torch>=2.14"]
transformers = ["transformers>=5.17"]
mlx = ["mlx>=0.32.2"]
# `poolhouse.memory`: the agent's facts are encrypted with AES-256-GCM under a key in the OS keystore
memory = ["cryptography>=50", "keyring>=24"]
# `poolhouse.spec`: tree speculative decoding over mlx-lm's hybrid models, which it drives
# through their own layer classes
spec = ["mlx>=0.32.2", "mlx-lm>=0.31.3", "mlx-vlm>=0.7.1", "numpy>=1.24", "huggingface_hub>=1.32"]
train = ["numpy>=1.24", "safetensors>=0.4"]
# what the scripts of the Strata engine's server and model preparation import (`poolhouse.serve.strata`)
serve-strata = ["numpy>=1.24", "jinja2>=3.1", "regex>=2024.11.6",
    # NVIDIA's CUDA 13 libraries the prebuilt Windows engine loads (built against 13.0; a later 13.x loads the same names)
    "nvidia-cublas>=13.0.2,<14; sys_platform == 'win32'", "nvidia-cuda-runtime>=13.0.96,<14; sys_platform == 'win32'"]
train-mlx = ["poolhouse[train,mlx]", "mlx-lm>=0.31.3", "huggingface_hub>=1.32"]
# a LoRA rather than a full fine-tune: two small matrices on each projection, the
# base frozen. What makes an 8B tool caller trainable on one machine, where a full
# fine-tune of it would need ~128G of optimizer state.
train-lora = ["poolhouse[train,torch,transformers]", "peft>=0.21.0"]
# `scripts/agent-identity`: the GitHub App agents sign in as, its key kept in the OS keystore
github-app = ["pyjwt[crypto]>=2.10", "cryptography>=50", "keyring>=24"]
# a daemon on the LAN makes its own TLS certificate with this (or with openssl on PATH)
fleet-tls = ["cryptography>=50"]
# verifying the signature on a release or a tracked commit (`poolhouse-pool` updates)
fleet-update = ["cryptography>=50"]
# Ed25519 signing from cryptography, the signing key in the OS keystore through `keyring`
fleet-onboard = ["cryptography>=50", "keyring>=24", "py-machineid"]
coordinator = ["py-machineid"]
# `poolhouse-speech`: faster-whisper transcribes, piper speaks. A piper voice is a
# model file and config file named by POOLHOUSE_PIPER_VOICE; `poolhouse-speech providers` says what
# each engine still wants
speech = ["poolhouse[asr]", "piper-tts>=1.8.0"]
# the parts installed alone, the first time something needs them (`poolhouse.provision`)
asr = ["faster-whisper>=1.2.1"]
ffmpeg = ["imageio-ffmpeg>=0.6,<1"]
heif = ["pillow-heif>=0.22"]
llama-build = ["cmake>=3.28"]
audio = ["poolhouse[speech,ffmpeg]", "torchaudio>=2.11"]
gguf = ["gguf>=0.10", "numpy>=1.24"]
graph = ["numpy>=1.24"]
# `poolhouse-decide`: the embed backend's head
decide = ["numpy>=1.24", "safetensors>=0.4"]
# the pointer backend runs a released checkpoint on torch; its libraries and pinned files are fetched the first time it
# is chosen by name (`backend="auto"` downloads nothing)
decide-pointer = ["poolhouse[decide]", "torch>=2.14", "transformers>=5.17", "peft>=0.21.0",
                  "huggingface_hub>=1.32"]
# an embedded property graph: one file on disk, native Cypher, no server.
# tests/test_graph_engine_contract.py is what a bump is measured against
store = ["ladybug>=0.20.4,<0.21"]
# a browser that remembers who you are; needs `playwright install chromium` too
scrape = ["playwright>=1.48"]
# searching the web beside the graph: ddgs is keyless and rate-limited, SearXNG is not
web = ["ddgs>=9", "trafilatura>=2"]
# poolhouse-models fetch and hub.located read and fill the Hub cache through this
hub = ["huggingface_hub>=1.32"]
vision = ["numpy>=1.24", "pillow>=10.0"]
# a book is a source like any other: `poolhouse.sources.pdf` reads one into sections through
# pdfminer.six (MIT), which gives text with the font it was set in -- how a heading is found in a
# PDF with no outline -- and the position of every picture; Pillow renders the pictures. The
# reading runs in a bounded child process (`poolhouse.net.pdfread`). Pages are rendered to PNG by
# PDFium (pypdfium2: Apache-2.0/BSD-3-Clause, one 3-4 MB wheel with no dependencies) in a second
# bounded child (`poolhouse.net.pdfrender`); `pdf-render` is that part alone, and `pdf` includes it.
pdf-render = ["pypdfium2>=4.30", "pillow>=10.0"]
pdf = ["pdfminer.six>=20251230", "pillow>=10.0", "poolhouse[pdf-render]"]
# MuPDF is AGPL-3.0 (or Artifex's commercial licence): a network service built on it must offer
# its source. It is NOT in `pdf`, `all` or `redteam`; install it only on purpose, and select it
# with POOLHOUSE_PDF_ENGINE=pymupdf. Only the datasheet pin tables need it now: page pictures and
# outline pages work with the permissive `pdf` extra.
pdf-agpl = ["pymupdf>=1.24"]
# `python -m poolhouse.bench animate`: a comparison of builds as an animated graphic
viz = ["manim>=0.19"]
# `poolhouse-serve fit --plot` draws two panels to a png/svg. Only this needs it: the bench's
# own --plot writes hand-built SVG with no library, so it opens on a machine with no packages
plot = ["matplotlib>=3.11.2"]
testing = ["distlib", "numpy>=1.24", "pytest>=9.1.1"]
telemetry = ["metal-smi>=1.1.0; sys_platform == 'darwin'"]
# `poolhouse-mcp` speaks the protocol itself over stdio; with the SDK installed it uses that.
# `poolhouse.agent.McpTools` is an MCP client on the same SDK (2026-07-28 revision).
mcp = ["mcp>=2.3,<3"]
# NVIDIA NeMo Guardrails as one more rail over the built-in ones (`poolhouse.guard.nemo`); its
# rails call the llama.cpp server a configuration names. The built-in rails need no extra.
# nemoguardrails ships no release for Python 3.14 or later (Requires-Python <3.14), so the
# extra is empty there and the NeMo rail reports itself unavailable.
guardrails = ["nemoguardrails>=0.24.1,<0.25; python_version < '3.14'"]
# a prompt-injection classifier run on the CPU through onnxruntime (`poolhouse.guard.classifier`);
# the ONNX export of protectai/deberta-v3-base-prompt-injection-v2 is fetched once
guard-model = ["onnxruntime>=1.20", "tokenizers>=0.21", "numpy>=1.24", "huggingface_hub>=1.32"]
# `python -m poolhouse.bench standard`: GSM8K, MMLU-Pro, IFEval and HumanEval through lm-evaluation-harness;
# `ifeval` brings langdetect, immutabledict and nltk
standard = ["lm-eval[ifeval]>=0.4"]
# `python -m poolhouse.redteam`: attacks on this library's own model-facing surfaces, sent through
# PyRIT: about 110 packages and 550 MB, installed in a virtualenv of its own.
redteam = ["poolhouse[web,pdf,testing]", "pyrit>=1.1,<2"]
agents = ["openai-agents>=0.24,<0.27", "openai>=3,<4", "httpx2>=2.12,<3"]
pi = ["nodejs-wheel==24.19.0"]
all = [
    "poolhouse[agents,train,gguf,graph,store,scrape,vision,pdf,testing,telemetry,plot,fleet-tls,fleet-update,fleet-onboard]",
]
wsl-dev = [
    "poolhouse[all,test,arrays,audio,claude,coordinator,decide,decide-pointer,gym-drone,guardrails,guard-model,gym,hub,mcp,memory,privacy,redteam,standard,train-lora,web]",
]

[project.urls]
Homepage = "https://github.com/adammikulis/poolhouse"
Repository = "https://github.com/adammikulis/poolhouse"
Documentation = "https://github.com/adammikulis/poolhouse/blob/main/docs/api.md"
Issues = "https://github.com/adammikulis/poolhouse/issues"
Changelog = "https://github.com/adammikulis/poolhouse/blob/main/CHANGELOG.md"

[project.scripts]
# `poolhouse <command>` is the one front door: it runs any command in `poolhouse.cli.registry`
# (this table, plus `ROUTED` there), and bare it starts the daemon and opens the browser on it
# (`poolhouse.fleet.launch`). A command is installed as `poolhouse-<command>` below only where
# something invokes it by that name, which is what each group of comments says. Every other
# command is `ROUTED` in the registry and is typed `poolhouse <command>` (`test`, `open`, `help`,
# `device`, `device-setup`, `features`, `credentials`, `local-network`, `runtime`).
# tests/test_cli_umbrella.py holds the two tables apart.
poolhouse = "poolhouse.cli:main"

# named by the installers (packaging/install.sh, install.ps1), the login unit and the launchers
# `poolhouse runtime ensure` writes
poolhouse-traind = "poolhouse.cli.daemon:main"
poolhouse-pool = "poolhouse.pool_cli:main"
poolhouse-serve = "poolhouse.serve.cli:main"
poolhouse-models = "poolhouse.serve.models_cli:run"
poolhouse-setup = "poolhouse.setup:main"
poolhouse-doctor = "poolhouse.doctor:main"
# the same functions the commands call, as MCP tools over stdio, for an agent to drive:
# `claude mcp add poolhouse -- poolhouse-mcp`
poolhouse-mcp = "poolhouse.mcp:main"

# agents: the hooks, the node's own messages and the agent files name these
# agents coordinating: messages, notes, scratch folders and claims, all data and no authority
poolhouse-workspace = "poolhouse.workspace.cli:main"
# a served model as a coding harness; scripts/review-backlog launches poolhouse-claude by name
poolhouse-claude = "poolhouse.claude:main"
poolhouse-codex = "poolhouse.codex:launch"
poolhouse-opencode = "poolhouse.opencode:launch"
# one agentic task on the same lease; the workspace names its local harness `poolhouse-agent`
poolhouse-agent = "poolhouse.harness:main"
# a lead session hands a task to a local agent on that lease, which can message the lead; `start`, `status`, `result`, `stop`
poolhouse-delegate = "poolhouse.delegate:main"
# a conversation with a served model that operates poolhouse, asking before it changes anything;
# the chat policy recognises the commands it may run by these names
poolhouse-chat = "poolhouse.chat:main"
poolhouse-security = "poolhouse.net.cli:command"
# what the chat agent remembers across sessions: list, add, forget, export
poolhouse-memory = "poolhouse.memory.cli:main"
# how every source (host, URL, member, repository, hash) has behaved: list, show, forget, export
poolhouse-reputation = "poolhouse.reputation.cli:main"
# the activity log: what agents, people and the stack did, read-only
poolhouse-log = "poolhouse.activity.cli:main"

# named in the messages and hints these commands print, and in the docs a person follows
# choose one of a named set of options and say how sure: ask, score, calibrate, compare
poolhouse-decide = "poolhouse.decide_cli:main"
# what this machine can hear and say: transcribe a file, say a line, find the speech in it
poolhouse-speech = "poolhouse.speech.cli:main"
poolhouse-store = "poolhouse.graph.store_cli:main"
# a rendered graph page served on loopback, with the model behind it
poolhouse-graph = "poolhouse.graph.serve:main"
# the long commands this machine has recorded: what is running, waiting on one, stopping it
poolhouse-jobs = "poolhouse.jobs:main"
# every tracked file read for a person's details, reported and never blocked
poolhouse-audit = "poolhouse.redact.audit:main"

[tool.hatch.build.targets.sdist]
exclude = [".claude", "CLAUDE.md", "HANDOFF.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/poolhouse"]
exclude = [
    "src/poolhouse/backend",
    "src/poolhouse/bench",
    "src/poolhouse/datasheet",
    "src/poolhouse/draft",
    "src/poolhouse/gym",
    "src/poolhouse/fleet/gym_*.py",
    "src/poolhouse/fleet/train_*.py",
    "src/poolhouse/fleet/web/components/benchmarks-view.html",
    "src/poolhouse/fleet/web/components/fleet-benchmark.html",
    "src/poolhouse/fleet/web/components/gym-*.html",
    "src/poolhouse/fleet/web/components/training-view.html",
    "src/poolhouse/gguf",
    "src/poolhouse/graph/absorbing.py",
    "src/poolhouse/graph/answers.py",
    "src/poolhouse/graph/community.py",
    "src/poolhouse/graph/conversation.py",
    "src/poolhouse/graph/dag.py",
    "src/poolhouse/graph/data.py",
    "src/poolhouse/graph/grammar.py",
    "src/poolhouse/graph/hygiene.py",
    "src/poolhouse/graph/judging.py",
    "src/poolhouse/graph/looking.py",
    "src/poolhouse/graph/merging.py",
    "src/poolhouse/graph/message.py",
    "src/poolhouse/graph/names.py",
    "src/poolhouse/graph/prompts.py",
    "src/poolhouse/graph/relations.py",
    "src/poolhouse/graph/replies.py",
    "src/poolhouse/graph/route.py",
    "src/poolhouse/graph/smoothing.py",
    "src/poolhouse/graph/tensors.py",
    "src/poolhouse/graph/tidy.py",
    "src/poolhouse/graph/tree.py",
    "src/poolhouse/graph/verdicts.py",
    "src/poolhouse/ingest",
    "src/poolhouse/redteam",
    "src/poolhouse/scrape",
    "src/poolhouse/sources",
    "src/poolhouse/surface",
    "src/poolhouse/testing",
    "src/poolhouse/train",
    "src/poolhouse/vision",
    "src/poolhouse/walk",
    "src/poolhouse/web.py",
    "src/poolhouse/world",
]

# The contracts are ONE file on disk (repo-root `contracts/`), pulled into the wheel at
# build time. No copy is kept in the source tree, so there is nothing to drift.
[tool.hatch.build.targets.wheel.force-include]
"contracts" = "poolhouse/contracts/_data"
"patches" = "poolhouse/serve/_patches"

[tool.pytest.ini_options]
testpaths = ["tests"]
# how many workers is the broker's to say, so several suites at once do not each take every
# core (`tests/conftest.py`); `-n` on the command line is meant and is left alone, and `-n 0`
# runs them in one process when a failure needs a clean order
addopts = "--strict-markers"
# a test that runs past this many seconds fails and is named; one that needs longer carries
# `@pytest.mark.timeout(N)`
timeout = 120
# `slow` is a browser, a subprocess, a wheel build or a real network wait -- anything that
# costs more than about two seconds every time it runs, rather than once per worker.
# `-m "not slow"` is the subset to run while a bench has the GPU; the default runs everything.
markers = [
    "slow: needs a browser, a subprocess, a wheel build or a network timeout; left out unless --slow is given",
    "redteam: needs the redteam extra (PyRIT); left out unless --redteam is given",
    "real_model: loads a real model on a real llama-server (tests/real_model.py); left out unless --real-model is given, and fails, never skips, where the model or the binary is missing",
    "needs: needs an optional package (tests/extras.py); each such test is skipped, and counted as skipped, where it is not installed",
    "live_api: calls a paid or quota-limited remote API; runs only when POOLHOUSE_LIVE_API=1",
    "live_net: reaches a public endpoint; runs only when POOLHOUSE_LIVE_NET=1",
    "lan_network: binds a non-loopback address, joins multicast or sends to the LAN; runs only when POOLHOUSE_LAN_TESTS=1",
    "seatbelt: runs sandbox-exec itself, so it cannot run under the real-state write denial; listed in tests/seatbelt-modules.txt",
    "gate: a scan of the whole tracked tree, the same one `scripts/test gate` makes; left out of fast and full unless --gate or --slow is given",
    "heavy: runs in the default tier and costs seconds a test; `scripts/test fast` leaves it out",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# python with no .py on it: ruff matches by extension unless the name is spelled out
extend-include = ["scripts/agent-identity", "scripts/budgets", "scripts/release-key", "scripts/hooks/budgets",
                  "scripts/hooks/claude-bash-guard", "scripts/hooks/claude-edit-guard"]

[tool.ruff.lint]
select = [
    "B",       # bugbear
    "BLE",     # blind except
    "C4",      # comprehensions
    "E4", "E7", "E9",  # pycodestyle, ruff's own default
    "ERA",     # commented-out code
    "F",       # pyflakes, ruff's own default
    "I",       # import sorting
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PTH",     # os.path where pathlib reads better
    "RUF",     # ruff's own, including RUF100 for a noqa that suppresses nothing
    # T20 is scripts/gates/print_calls.py, which exempts the console-script modules
    "S",       # bandit
    "SIM",     # simplifications
    "UP",      # syntax the minimum Python already has
]
# S603 and S607 fire on every subprocess call and every argv[0] without a full path.
ignore = ["S603", "S607"]

[tool.ruff.lint.isort]
# The pre-commit gate lints only staged files in a temporary tree. Declare our package
# and test helpers explicitly so missing unstaged modules cannot change import grouping.
known-first-party = ["poolhouse", "tests", "examples"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is what a test is written in
    "S105",  # invented credentials in fixtures
    "S106",
    "S107",
    "S108",  # /tmp paths in fixtures
    "S311",  # a seeded generator makes a fixture repeat
]
"src/poolhouse/decide/guards/*.py" = [
    "S104",  # the benchmark's tool calls are the dangerous strings it labels
    "S108",
]
"scripts/hooks/**" = [
    "BLE001",  # a guard that fails must let the command through, not block on its own error
]

# Checks that read the source alone. A check that reads a type out of an installed package
# counts differently on every machine.
[tool.pyright]
include = ["src/poolhouse"]
executionEnvironments = [
    { root = "tests", extraPaths = ["src", "tests", "scripts", "scripts/hooks"] },
    { root = ".", extraPaths = ["src", "scripts", "scripts/hooks"] },
]
typeCheckingMode = "off"
reportAssertAlwaysTrue = "error"
reportInvalidStringEscapeSequence = "error"
reportNoOverloadImplementation = "error"
reportSelfClsParameterName = "error"
reportUnboundVariable = "error"
reportUndefinedVariable = "error"
reportUnsupportedDunderAll = "error"
reportUnusedCoroutine = "error"
reportUnusedExcept = "error"

[project.entry-points."poolhouse.ui_routes"]
agents = "poolhouse.workspace.agent_routes:route"
tasks = "poolhouse.workspace.task_routes:route"
board = "poolhouse.workspace.fleet_routes:route"
coding = "poolhouse.workspace.coding_routes:route"
history = "poolhouse.activity.fleet_routes:route"
work-reputation = "poolhouse.workspace.work_reputation:fleet_route"
