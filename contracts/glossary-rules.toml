# How scripts/nomenclature.py rewrites a tree to docs/glossary.md. Data only; the script reads it.
# Words are cut at underscores and camelCase boundaries before they are looked up here.

# a revoke part is a removal when one of these is within three parts of it (revoked_device, member_revoke)
revoke_near = ["device", "devices", "member", "members", "machine", "machines", "pool", "pools"]

[family]
revoke = ["revoke", "revokes", "revoked", "revoking"]
pair = ["pair", "pairs", "paired", "pairing", "pairings", "unpaired", "unpair"]
cluster = ["cluster", "clusters", "clustered"]
journal = ["journal", "journals", "journaled", "journaling"]
mesh = ["mesh", "meshes"]
peer = ["peer", "peers"]
seat = ["seat", "seats"]

[stems]
revoke = "remove"
revokes = "removes"
revoked = "removed"
revoking = "removing"
pair = "join"
pairs = "joins"
paired = "joined"
pairing = "joining"
pairings = "joins"
unpaired = "unjoined"
unpair = "remove"
