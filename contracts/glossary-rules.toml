[[phrase]]
family = "board-kind"
pattern = '\bproject boards\b'
new = 'boards'

[[phrase]]
family = "board-kind"
pattern = '\bproject board\b'
new = 'board'

[[phrase]]
family = "revoke"
pattern = '\brevoke\b(?=[ `]{1,3}(?:(?:a|an|the|this|that|every|one|another|any|each|its|their|your|his|her|stolen|lost|compromised|old) ){0,2}(?:device|member|machine|pool|laptop)s?\b)'
new = 'remove'

[[phrase]]
family = "revoke"
pattern = '\brevokes\b(?=[ `]{1,3}(?:(?:a|an|the|this|that|every|one|another|any|each|its|their|your|his|her|stolen|lost|compromised|old) ){0,2}(?:device|member|machine|pool|laptop)s?\b)'
new = 'removes'

[[phrase]]
family = "revoke"
pattern = '\brevoked\b(?=[ `]{1,3}(?:(?:a|an|the|this|that|every|one|another|any|each|its|their|your|his|her|stolen|lost|compromised|old) ){0,2}(?:device|member|machine|pool|laptop)s?\b)'
new = 'removed'

[[phrase]]
family = "revoke"
pattern = '\brevoking\b(?=[ `]{1,3}(?:(?:a|an|the|this|that|every|one|another|any|each|its|their|your|his|her|stolen|lost|compromised|old) ){0,2}(?:device|member|machine|pool|laptop)s?\b)'
new = 'removing'

[[phrase]]
family = "revoke"
pattern = '\b((?:device|member|machine)s? (?:is |was |are |were |gets? |got )?)revoked\b'
new = '\1removed'

[[phrase]]
family = "pair"
pattern = '\bpaired[ -](?:device|machine|peer|member|host|box)(s?)\b'
new = 'member\1'

[[phrase]]
family = "pair"
pattern = '\ban unpaired\b'
new = 'a non-member'
kinds = ["markdown", "html"]

[[phrase]]
family = "pair"
pattern = '\bunpaired\b'
new = 'non-member'
kinds = ["markdown", "html"]

[[phrase]]
family = "pair"
pattern = '\bpairing (codes?)\b'
new = 'join \1'

[[phrase]]
family = "pair"
pattern = '\b(a|the|another|each|every|one|this|that|first|whole|new) pairing\b'
new = '\1 join'

[[phrase]]
family = "pair"
pattern = '\bpair with\b'
new = 'join'

[[phrase]]
family = "pair"
pattern = '\bpairs with\b'
new = 'joins'

[[phrase]]
family = "pair"
pattern = '\bto pair\b'
new = 'to join'

# Phrases the scan refuses although each word alone is ordinary. `family` is the name an allowlist entry uses.

[[gate]]
family = "board-kind"
pattern = '\bhost(?:ed)?[ _-]boards?\b'
say = "a board is the same on every member that holds it; there is no host board"

[[gate]]
family = "board-kind"
pattern = '\bremote[ _-]boards?\b'
say = "a board is the same on every member that holds it; there is no remote board"

[[gate]]
family = "board-kind"
pattern = '(?:\bproject[ _-]boards?\b|ProjectBoard)'
say = "every board belongs to a project; say board"

[[gate]]
family = "home-pool"
pattern = '\b(?:home|dev|prod|development|production)[ _-](?:pool|cluster)s?\b'
say = "there is one kind of pool; dev and prod are modes of admission, not kinds of pool"

[[gate]]
family = "revoke"
pattern = '\brevok(?:e|es|ed|ing)\b[ \w`]{0,12}\b(?:device|member|machine|pool|laptop)s?\b'
say = "remove a member; revoke only a key, token or grant"

[[gate]]
family = "revoke"
pattern = '\b(?:device|member|machine)s? (?:is |was |are |were |gets? |got )?revoked\b'
say = "remove a member; revoke only a key, token or grant"

[[gate]]
family = "update"
pattern = '\bactivat(?:e|es|ed|ing|ion)\b[ \w`"-]{0,24}\b(?:a fix|the fix|a change|the change|a runtime|the runtime|the build|a build|owner|steps|handoffs?)\b'
say = "moving the installed build or runtime to a newer one is an update: updating, updated, update owner"

[[gate]]
family = "update"
pattern = '\b(?:landed|published|installed-runtime|installing or|changing or)[ ,\w-]{0,24}\bactivat(?:e|es|ed|ing|ion)\b'
say = "moving the installed build or runtime to a newer one is an update: updating, updated, update owner"
