# Where a banned word of docs/glossary.md may stay, each entry with its reason. The vocabulary test
# (tests/test_glossary.py) and scripts/nomenclature.py both read this file and nothing else.
#
# [[exclude]]  a whole file is outside the vocabulary: history, a vendored or third-party file, or a
#              file that has to quote the banned words to define or check them
# [[allow]]    one family of word may stay in the files a pattern names: it means something else there
# [[token]]    one exact word is another library's name and stays everywhere

[[exclude]]
path = "CHANGELOG.md"
reason = "release notes keep the names a release had"

[[exclude]]
path = "docs/glossary.md"
reason = "defines the banned words"

[[exclude]]
path = "contracts/glossary-*.toml"
reason = "the rules and this list name the banned words"

[[exclude]]
path = "scripts/nomenclature.py"
reason = "the rewrite quotes banned words in its examples"

[[exclude]]
path = "scripts/gates/glossary_words.py"
reason = "the gate's own description names the banned words"

[[exclude]]
path = "tests/test_glossary.py"
reason = "the check quotes banned words to prove it finds them"

[[exclude]]
path = "HANDOFF.md"
reason = "dated notes between agents, a record of what was true when written"

[[exclude]]
path = "docs/notes/*"
reason = "dated notes, a record of what was true when written"

[[exclude]]
path = "docs/*REPORT*.md"
reason = "dated report, a record of what was true when written"

[[exclude]]
path = "docs/codex-code-report.md"
reason = "dated report, a record of what was true when written"

[[exclude]]
path = "docs/report-2026-09-23.md"
reason = "dated report, a record of what was true when written"

[[exclude]]
path = "docs/redteam/baseline-*"
reason = "dated measurement, a record of what was true when taken"

[[exclude]]
path = "docs/experiments/*"
reason = "dated measurements with the command that produced them"

[[exclude]]
path = "docs/poolhouse-refactor-plan.md"
reason = "the rename plan names the words it retires"

[[exclude]]
path = "patches/*"
reason = "patches against third-party llama.cpp"

[[exclude]]
path = "THIRD_PARTY_NOTICES.md"
reason = "third-party licence text"

[[exclude]]
path = "NOTICE"
reason = "third-party licence text"

[[exclude]]
path = "src/poolhouse/ui/assets/*"
reason = "vendored three.js, DOMPurify and their relatives"

[[exclude]]
path = "examples/rbmk/room/vendor/*"
reason = "vendored three.js loaders and utilities, kept as their authors wrote them"

[[exclude]]
path = "*.lock"
reason = "lock files name third-party packages"

[[exclude]]
path = "docs/images/*"
reason = "images"

