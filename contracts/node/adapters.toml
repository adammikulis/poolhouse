version = 3
trait = "NativeCallerPlatform"
binding = "node-owned-runtime-handle"
serialization = "forbidden"
spawn_plan = "node-owned-immutable-measured-plan"
visibility = "crate-private-sealed"
status = "incomplete-proposal"
errors = ["InvalidInstallation", "MissingChannel", "WrongPrincipal", "StaleProcess", "UnprotectedProcess", "ConfinementUnavailable", "BindingMismatch", "Cancelled", "Io"]
requirements = ["actual-principal-and-process-lifetime", "authenticate-retained-producer-launch-and-process", "caller-binds-running-process-and-node-binding", "cleanup-is-not-domain-completion", "crate-private-sealed-platform-and-runtime-parameters", "durable-consumption-fence-before-effect", "durable-source-disposition-and-custody-fence-before-right", "exact-associated-type-projection-graph", "explicit-handle-ownership-and-inheritance", "fixed-nominal-held-and-running-phases", "held-drop-kills-and-reaps", "hold-binds-node-binding-and-plan", "immutable-arguments-environment-directory-and-confinement", "missing-or-rolled-back-occurrence-ledger-refuses-prior-source", "native-source-view-has-no-node-issued-session-keys", "no-caller-selected-authority", "no-production-proof-issuer-or-bridge", "no-serde-or-public-constructors", "no-unsupported-platform-fallback", "node-validates-caller-observations", "opaque-birth-resume-invocation-message", "owned-failures-retain-unresolved-custody", "phase-specific-single-use-cleanup-obligations", "plan-binds-invocation-and-generation", "release-binding-matches-held-plan", "release-consumes-hold-once", "retain-measured-executable-and-assets", "revoke-node-authorization-before-terminal-cleanup", "same-owner-shared-retention-without-duplicating-custody", "separate-sealed-domain-effect-owner", "single-reader-retained-channel-owner", "source-occurrence-namespace-independent-of-node-boot-and-admission", "terminate-without-pid-reuse", "unique-phase-obligation-and-full-resource-accounting", "unknown-effect-retains-permit-operation-and-owner", "unresolved-profiles-block-runtime-validation"]

[[method]]
name = "verify_installation"
arguments = []
result = "VerifiedInstallation"
failure = "NativeAdapterError"

[[method]]
name = "verify_bootstrap"
arguments = [{name = "installation", type = "VerifiedInstallation", ownership = "borrow"}]
result = "VerifiedBootstrap"
failure = "NativeAdapterError"

[[method]]
name = "authenticate_producer"
arguments = [{name = "channel", type = "RawChannel", ownership = "move"}, {name = "installation", type = "VerifiedInstallation", ownership = "borrow"}, {name = "launch", type = "VerifiedProducerLaunch", ownership = "borrow"}]
result = "AdmittedProducer"
failure = "OwnedChannelFailure"

[[method]]
name = "receive_producer_message"
arguments = [{name = "producer", type = "AdmittedProducer", ownership = "borrow"}]
result = "AuthenticatedProducerMessage"
failure = "OwnedChannelFailure"

[[method]]
name = "hold_spawn"
arguments = [{name = "producer", type = "AdmittedProducer", ownership = "borrow"}, {name = "bootstrap", type = "VerifiedBootstrap", ownership = "borrow"}, {name = "binding", type = "Binding", ownership = "borrow"}, {name = "plan", type = "SpawnPlan", ownership = "borrow"}]
result = "HeldProcess"
failure = "OwnedSpawnFailure"

[[method]]
name = "observe_held"
arguments = [{name = "held", type = "HeldProcess", ownership = "borrow"}]
result = "ProcessObservation"
failure = "NativeAdapterError"

[[method]]
name = "release"
arguments = [{name = "held", type = "HeldProcess", ownership = "move"}, {name = "binding", type = "Binding", ownership = "borrow"}]
result = "RunningProcess"
failure = "OwnedReleaseFailure"

[[method]]
name = "inspect_caller"
arguments = [{name = "channel", type = "RawChannel", ownership = "move"}, {name = "installation", type = "VerifiedInstallation", ownership = "borrow"}, {name = "running", type = "RunningProcess", ownership = "borrow"}, {name = "binding", type = "Binding", ownership = "borrow"}]
result = "AuthenticatedCaller"
failure = "OwnedChannelFailure"

[[method]]
name = "caller_observation"
arguments = [{name = "caller", type = "AuthenticatedCaller", ownership = "borrow"}]
result = "ProcessObservation"
failure = "NativeAdapterError"

[[method]]
name = "is_live"
arguments = [{name = "running", type = "RunningProcess", ownership = "borrow"}]
result = "bool"
failure = "NativeAdapterError"

[[method]]
name = "cleanup_before_consume"
arguments = [{name = "running", type = "RunningProcess", ownership = "borrow"}, {name = "obligation", type = "BeforeConsumeObligation", ownership = "move"}]
result = "HolderCleanup"
failure = "OwnedCleanupFailure"

[[method]]
name = "cancel_hold"
arguments = [{name = "held", type = "HeldProcess", ownership = "move"}, {name = "revoked", type = "RevokedAuthorization", ownership = "move"}, {name = "obligation", type = "TerminalCleanupObligation", ownership = "move"}]
result = "HolderCleanup"
failure = "OwnedCleanupFailure"

[[method]]
name = "terminate"
arguments = [{name = "running", type = "RunningProcess", ownership = "move"}, {name = "revoked", type = "RevokedAuthorization", ownership = "move"}, {name = "obligation", type = "TerminalCleanupObligation", ownership = "move"}]
result = "HolderCleanup"
failure = "OwnedCleanupFailure"

[installation_graph]
name = "NativeInstallationGraph"
seal = "InstallationGraph"
associated = [{name = "Installation", projection = "InstallationProjection", role = "VerifiedInstallation"}, {name = "Process", projection = "ProcessProjection", role = "Process"}, {name = "Channel", projection = "ChannelProjection", role = "Channel"}, {name = "RawChannel", projection = "RawChannelProjection", role = "RawChannel"}, {name = "MeasuredAsset", projection = "MeasuredAssetProjection", role = "MeasuredAsset"}, {name = "Holder", projection = "HolderProjection", role = "Holder"}]

[graph]
name = "NativeGraph"
seal = "Graph"
inherits = "NativeInstallationGraph"
associated = [{name = "Launch", projection = "LaunchProjection", role = "VerifiedProducerLaunch"}, {name = "LaunchPlan", projection = "ProducerLaunchPlanProjection", role = "ProducerLaunchPlan"}, {name = "Producer", projection = "ProducerProjection", role = "AdmittedProducer"}, {name = "Message", projection = "ProducerMessageProjection", role = "AuthenticatedProducerMessage"}, {name = "Bootstrap", projection = "BootstrapProjection", role = "VerifiedBootstrap"}, {name = "Binding", projection = "BindingProjection", role = "Binding"}, {name = "Plan", projection = "PlanProjection", role = "SpawnPlan"}, {name = "ChildCustody", projection = "ChildProjection", role = "ChildCustody"}, {name = "Caller", projection = "CallerProjection", role = "AuthenticatedCaller"}, {name = "CallerMessage", projection = "CallerMessageProjection", role = "CallerMessage"}, {name = "BeforeConsume", projection = "BeforeConsumeProjection", role = "BeforeConsumeObligation"}, {name = "Revoked", projection = "RevokedProjection", role = "RevokedAuthorization"}, {name = "Terminal", projection = "TerminalProjection", role = "TerminalCleanupObligation"}, {name = "Cleanup", projection = "CleanupProjection", role = "HolderCleanup"}, {name = "ChannelFailure", projection = "ChannelFailureProjection", role = "OwnedChannelFailure"}, {name = "SpawnFailure", projection = "SpawnFailureProjection", role = "OwnedSpawnFailure"}, {name = "ReleaseFailure", projection = "ReleaseFailureProjection", role = "OwnedReleaseFailure"}, {name = "CleanupFailure", projection = "CleanupFailureProjection", role = "OwnedCleanupFailure"}]

[effect_owner]
