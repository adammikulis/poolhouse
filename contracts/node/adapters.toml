seal = "Graph"
trait = "NodeEffectOwner"
owner_seal = "Owner"
identity = {name = "identity", result = "Owner", ownership = "borrow", optional = false}
associated = [{name = "Owner", projection = "EffectOwnerProjection"}, {name = "Permit", projection = "PermitProjection"}, {name = "Operation", projection = "BoundOperationProjection"}, {name = "Completion", projection = "CompletionProjection"}, {name = "Unknown", projection = "UnknownEffectProjection"}]
method = {name = "execute", receiver = "mutable", arguments = [{name = "permit", type = "Permit", ownership = "move"}, {name = "operation", type = "Operation", ownership = "move"}], result = "Completion", failure = "Unknown"}

