# Mathematical data and signature inputs only; no issuer or native acceptance.
version = 1
status = "reference-only"
encoding = "tagged-wire-tree-be32-v1"
signature_input = "reference-raw-transcript-v1"
signature_issuer = "unresolved"

# T is the validated full domain-separated transcript; H is SHA256(T).
# Ed25519 is pure Ed25519(T), never Ed25519ph or Ed25519(H).
# P256 message APIs consume T; digest APIs consume H exactly once, never H
# through a message API. Only strict DER with low S is supported here.
[[signature_algorithm]]
name = "ed25519"
message_api = "transcript-bytes"
digest_api = "unsupported"
format = "raw-64"

[[signature_algorithm]]
name = "p256_sha256_low_s_der"
message_api = "transcript-bytes"
digest_api = "sha256-transcript-bytes"
format = "strict-der-low-s"

# Wire values: N null; F/T boolean; S BE32 UTF8-byte-length + exact UTF8;
# A BE32 item-count + ordered values; O BE32 field-count + ASCII-sorted
# framed key/value entries. No normalization, numbers or omitted optional fields.
# Hash input is exact domain (including NUL) + framed root, excluding ONLY
# the named root selfdigest. A nested approval digest is retained and checked.

[[profile]]
name = "approval-immutable-v1"
root = "ApprovalImmutableOperation"
omit_root_field = "digest"
domain = "poolhouse.approval.immutable-operation.v1\u0000"
schema_sha256 = "bd1ebfdcbc9cd023e62f1625b6837caabfecf7f38caba0f72eaad7f2fe9c6d4c"

[[profile]]
name = "local-authority-scoped-v1"
root = "LocalAuthorityScopedOperation"
omit_root_field = "transcript_digest"
domain = "poolhouse.local-authority.scoped-operation.v1\u0000"
schema_sha256 = "f8ab6d987cd586b1cad33b75260821d591bbaa634eed0d57e92cf9c08faf40a7"

[[profile]]
name = "authority-descriptor-v1"
root = "AuthorityDescriptorBody"
omit_root_field = "descriptor_id"
domain = "poolhouse.authority.descriptor.v1\u0000"
schema_sha256 = "7639170ac70f6bf48205dc276df97e1264fc98a18f8055dfb37eeedf2d406740"
