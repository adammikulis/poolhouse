variants = [{name = "Pending", role = "ProtectedPrepared"}, {name = "Authenticated", role = "ProtectedAuthenticated"}, {name = "Cancelled", role = "ProtectedCancelled"}, {name = "Unknown", role = "ProtectedRecovery"}]

[[outcome]]
