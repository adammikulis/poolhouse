[[observation]]
name = "OsServiceStatus"
variants = ["NotRegistered", "RegisteredEligible", "RequiresConsent", "NotFound", "Unknown"]

[[observation]]
name = "OsConsentState"
variants = ["NotRequired", "Pending", "Satisfied", "Denied", "Withdrawn", "Unavailable", "Unknown"]

[[observation]]
name = "ServiceReadiness"
variants = ["Ready", "NotRunning", "StorageUnavailable", "Unknown"]

[[observation]]
name = "PassiveServiceAvailability"
variants = ["BindingUnavailable", "PlistAbsent", "Unverified", "NotRegistered", "RegisteredEligible", "RequiresConsent", "NotFound", "Unknown"]

[[outcome]]
name = "ServiceProgress"
graph = "StartupGraph"
variants = [{name = "Pending", role = "StartupPending"}, {name = "Committed", role = "StartupTerminal"}, {name = "Unknown", role = "StartupRecovery"}]

[[outcome]]
name = "ServicePendingState"
