version = 1
status = "incomplete-proposal"
visibility = "crate-private-sealed"
serialization = "forbidden"
native_graph = "NativeInstallationGraph"
effect_graph = "EffectGraph"
transcript_profile = "unresolved-no-production-validation"
requirements = ["activate-does-not-implicitly-configure-startup-mode", "activation-authorization-is-installed-supervisor-native-os-caller-admission-not-a-public-boolean", "activation-only-starts-or-attaches-owned-service-and-grants-no-domain-or-installation-right", "activation-requires-admitted-native-os-launch-rights-not-raw-channel-facts-alone", "activation-unknown-retains-actual-attempt-channel-service-and-cleanup-owner", "authorization-alone-selects-owned-service-no-independent-target-argument", "cancel-and-commit-use-one-atomic-terminal-fence", "cancelled-requires-restored-and-verified-prior-effective-state", "cold-start-activation-needs-no-running-node-effect-permit-or-caller-message", "commit-winner-is-reported-committed-after-cancel-race", "configuration-and-protected-graphs-inherit-same-installation-type-and-owner-scope", "consume-and-cancel-are-atomic-and-one-shot", "consume-revalidates-current-installation-head-generation-nonce-and-expiry", "disconnect-owner-code-or-authority-change-retains-cancellation-custody", "drop-is-not-rollback-reap-or-domain-completion", "fresh-authentication-is-opaque-and-not-a-dialog-boolean", "helper-does-not-schedule-or-discover-product-work", "inspection-is-passive-and-does-not-create-projects-claims-identities-or-consent", "minimal-inspection-and-activation-have-no-producer-effect-or-protected-profile-prerequisite", "neither-allows-ordinary-authorized-attach-and-demand-activation-without-product-approval", "neither-controls-scheduling-not-authorized-demand-availability", "no-platform-implementation-issuer-or-native-acceptance-claim", "no-v1-fallback-no-json-proof-no-arbitrary-digest-signing", "normal-policy-authorization-does-not-imply-a-protected-presentation", "one-owned-service-installation-endpoint-storage-and-principal-for-all-modes", "one-pending-startup-change-per-owned-service", "only-node-owned-opaque-authorization-can-prepare-a-change", "os-consent-denial-withdrawal-and-storage-unavailability-remain-distinct", "os-consent-is-not-persisted-as-governed-approval", "os-registration-is-not-effective-mode-service-readiness-or-product-approval", "owned-recovery-origin-retains-original-phase-snapshot-authentication-and-native-resources", "passive-app-and-plist-binding-is-fixed-planned-and-currently-absent", "passive-inspection-resumes-existing-pending-operation-without-reprompt", "passive-observation-never-registers-starts-unregisters-prompts-or-grants-rights", "passive-preinstall-observation-needs-no-installation-or-service-capability", "passive-registration-eligibility-is-not-identity-principal-readiness-mode-or-authority", "passive-timestamp-is-not-freshness-authority-and-reason-is-bounded-value-free", "prepare-binds-original-operation-generation-request-revision-and-prior-effective-state", "protected-result-binds-current-owner-session-helper-code-and-visible-snapshot", "protected-result-binds-exact-original-scoped-operation-and-native-message", "requires-approval-os-status-does-not-distinguish-pending-denied-or-withdrawn-consent", "same-native-effect-and-invariant-owner-scope-through-every-handle", "service-scope-is-generative-invariant-and-identity-revalidated-before-effects", "storage-unavailability-cannot-project-ready", "unknown-retains-operation-service-custody-and-cleanup-obligation", "unresolved-drop-transfers-custody-to-owner-and-never-settles-domain-state", "unresolved-transcript-profile-forbids-production-validation"]

[passive]
trait = "NativeServiceAvailability"
input = "none"
authority = "untrusted-observation-only"
containing_app_identifier = "app.poolhouse.app"
bundled_plist = "Contents/Library/LaunchDaemons/app.poolhouse.node.plist"
binding_status = "planned-currently-absent-not-installed-service-identity"
fields = [{name = "availability", type = "PassiveServiceAvailability"}, {name = "observed_at", type = "UnixMicros"}, {name = "reason", type = "SafeMessage"}]
os_status_mapping = {not_registered = "NotRegistered", enabled = "RegisteredEligible", requires_approval = "RequiresConsent", not_found = "NotFound", unrecognized_or_error = "Unknown"}

[passive.ffi]
version = 1
function = "ph_passive_service_observe_v1"
representation = "in-process-untrusted-data-only"
size = 16
alignment = 8
fields = [{name = "observed_at", type = "u64", offset = 0}, {name = "availability", type = "u32", offset = 8}, {name = "reason", type = "u32", offset = 12}]
results = [{name = "Ok", code = 0}, {name = "InvalidOutput", code = 1}]
# Explicit assignments are ABI semantics; changes require a reviewed versioned boundary.
availability = [
  {name = "Unknown", code = 0},
  {name = "BindingUnavailable", code = 1},
  {name = "PlistAbsent", code = 2},
  {name = "Unverified", code = 3},
  {name = "NotRegistered", code = 4},
  {name = "RegisteredEligible", code = 5},
  {name = "RequiresConsent", code = 6},
  {name = "NotFound", code = 7},
]
reasons = [
  {name = "Unknown", code = 0, message = "Service availability is unknown."},
  {name = "ContainingAppUnavailable", code = 1, message = "The designated containing app is unavailable."},
  {name = "ContainingAppInspectionUnavailable", code = 2, message = "The containing app cannot be inspected."},
  {name = "PlistAbsent", code = 3, message = "The planned bundled service plist is absent."},
  {name = "LocationUnverified", code = 4, message = "The bundled service location is unverified."},
  {name = "PlistUnverified", code = 5, message = "The bundled service plist is unverified."},
  {name = "PlistReadUnavailable", code = 6, message = "The bundled service plist cannot be read."},
  {name = "PlistBindingMismatch", code = 7, message = "The bundled service plist does not match its planned binding."},
  {name = "SealUnverified", code = 8, message = "The containing app seal is unverified."},
  {name = "SigningLabelMismatch", code = 9, message = "The containing app signing label is inconsistent."},
  {name = "PlistChanged", code = 10, message = "The bundled service plist changed during inspection."},
  {name = "EligibilityOnly", code = 11, message = "Registration eligibility only; installation and runtime readiness are unverified."},
  {name = "StatusUnavailable", code = 12, message = "Native service registration observation is unavailable."},
  {name = "ClockUnavailable", code = 13, message = "The observation clock is unavailable."},
]

[[graph]]
name = "ActivationGraph"
inherits = ""
native = "NativeInstallationGraph"
effect = false

[[graph]]
name = "StartupGraph"
inherits = "ActivationGraph"
native = "NativeGraph"
effect = true

[[graph]]
name = "ProtectedGraph"
inherits = "StartupGraph"
native = "NativeGraph"
effect = false

[[role]]
