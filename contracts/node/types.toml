[[type]]
name = "NoParent"
kind = "record"
visibility = "private"
fields = []

[[type]]
name = "ParentThread"
kind = "record"
visibility = "private"
fields = [{name = "thread_id", type = "NativeThreadId"}]

[[type]]
name = "NativeParent"
kind = "union"
visibility = "private"
tag = "kind"
variants = [{tag = "none", type = "NoParent"}, {tag = "thread", type = "ParentThread"}]

[[type]]
name = "NativeSessionContext"
kind = "record"
visibility = "private"
fields = [{name = "actor", type = "NativeThreadId"}, {name = "root", type = "NativeThreadId"}, {name = "direct_parent", type = "NativeParent"}]

[[type]]
name = "ProcessObservation"
kind = "union"
visibility = "private"
tag = "platform"
variants = [{tag = "linux", type = "LinuxProcessObservation"}, {tag = "windows", type = "WindowsProcessObservation"}, {tag = "macos", type = "MacProcessObservation"}]
