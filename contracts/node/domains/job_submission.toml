request = "JobPreparationControlRequest"
response = "JobPreparationView"
error = "JobError"
authorization = ["authenticated-current-principal", "installation-local-scope-no-pool-join-prerequisite", "current-installation-incarnation-and-repair-permission", "no-existence-disclosure-before-authorization", "decoded-references-and-observations-confer-no-authority", "no-public-path-command-environment-url-or-secret-selection", "request-id-principal-installation-incarnation-operation-and-normalized-payload-bound", "reauthorize-before-replay-and-domain-commit", "durable-cancel-versus-domain-commit-single-winner", "repair-no-cancelled-after-replacement-commit-fence", "classifier-no-cancelled-after-output-publication", "generation-equals-preparation-and-installation-generation", "compare-and-swap-preparation-revision", "same-plan-at-most-once-even-with-new-request-id", "repair-unresolved-installation-operation-blocks-new-plan-bypass", "classifier-unresolved-intent-and-output-owner-block-new-plan-restart", "fresh-exact-plan-bound-protected-authority-and-separate-os-consent-where-required", "stale-approval-or-consent-callback-refuses", "repair-rechecks-candidate-manifest-source-policy-launcher-prior-state-and-expiry", "classifier-rechecks-held-dataset-constructor-config-profile-and-output-custody", "revalidate-resource-admission-before-intent-execution", "repair-drains-active-work-at-owned-replacement-boundary", "durable-intent-consumption-fence-before-irreversible-handoff", "fence-is-not-success-or-permission", "repair-one-owned-existing-replacement-path-no-parallel-launcher-or-scheduler", "classifier-one-admitted-worker-path-no-new-scheduler", "lost-ack-or-crash-retains-custody-and-reconciles-never-blind-retry", "repair-unknown-effect-retains-candidate-backup-launcher-fence-until-protected-inspection", "classifier-unknown-retains-worker-checkpoint-output-and-launch-publication-fences", "repair-verifies-installed-artifact-health-source-and-runtime-before-success", "classifier-launch-fence-distinct-from-verified-output-publication", "classifier-cancel-after-launch-req