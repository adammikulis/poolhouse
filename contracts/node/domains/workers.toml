version = 1
status = "proposal"
operation = []

[[type]]
name = "WorkerSlotId"
kind = "scalar"
visibility = "private"
encoding = "uuid"
issuer = "node"

[[type]]
name = "WorkerRuntimeId"
kind = "scalar"
visibility = "private"
encoding = "uuid"
issuer = "node"

[[type]]
name = "WorkerDeviceId"
kind = "scalar"
visibility = "private"
encoding = "uuid"
issuer = "node"

[[type]]
name = "WorkerDigest"
kind = "scalar"
visibility = "private"
encoding = "hex32"
issuer = "data"

[[type]]
name = "WorkerDecisionDtype"
