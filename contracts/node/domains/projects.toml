# Proposal: project/board catalog, local locations and coding selection only.
version = 1
status = "proposal"

[[type]]
name = "ProjectLocationId"
kind = "scalar"
visibility = "public"
encoding = "uuid"
issuer = "node"

[[type]]
name = "ProjectSourceId"
kind = "scalar"
visibility = "public"
encoding = "uuid"
issuer = "node"

[[type]]
name = "ProjectCreationId"
kind = "scalar"
visibility = "public"
encoding = "uuid"
issuer = "node"

[[type]]
name = "ProjectSelectionScopeId"
kind = "scalar"
visibility = "public"
encoding = "uuid"
issuer = "node"

[[type]]
name = "ProjectCatalogSnapshotId"
kind = "scalar"
visibility = "public"
encoding = "uuid"
issuer = "node"

[[type]]
name = "ProjectCatalogCursor"
kind = "scalar"
visibility = "public"
encoding = "text"
issuer = "node"
min_bytes = 1
max_bytes = 2048

[[type]]
name = "ProjectAlias"
kind = "scalar"
visibility = "public"
encoding = "text"
issuer = "data"
min_bytes = 1
max_bytes = 48

[[type]]
name = "ProjectCatalogTitle"
kind = "scalar"
visibility = "public"
