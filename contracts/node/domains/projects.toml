kind = "record"
visibility = "public"
fields = [{name = "project", type = "ProjectCatalogRef"}, {name = "board_id", type = "BoardId"}, {name = "generation", type = "ResourceGeneration"}, {name = "pool", type = "ConnectivityOptionalPoolRef"}]

