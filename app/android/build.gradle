buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath "com.android.tools.build:gradle:${providers.gradleProperty('androidPlugin').get()}" }
}
apply plugin: 'com.android.application'

repositories { google(); mavenCentral() }

def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
if (!sdkRoot) throw new GradleException('Set ANDROID_HOME to an SDK whose license the owner has accepted.')
def platforms = new File(sdkRoot, 'platforms').listFiles()?.findAll { it.name ==~ /android-\d+/ }
def api = providers.gradleProperty('androidApi').map { it.toInteger() }.getOrElse(
    platforms?.collect { it.name.substring('android-'.length()).toInteger() }?.max() ?: 0)
if (api < 30) throw new GradleException('Install an Android SDK platform supporting authentication-bound device credentials.')
def metadata = file('../../pyproject.toml').getText('UTF-8')
def appVersion = (metadata =~ /(?m)^version = "([^"]+)"/)[0][1]
def parts = appVersion.tokenize('.').collect { it.replaceAll(/[^0-9].*$/, '').toInteger() }

android {
    namespace 'app.poolhouse.phone'
    compileSdk api
    buildToolsVersion = providers.gradleProperty('androidBuildTools').getOrElse('36.0.0')
    defaultConfig {
        applicationId 'app.poolhouse.phone'
        minSdk 30
        targetSdk api
        versionName appVersion
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
    }
    signingConfigs {
        preview {
            if (System.getenv('ANDROID_SIGNING_STORE')) {
                storeFile file(System.getenv('ANDROID_SIGNING_STORE'))
                storePassword System.getenv('ANDROID_SIGNING_PASSWORD')
                keyAlias 'poolhouse-preview'
                keyPassword System.getenv('ANDROID_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (System.getenv('ANDROID_SIGNING_STORE')) signingConfig signingConfigs.preview
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}

configurations { protocol }
dependencies { protocol 'org.json:json:20240303' }

def phone = 'src/main/java/app/poolhouse/phone/'
def checked = ['Hex', 'Canonical', 'Challenge', 'ApprovalText', 'ApprovalView', 'WebPushCipher', 'AddLink', 'Authorizer', 'Transport', 'NodeError',
               'NodeApi', 'AddRequest', 'Decider', 'ApprovalFlow', 'PushPayload', 'NotificationModel', 'PushChannel', 'PushHandler',
               'PinnedHttps', 'ChatLink', 'ChatSetup'].collect { phone + it + '.java' }
def checks = ['SoftwareAuthorizer', 'PhoneApprovalTest', 'PhoneProtocolTest'].collect { 'src/test/java/app/poolhouse/phone/' + it + '.java' }
tasks.register('compileProtocol', JavaCompile) {
    source = files(checked + checks)
    classpath = configurations.protocol
    destinationDirectory = layout.buildDirectory.dir('protocol')
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.register('chatChecks', JavaExec) {
    dependsOn 'compileProtocol'
    classpath = configurations.protocol + files(layout.buildDirectory.dir('protocol'))
    mainClass = 'app.poolhouse.phone.PhoneProtocolTest'
}
tasks.register('approvalChecks', JavaExec) {
    dependsOn 'compileProtocol'
    classpath = configurations.protocol + files(layout.buildDirectory.dir('protocol'))
    mainClass = 'app.poolhouse.phone.PhoneApprovalTest'
    args = [file('../../tests/fixtures/phone-approval-vectors.json').path, file('../../contracts/phone-friction.json').path]
}
tasks.register('protocolChecks') { dependsOn 'chatChecks', 'approvalChecks' }
