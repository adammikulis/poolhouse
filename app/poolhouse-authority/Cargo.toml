[package]
name = "poolhouse-authority"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
poolhouse-manifest = { path = "../poolhouse-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"] }
ring = "0.17.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
