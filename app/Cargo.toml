[workspace]
resolver = "2"
members = ["poolhouse-node", "phone-governance-jni", "src-tauri", "poolhouse-authority", "poolhouse-manifest"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
